<style>
  @font-face { font-family: 'system-mono'; src: local('Menlo'); }
  html, body { margin: 0; padding: 0; background: #0B1B2B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, system-ui, sans-serif; color: #C9D2DA; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .cond { font-family: -apple-system, system-ui, sans-serif; }
  ::selection { background: #D99A3D; color: #0B1B2B; }
  input, select, textarea, button { font-family: inherit; }

  button { -webkit-appearance: none; appearance: none; }

    border-bottom: 1px solid #1E3247;

    align-items: center;

/* ---------- Helpers de fecha ---------- */

  const minutosFinales = totalMin % 60;
  const diasExtra = Math.floor(totalMin / 1440);

function feriadoEnFecha(fechaIso) {

function startOfWeek(d) {

/* ---------- Exportación ICS ---------- */
function toICSDate(dateStr, timeStr) {
  const parts = dateStr.split("-");
  const tparts = (timeStr || "00:00").split(":");
  return parts[0] + parts[1] + parts[2] + "T" + pad(tparts[0]) + pad(tparts[1]) + "00";
}
function buildICS(evento) {
  const dtStart = toICSDate(evento.fecha, evento.hora || "08:00");
  const horaParts = (evento.hora || "08:00").split(":");
  const startDate = new Date(
    parseInt(evento.fecha.slice(0, 4)),
    parseInt(evento.fecha.slice(5, 7)) - 1,
    parseInt(evento.fecha.slice(8, 10)),
    parseInt(horaParts[0]), parseInt(horaParts[1])
  );
  const endDate = new Date(startDate.getTime() + (evento.duracion || 30) * 60000);
  const dtEnd = endDate.getFullYear() + pad(endDate.getMonth() + 1) + pad(endDate.getDate()) + "T" + pad(endDate.getHours()) + pad(endDate.getMinutes()) + "00";
  const now = new Date();
  const dtStamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "T" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + "Z";
  function esc(s) { return (s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bitacora Operativa//ES", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + evento.id + "@bitacora-operativa",
    "DTSTAMP:" + dtStamp,
    "DTSTART:" + dtStart,
    "DTEND:" + dtEnd,
    "SUMMARY:" + esc(evento.titulo),
    "DESCRIPTION:" + esc("Responsable: " + (evento.responsable || "-") + "\\nPrioridad: " + (evento.prioridad || "-") + "\\nNotas: " + (evento.notas || "-")),
    evento.lugar ? "LOCATION:" + esc(evento.lugar) : null,
    "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT15M",
    "DESCRIPTION:" + esc(evento.titulo),
    "END:VALARM", "END:VEVENT", "END:VCALENDAR",
  ].filter(Boolean);
  return lines.join("\r\n");
}
function downloadICS(evento) {
  const ics = buildICS(evento);
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const safeName = (evento.titulo || "evento").replace(/[^a-zA-Z0-9]+/g, "_").slice(0, 40);
  a.download = evento.fecha + "_" + safeName + ".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadICSBatch(eventos, nombre) {
  const blocks = eventos.map(function (e) {
    const ics = buildICS(e);
    const start = ics.indexOf("BEGIN:VEVENT");
    const end = ics.indexOf("END:VEVENT") + "END:VEVENT".length;
    return ics.slice(start, end);
  });
  const full = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bitacora Operativa//ES", "CALSCALE:GREGORIAN"].concat(blocks, ["END:VCALENDAR"]).join("\r\n");
  const blob = new Blob([full], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (nombre || "bitacora") + ".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// versión del archivo, para que el usuario pueda confirmar en el menú lateral que
// está usando la última versión trabajada (útil si tiene el archivo en más de
// un dispositivo y quiere verificar cuál subió más recientemente a cada uno).
const APP_VERSION = "2026.06.30-8";

const CAMPOS_PERSISTENTES = [
  { campo: "eventos", clave: STORAGE_KEY },
  { campo: "categorias", clave: CAT_KEY },
  { campo: "responsables", clave: RESP_KEY },
  { campo: "personal", clave: PERSONAL_KEY },

];

// Historial para "Deshacer": antes de cada guardado, se empuja una copia del
// estado ANTERIOR (tal como estaba antes de este cambio) a una pila en memoria,
// limitada a 10 pasos. Cubre cualquier acción que pase por persist() — es decir,
// prácticamente todo cambio de datos de la app (crear, editar, eliminar, marcar
// completado, mover, etc.), porque persist() es el único punto de guardado.
const HISTORIAL_MAX = 10;
let historialDeshacer = [];
let aplicandoDeshacer = false;

function persist() {
  if (!aplicandoDeshacer) {
    const snapshotAnterior = {};
    CAMPOS_PERSISTENTES.forEach(function (c) {
      snapshotAnterior[c.campo] = loadLocal(c.clave, null);
    });
    historialDeshacer.push(snapshotAnterior);
    if (historialDeshacer.length > HISTORIAL_MAX) historialDeshacer.shift();
  }
  CAMPOS_PERSISTENTES.forEach(function (c) {
    saveLocal(c.clave, state[c.campo]);
  });
}

function puedeDeshacer() {
  return historialDeshacer.length > 0;
}

function deshacerUltimoCambio() {
  const anterior = historialDeshacer.pop();
  if (!anterior) return;
  aplicandoDeshacer = true;
  CAMPOS_PERSISTENTES.forEach(function (c) {
    const valorPrevio = anterior[c.campo];
    // Si el campo no existía antes (ej. la app no tenía aún esa sección), se
    // restaura al valor por defecto correspondiente en vez de dejarlo null.
    state[c.campo] = valorPrevio !== null && valorPrevio !== undefined ? valorPrevio : (Array.isArray(state[c.campo]) ? [] : state[c.campo]);
    saveLocal(c.clave, state[c.campo]);
  });
  aplicandoDeshacer = false;
  render();
}

function eventosVisibles() {
  // Las tareas completadas se muestran en semana/mes (tachadas, más oscuras) salvo
  // que el usuario active "Ocultar completadas"; el listado "Tareas Completadas"
  // sigue existiendo además como vista de archivo histórico. El filtro de ocultar
  // completadas para eventos multi-día se aplica por día dentro de eventosPorFecha(),
  // ya que un mismo evento puede estar completado en un día y no en otro.
  let base = state.eventos.slice();
  if (state.ocultarCompletadasCalendario) {
    base = base.filter(function (e) { return !todoElRangoCompletado(e) || esMultiDiaEvento(e); });
  }
  if (state.filtroCategorias && state.filtroCategorias.length) {
    base = base.filter(function (e) { return state.filtroCategorias.indexOf(e.categoria) !== -1; });
  }
  if (state.filtroResponsables && state.filtroResponsables.length) {
    base = base.filter(function (e) { return state.filtroResponsables.indexOf(e.responsable || "") !== -1; });
  }
  if (state.soloInterdepartamental) {
    base = base.filter(function (e) { return !!e.interdepartamental; });
  }
  if (state.busqueda && state.busqueda.trim()) {
    const q = state.busqueda.trim().toLowerCase();
    base = base.filter(function (e) {
      return (e.titulo || "").toLowerCase().indexOf(q) !== -1 ||
        (e.notas || "").toLowerCase().indexOf(q) !== -1 ||
        (e.lugar || "").toLowerCase().indexOf(q) !== -1;
    });
  }
  return base;
}
function eventosCompletados() {
  return state.eventos
    .filter(function (e) { return todoElRangoCompletado(e); })
    .sort(function (a, b) { return (b.fecha + (b.hora || "")).localeCompare(a.fecha + (a.hora || "")); });
}
function eventosPorFecha() {
  const map = {};
  eventosVisibles().forEach(function (e) {
    const fin = e.fechaFin && e.fechaFin > e.fecha ? e.fechaFin : e.fecha;
    let cursor = new Date(e.fecha + "T00:00:00");
    const finDate = new Date(fin + "T00:00:00");
    while (cursor <= finDate) {
      const iso = fmtISO(cursor);
      // Si está activo "ocultar completadas" y este evento multi-día ya está
      // completado específicamente en este día, no lo agregamos a esta celda
      // (aunque el evento en otras fechas del rango sí pueda seguir visible).
      const ocultarAqui = state.ocultarCompletadasCalendario && estaCompletadoEnFecha(e, iso);
      if (!ocultarAqui) {
        if (!map[iso]) map[iso] = [];
        map[iso].push(e);
      }
      cursor = addDays(cursor, 1);
    }
  });
  Object.keys(map).forEach(function (k) {
    map[k].sort(function (a, b) {
      // Las tareas completadas siempre van al final del día, sin importar su hora.
      const aCompletado = estaCompletadoEnFecha(a, k);
      const bCompletado = estaCompletadoEnFecha(b, k);
      if (aCompletado !== bCompletado) return aCompletado ? 1 : -1;
      return (a.hora || "").localeCompare(b.hora || "");
    });
  });
  return map;
}

const REPETICION_HORIZONTE_DEFAULT = 12; // si no se especifica fecha límite, número de ocurrencias futuras
const REPETICION_TOPE_SEGURIDAD = 200; // límite duro para evitar generar miles de eventos por error

function sumarRepeticion(fechaISO, tipo) {
  const d = new Date(fechaISO + "T00:00:00");
  if (tipo === "diaria") return fmtISO(addDays(d, 1));
  if (tipo === "semanal") return fmtISO(addDays(d, 7));
  if (tipo === "mensual") {
    const nuevo = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate());
    return fmtISO(nuevo);
  }
  return fechaISO;
}

function guardarEvento(data) {
  if (state.eventoEditando) {
    if (state.editarSerieCompleta) {
      // Editar toda la serie: se replican los campos de CONTENIDO (no la fecha
      // individual de cada ocurrencia, ni su estado de completado) a todos los
      // eventos que comparten el mismo repetSerieId.
      const serieId = state.editarSerieCompleta;
      const camposContenido = {
        titulo: data.titulo, hora: data.hora, duracion: data.duracion,
        categoria: data.categoria, responsable: data.responsable, prioridad: data.prioridad,
        lugar: data.lugar, notas: data.notas, interdepartamental: data.interdepartamental,
      };
      state.eventos = state.eventos.map(function (e) {
        return e.repetSerieId === serieId ? Object.assign({}, e, camposContenido) : e;
      });
      state.editarSerieCompleta = null;
    } else {
      state.eventos = state.eventos.map(function (e) {
        return e.id === state.eventoEditando.id ? Object.assign({}, e, data) : e;
      });
    }
  } else {
    const serieId = (data.repetir && data.repetir !== "nunca") ? uid() : null;
    const primero = Object.assign({ id: uid() }, data, serieId ? { repetSerieId: serieId } : {});
    state.eventos.push(primero);

    if (serieId) {
      // Generar ocurrencias futuras manteniendo la misma duración del rango (fecha → fechaFin).
      // Si el usuario indicó una fecha límite de repetición (data.repetirHasta), se generan
      // ocurrencias hasta esa fecha inclusive; si no, se usa el horizonte por defecto (12).
      // En ambos casos se respeta un tope duro de seguridad.
      const diasRango = Math.round((new Date(data.fechaFin + "T00:00:00") - new Date(data.fecha + "T00:00:00")) / 86400000);
      let fechaCursor = data.fecha;
      let i = 0;
      while (i < REPETICION_TOPE_SEGURIDAD) {
        fechaCursor = sumarRepeticion(fechaCursor, data.repetir);
        if (data.repetirHasta && fechaCursor > data.repetirHasta) break;
        if (!data.repetirHasta && i >= REPETICION_HORIZONTE_DEFAULT) break;
        const fechaFinCursor = fmtISO(addDays(new Date(fechaCursor + "T00:00:00"), diasRango));
        state.eventos.push(Object.assign({}, data, {
          id: uid(),
          fecha: fechaCursor,
          fechaFin: fechaFinCursor,
          repetSerieId: serieId,
          completado: false,
        }));
        i++;
      }
    }
  }
  persist();
  state.modal = null;
  render();
}
function eliminarEvento(id) {
  state.eventos = state.eventos.filter(function (e) { return e.id !== id; });
  persist();

function pedirConfirmacionEliminar(id) {

function esMultiDiaEvento(ev) {
  return !!(ev.fechaFin && ev.fechaFin > ev.fecha);
}
function estaCompletadoEnFecha(ev, fechaIso) {
  if (esMultiDiaEvento(ev)) {
    return Array.isArray(ev.completadoFechas) && ev.completadoFechas.indexOf(fechaIso) !== -1;
  }
  return !!ev.completado;
}
function todoElRangoCompletado(ev) {
  if (!esMultiDiaEvento(ev)) return !!ev.completado;
  const dias = [];
  let cursor = new Date(ev.fecha + "T00:00:00");
  const fin = new Date(ev.fechaFin + "T00:00:00");
  while (cursor <= fin) { dias.push(fmtISO(cursor)); cursor = addDays(cursor, 1); }
  const marcadas = Array.isArray(ev.completadoFechas) ? ev.completadoFechas : [];
  return dias.every(function (d) { return marcadas.indexOf(d) !== -1; });
}

// Determina si un evento tiene al menos un día de su rango que ya pasó (antes de
// hoy) y que todavía no fue marcado como completado. Para eventos de un solo día
// es simplemente: fecha pasada y no completado. Esta es la definición correcta de
// "vencido" a nivel de evento completo (para contadores globales), a diferencia
// de "vencido en esta celda específica" que usa estaCompletadoEnFecha con la
// fecha de esa celda puntual.
function tieneAlgunDiaVencidoSinCompletar(ev, hoyISO) {
  if (!esMultiDiaEvento(ev)) {
    return !ev.completado && ev.fecha < hoyISO;
  }
  let cursor = new Date(ev.fecha + "T00:00:00");
  const fin = new Date(ev.fechaFin + "T00:00:00");
  while (cursor <= fin) {
    const iso = fmtISO(cursor);
    if (iso < hoyISO && !estaCompletadoEnFecha(ev, iso)) return true;
    cursor = addDays(cursor, 1);
  }
  return false;
}

// toggleEstado(id, fechaIso): para eventos de un solo día, fechaIso se ignora y se
// alterna el campo "completado" simple. Para eventos multi-día, se alterna SOLO
// el día indicado dentro de completadoFechas, sin afectar el resto del rango.
function toggleEstado(id, fechaIso) {
  const ahoraISO = new Date().toISOString();
  state.eventos = state.eventos.map(function (e) {
    if (e.id !== id) return e;
    if (esMultiDiaEvento(e) && fechaIso) {
      const actuales = Array.isArray(e.completadoFechas) ? e.completadoFechas.slice() : [];
      const timestamps = Object.assign({}, e.completadoFechasTimestamp || {});
      const idx = actuales.indexOf(fechaIso);
      if (idx === -1) { actuales.push(fechaIso); timestamps[fechaIso] = ahoraISO; }
      else { actuales.splice(idx, 1); delete timestamps[fechaIso]; }
      return Object.assign({}, e, {
        completadoFechas: actuales,
        completadoFechasTimestamp: timestamps,
        completado: todoElRangoCompletado(Object.assign({}, e, { completadoFechas: actuales })),
      });
    }
    const nuevoEstado = !e.completado;
    return Object.assign({}, e, { completado: nuevoEstado, completadoEn: nuevoEstado ? ahoraISO : null });
  });
  persist();
  render();
}

// Devuelve el timestamp ISO de cuándo se marcó como completada una fecha específica
// (o el evento entero, si no es multi-día), o null si no está completada.
function obtenerTimestampCompletado(ev, fechaIso) {
  if (esMultiDiaEvento(ev) && fechaIso) {
    return (ev.completadoFechasTimestamp && ev.completadoFechasTimestamp[fechaIso]) || null;
  }
  return ev.completadoEn || null;
}

// Si el evento pertenece a una serie de repetición, pregunta si la acción aplica
// solo a esta ocurrencia o a toda la serie, antes de proceder.
function iniciarToggle(id, fechaIso) {
  const ev = state.eventos.find(function (e) { return e.id === id; });
  if (ev && ev.repetSerieId) {
    state.eleccionSerie = { eventoId: id, accion: "toggle", fechaIso: fechaIso };
    render();
  } else {
    toggleEstado(id, fechaIso);
  }
}
function iniciarEditar(id) {
  const ev = state.eventos.find(function (e) { return e.id === id; });
  if (!ev) return;
  if (ev.repetSerieId) {
    state.eleccionSerie = { eventoId: id, accion: "editar" };
    render();
  } else {
    abrirEditar(ev);
  }
}
function resolverEleccionSerie(alcance) {
  const eleccion = state.eleccionSerie;
  if (!eleccion) return;
  const ev = state.eventos.find(function (e) { return e.id === eleccion.eventoId; });
  state.eleccionSerie = null;
  if (!ev) { render(); return; }

  if (eleccion.accion === "toggle") {
    if (alcance === "ocurrencia") {
      toggleEstado(ev.id, eleccion.fechaIso);
    } else {
      const nuevoEstado = !ev.completado;
      state.eventos = state.eventos.map(function (e) {
        return e.repetSerieId === ev.repetSerieId ? Object.assign({}, e, { completado: nuevoEstado }) : e;
      });
      persist();
      render();
    }
  } else if (eleccion.accion === "editar") {
    if (alcance === "ocurrencia") {
      abrirEditar(ev);
    } else {
      // Editar toda la serie: se abre el formulario sobre esta ocurrencia, pero al
      // guardar se replican los cambios de contenido (no de fecha) a toda la serie.
      state.editarSerieCompleta = ev.repetSerieId;
      abrirEditar(ev);
    }
  } else {
    render();
  }
}
function cancelarEleccionSerie() {
  state.eleccionSerie = null;
  render();
}

function moverAHoy(id) {
  const hoyISO = fmtISO(new Date());
  state.eventos = state.eventos.map(function (e) {
    if (e.id !== id) return e;
    const update = { fecha: hoyISO };
    if (e.fechaFin && e.fechaFin > e.fecha) {
      const diasRango = Math.round((new Date(e.fechaFin + "T00:00:00") - new Date(e.fecha + "T00:00:00")) / 86400000);
      update.fechaFin = fmtISO(addDays(new Date(hoyISO + "T00:00:00"), diasRango));
    } else {
      update.fechaFin = hoyISO;
    }
    return Object.assign({}, e, update);
  });
  persist();
  render();
}
function moverTodosVencidos() {
  const hoyISO = fmtISO(new Date());
  state.eventos = state.eventos.map(function (e) {
    if (todoElRangoCompletado(e) || e.fecha >= hoyISO) return e;
    // No mover eventos multi-día que ya tienen al menos un día marcado como
    // completado: mover todo el rango perdería ese progreso parcial registrado.
    if (esMultiDiaEvento(e) && Array.isArray(e.completadoFechas) && e.completadoFechas.length > 0) return e;
    const update = { fecha: hoyISO };
    if (e.fechaFin && e.fechaFin > e.fecha) {
      const diasRango = Math.round((new Date(e.fechaFin + "T00:00:00") - new Date(e.fecha + "T00:00:00")) / 86400000);
      update.fechaFin = fmtISO(addDays(new Date(hoyISO + "T00:00:00"), diasRango));
    } else {
      update.fechaFin = hoyISO;
    }
    return Object.assign({}, e, update);
  });
  persist();
  render();
}

        '<div class="campo"><label class="campo-label mono">TIPO</label><div class="prio-row" id="hecho-tipo-row" data-value="' + tipo + '">' + tipoBtns + '</div></div>' +
        '<div class="campo"><label class="campo-label mono">FECHA</label><input class="field" type="date" id="hecho-fecha" value="' + fecha + '" /></div>' +
        '<div class="campo"><label class="campo-label mono">DESCRIPCIÓN</label><textarea class="field" id="hecho-descripcion" rows="4" placeholder="Describe el hecho de forma objetiva…">' + escapeHTML(descripcion) + '</textarea></div>' +
        '<div id="hecho-error"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel cond" id="btn-cancelar-hecho">Cancelar</button>' +
          '<button class="btn-guardar cond" id="btn-guardar-hecho">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

// Modal de confirmación genérico reutilizable (para personas, hechos y delegaciones).
function renderModalConfirmarEliminarGenerico(titulo, mensaje, idCancelar, idConfirmar) {

    '<div class="overlay" id="overlay-confirmar-generico">' +
      '<div class="modal" style="max-width:360px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono" style="color:#E0524A">' + titulo.toUpperCase() + '</div>' +
        '</div>' +
        '<div class="cond" style="font-size:14px;color:#C9D2DA;line-height:1.5;margin-bottom:18px">' + escapeHTML(mensaje) + '</div>' +

          '<button class="btn-cancel cond" id="' + idCancelar + '">Cancelar</button>' +

        '</div>' +

  );
}

function bindEventsPersonal() {
  if (state.seccion !== "personal") return;

  const btnNuevaPersona = document.getElementById("btn-nueva-persona");
  if (btnNuevaPersona) btnNuevaPersona.onclick = function () { state.personaEditando = null; state.modalPersonal = "persona"; render(); };

  document.querySelectorAll("[data-action='abrir-persona']").forEach(function (el) {
    el.onclick = function () { state.personaSeleccionada = el.getAttribute("data-id"); render(); };
  });

  const btnVolver = document.getElementById("btn-volver-personal");
  if (btnVolver) btnVolver.onclick = function () { state.personaSeleccionada = null; state.filtroTipoHecho = "todos"; render(); };

  const btnEditarPersona = document.getElementById("btn-editar-persona");
  if (btnEditarPersona) btnEditarPersona.onclick = function () {
    state.personaEditando = state.personal.find(function (p) { return p.id === state.personaSeleccionada; });
    state.modalPersonal = "persona";
    render();
  };
  const btnEliminarPersona = document.getElementById("btn-eliminar-persona");
  if (btnEliminarPersona) btnEliminarPersona.onclick = function () {
    state.eliminarPersonaPendienteId = state.personaSeleccionada;
    state.modalPersonal = "confirmarEliminarPersona";
    render();
  };

  document.querySelectorAll("[data-action='filtro-tipo-hecho']").forEach(function (el) {
    el.onclick = function () { state.filtroTipoHecho = el.getAttribute("data-tipo"); render(); };
  });

  const btnNuevoHecho = document.getElementById("btn-nuevo-hecho");
  if (btnNuevoHecho) btnNuevoHecho.onclick = function () { state.hechoEditando = null; state.modalPersonal = "hecho"; render(); };

  document.querySelectorAll("[data-action='editar-hecho']").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-id");
      state.hechoEditando = state.hechos.find(function (h) { return h.id === id; });
      state.modalPersonal = "hecho";
      render();
    };
  });
  document.querySelectorAll("[data-action='eliminar-hecho']").forEach(function (el) {
    el.onclick = function () {
      state.eliminarHechoPendienteId = el.getAttribute("data-id");
      state.modalPersonal = "confirmarEliminarHecho";
      render();
    };
  });

  // Modal persona
  const btnCerrarPersona = document.getElementById("btn-cerrar-persona");
  const btnCancelarPersona = document.getElementById("btn-cancelar-persona");
  const cerrarModalPersona = function () { state.modalPersonal = null; state.personaEditando = null; render(); };
  if (btnCerrarPersona) btnCerrarPersona.onclick = cerrarModalPersona;
  if (btnCancelarPersona) btnCancelarPersona.onclick = cerrarModalPersona;
  const overlayPersona = document.getElementById("overlay-persona");
  if (overlayPersona) overlayPersona.onclick = function (e) { if (e.target === overlayPersona) cerrarModalPersona(); };

  const btnGuardarPersona = document.getElementById("btn-guardar-persona");
  if (btnGuardarPersona) {
    btnGuardarPersona.onclick = function () {
      const nombre = document.getElementById("persona-nombre").value.trim();
      const cargo = document.getElementById("persona-cargo").value.trim();
      const errorBox = document.getElementById("persona-error");
      if (!nombre) { errorBox.innerHTML = '<div class="error-text cond">El nombre es obligatorio.</div>'; return; }
      if (state.personaEditando) {
        state.personal = state.personal.map(function (p) {
          return p.id === state.personaEditando.id ? Object.assign({}, p, { nombre: nombre, cargo: cargo }) : p;
        });
      } else {
        state.personal.push({ id: uid(), nombre: nombre, cargo: cargo });
      }
      persist();
      state.modalPersonal = null;
      state.personaEditando = null;
      render();
    };
  }

  // Confirmar eliminar persona
  const btnCancelarEliminarPersona = document.getElementById("btn-cancelar-eliminar-persona");
  if (btnCancelarEliminarPersona) btnCancelarEliminarPersona.onclick = function () { state.modalPersonal = null; state.eliminarPersonaPendienteId = null; render(); };
  const btnConfirmarEliminarPersona = document.getElementById("btn-confirmar-eliminar-persona");
  if (btnConfirmarEliminarPersona) {
    btnConfirmarEliminarPersona.onclick = function () {
      const id = state.eliminarPersonaPendienteId;
      state.personal = state.personal.filter(function (p) { return p.id !== id; });
      state.hechos = state.hechos.filter(function (h) { return h.personaId !== id; });
      persist();
      state.modalPersonal = null;
      state.eliminarPersonaPendienteId = null;
      state.personaSeleccionada = null;
      render();
    };
  }

  // Modal hecho
  const btnCerrarHecho = document.getElementById("btn-cerrar-hecho");
  const btnCancelarHecho = document.getElementById("btn-cancelar-hecho");
  const cerrarModalHecho = function () { state.modalPersonal = null; state.hechoEditando = null; render(); };
  if (btnCerrarHecho) btnCerrarHecho.onclick = cerrarModalHecho;
  if (btnCancelarHecho) btnCancelarHecho.onclick = cerrarModalHecho;
  const overlayHecho = document.getElementById("overlay-hecho");
  if (overlayHecho) overlayHecho.onclick = function (e) { if (e.target === overlayHecho) cerrarModalHecho(); };

  const tipoRow = document.getElementById("hecho-tipo-row");
  if (tipoRow) {
    tipoRow.querySelectorAll("[data-hecho-tipo]").forEach(function (btn) {
      btn.onclick = function () {
        const tipoId = btn.getAttribute("data-hecho-tipo");
        tipoRow.dataset.value = tipoId;
        tipoRow.querySelectorAll("[data-hecho-tipo]").forEach(function (b2) {
          const tid = b2.getAttribute("data-hecho-tipo");
          const t = tipoHechoById(tid);
          const active = tid === tipoId;
          b2.style.background = active ? t.color : "transparent";
          b2.style.color = active ? "#0B1B2B" : t.color;
        });
      };
    });
  }

  const btnGuardarHecho = document.getElementById("btn-guardar-hecho");
  if (btnGuardarHecho) {
    btnGuardarHecho.onclick = function () {
      const tipoSeleccionado = (document.getElementById("hecho-tipo-row") || {}).dataset.value || "constancia";
      const fecha = document.getElementById("hecho-fecha").value;
      const descripcion = document.getElementById("hecho-descripcion").value.trim();
      const errorBox = document.getElementById("hecho-error");
      if (!fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha es obligatoria.</div>'; return; }
      if (!descripcion) { errorBox.innerHTML = '<div class="error-text cond">La descripción es obligatoria.</div>'; return; }
      if (state.hechoEditando) {
        state.hechos = state.hechos.map(function (h) {
          return h.id === state.hechoEditando.id ? Object.assign({}, h, { tipo: tipoSeleccionado, fecha: fecha, descripcion: descripcion }) : h;
        });
      } else {
        state.hechos.push({ id: uid(), personaId: state.personaSeleccionada, tipo: tipoSeleccionado, fecha: fecha, descripcion: descripcion });
      }
      persist();
      state.modalPersonal = null;
      state.hechoEditando = null;
      render();
    };
  }

  // Confirmar eliminar hecho
  const btnCancelarEliminarHecho = document.getElementById("btn-cancelar-eliminar-hecho");
  if (btnCancelarEliminarHecho) btnCancelarEliminarHecho.onclick = function () { state.modalPersonal = null; state.eliminarHechoPendienteId = null; render(); };
  const btnConfirmarEliminarHecho = document.getElementById("btn-confirmar-eliminar-hecho");
  if (btnConfirmarEliminarHecho) {
    btnConfirmarEliminarHecho.onclick = function () {
      const id = state.eliminarHechoPendienteId;
      state.hechos = state.hechos.filter(function (h) { return h.id !== id; });
      persist();
      state.modalPersonal = null;
      state.eliminarHechoPendienteId = null;
      render();
    };
  }

  const overlayGenerico = document.getElementById("overlay-confirmar-generico");
  if (overlayGenerico) {
    overlayGenerico.onclick = function (e) {
      if (e.target !== overlayGenerico) return;
      if (state.modalPersonal === "confirmarEliminarPersona") { state.modalPersonal = null; state.eliminarPersonaPendienteId = null; }
      if (state.modalPersonal === "confirmarEliminarHecho") { state.modalPersonal = null; state.eliminarHechoPendienteId = null; }
      render();
    };
  }
}


/* ============================================================
   SECCIÓN DELEGACIÓN — derivada directamente de los eventos del
   calendario que tienen responsable asignado. Es la MISMA entidad:
   editar desde aquí o desde el calendario actualiza el mismo dato.
   ============================================================ */
const ESTADOS_DELEGACION = [
  { id: "no_iniciada", label: "NO INICIADA", color: "#8AA0B5" },
  { id: "en_curso", label: "EN CURSO", color: "#D99A3D" },
  { id: "lista", label: "LISTA", color: "#5FE3A1" },
];
function estadoDelegacionById(id) {
  return ESTADOS_DELEGACION.find(function (e) { return e.id === id; }) || ESTADOS_DELEGACION[0];
}
function estadoDelegacionDeEvento(ev) {
  if (ev.completado) return "lista";
  return ev.estadoDelegacion || "no_iniciada";
}
function tareasDelegadas() {
  // Cualquier evento con responsable asignado es, por definición, una tarea delegada.
  return state.eventos.filter(function (e) { return e.responsable && e.responsable.trim(); });
}

function renderSeccionDelegacion() {
  const hoyISO = fmtISO(new Date());
  const filtro = state.filtroEstadoDelegacion || "todas";
  const ocultarCompletadas = !!state.ocultarDelegacionesCompletadas;
  const respSeleccionados = state.filtroResponsablesDeleg || [];

  let tareas = tareasDelegadas().slice().sort(function (a, b) {
    return (a.fechaFin || a.fecha || "9999").localeCompare(b.fechaFin || b.fecha || "9999");
  });

  if (ocultarCompletadas) tareas = tareas.filter(function (e) { return !e.completado; });

  if (filtro !== "todas") {
    tareas = tareas.filter(function (e) { return estadoDelegacionDeEvento(e) === filtro; });
  }

  if (respSeleccionados.length) {
    tareas = tareas.filter(function (e) { return respSeleccionados.indexOf(e.responsable || "") !== -1; });
  }

  const totalCompletadas = tareasDelegadas().filter(function (e) { return e.completado; }).length;

  // Responsables presentes entre TODAS las tareas delegadas (no solo las ya filtradas),
  // para que el dropdown siempre ofrezca todas las opciones posibles.
  const responsablesEnDelegacion = Array.from(new Set(
    tareasDelegadas().map(function (e) { return e.responsable; }).filter(Boolean)
  )).sort();

  const labelResponsableDeleg = respSeleccionados.length === 0
    ? "Todos los responsables"
    : respSeleccionados.length === 1
      ? escapeHTML(respSeleccionados[0])
      : respSeleccionados.length + " responsables";

  const dropdownRespDelegHtml = state.dropdownFiltroDelegAbierto ? (
    '<div class="filtro-dropdown" id="dropdown-resp-deleg">' +
      '<div class="filtro-dropdown-header">' +
        '<button class="cond filtro-dropdown-link" data-action="filtro-resp-deleg-todos">Todos</button>' +
        '<button class="cond filtro-dropdown-link" data-action="filtro-resp-deleg-ninguno">Ninguno</button>' +
      '</div>' +
      (responsablesEnDelegacion.length === 0
        ? '<div class="cond" style="padding:8px 6px;font-size:12px;color:#5C7184;font-style:italic">Sin responsables asignados todavía.</div>'
        : responsablesEnDelegacion.map(function (r) {
            const checked = respSeleccionados.indexOf(r) !== -1;
            return '<label class="filtro-dropdown-item">' +
              '<input type="checkbox" data-action="filtro-resp-deleg-check" data-nombre="' + escapeHTML(r) + '"' + (checked ? " checked" : "") + ' />' +
              '<span class="cond">' + escapeHTML(r) + '</span>' +
            '</label>';
          }).join("")
      ) +
    '</div>'
  ) : "";

  const filtroBtns = [{ id: "todas", label: "Todas" }].concat(ESTADOS_DELEGACION.map(function (e) { return { id: e.id, label: e.label }; }))
    .map(function (f) {
      const active = filtro === f.id;
      const colorF = f.id === "todas" ? "#8AA0B5" : estadoDelegacionById(f.id).color;
      return '<button class="cond" data-action="filtro-estado-deleg" data-estado="' + f.id + '" style="padding:6px 12px;border-radius:6px;border:1px solid ' + colorF + ';background:' + (active ? colorF : "transparent") + ';color:' + (active ? "#0B1B2B" : colorF) + ';font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap">' + f.label + '</button>';
    }).join("");

  const tareasHtml = tareas.length === 0
    ? '<div class="cond" style="text-align:center;padding:40px 20px;color:#5C7184;font-style:italic">Sin tareas delegadas' + (filtro !== "todas" || respSeleccionados.length ? " con estos filtros" : "") + '.</div>'
    : tareas.map(function (ev) {
        const estadoId = estadoDelegacionDeEvento(ev);
        const estado = estadoDelegacionById(estadoId);
        const fechaRef = ev.fechaFin || ev.fecha;
        const vencida = fechaRef && fechaRef < hoyISO && !ev.completado;
        const fechaLabel = (function () {
          const d = new Date(fechaRef + "T00:00:00");
          return d.getDate() + " " + MESES_ABR[d.getMonth()];
        })();
        const cat = catById(ev.categoria);
        const colorCat = (cat && cat.color) || "#8AA0B5";
        return (
          '<div class="deleg-card" data-action="editar-delegacion" data-id="' + ev.id + '" style="border-left:6px solid ' + (vencida ? "#E0524A" : colorCat) + ';opacity:' + (ev.completado ? "0.55" : "1") + '">' +
            '<button data-action="toggle-deleg-lista" data-id="' + ev.id + '" style="width:18px;height:18px;min-width:18px;border-radius:5px;border:1.5px solid ' + (ev.completado ? "#5FE3A1" : "#2A3F54") + ';background:' + (ev.completado ? "#5FE3A1" : "transparent") + ';cursor:pointer;display:flex;align-items:center;justify-content:center;color:#0B1B2B" title="Marcar lista">' + (ev.completado ? icon("checkCircle", 12) : "") + '</button>' +
            '<div style="flex:1;min-width:0">' +
              '<div class="cond" style="font-size:14px;font-weight:600;color:#E4EAEF;' + (ev.completado ? "text-decoration:line-through" : "") + '">' + escapeHTML(ev.titulo) + '</div>' +
              '<div class="meta-row" style="margin-top:4px">' +
                '<span class="meta-resp cond">' + icon("user", 10) + ' ' + escapeHTML(ev.responsable) + '</span>' +
                '<span class="mono" style="font-size:10.5px;color:' + (vencida ? "#E0524A" : "#5C7184") + ';font-weight:' + (vencida ? "700" : "500") + '">' + (vencida ? "VENCIDA · " : "") + fechaLabel + '</span>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">' +
              '<span class="mono" style="font-size:10px;font-weight:700;color:' + estado.color + ';padding:3px 8px;border:1px solid ' + estado.color + ';border-radius:5px;white-space:nowrap">' + estado.label + '</span>' +
              '<button class="iconbtn-sm" data-action="eliminar-delegacion" data-id="' + ev.id + '" title="Eliminar">' + icon("trash", 13) + '</button>' +
            '</div>' +
          '</div>'
        );
      }).join("");

  return (
    '<div style="padding:18px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">' +
        '<div class="mono" style="font-size:13px;color:#D99A3D;letter-spacing:1px;font-weight:600">TABLERO DE DELEGACIÓN</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button class="pillbtn cond" id="btn-abrir-estadisticas-deleg" style="display:flex;align-items:center;gap:6px">' + icon("barChart", 15) + ' Estadísticas</button>' +
          '<button class="btn-primary cond" id="btn-nueva-delegacion">' + icon("plus", 15) + ' Delegar tarea</button>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">' +
        filtroBtns +
        '<div style="position:relative">' +
          '<button class="pill cond" id="btn-filtro-resp-deleg" style="display:flex;align-items:center;gap:6px">' + labelResponsableDeleg + ' ' + icon("chevronDown", 12) + '</button>' +
          dropdownRespDelegHtml +
        '</div>' +
        '<button class="cond" id="btn-toggle-ocultar-completadas" style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid #2A3F54;background:' + (ocultarCompletadas ? "#0E2235" : "transparent") + ';color:#8AA0B5;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap">' +
          (ocultarCompletadas ? icon("checkCircle", 13) : icon("list", 13)) + ' ' + (ocultarCompletadas ? "Mostrar terminadas" : "Ocultar terminadas") +
          (totalCompletadas ? ' <span class="mono">(' + totalCompletadas + ')</span>' : '') +
        '</button>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">' + tareasHtml + '</div>' +
    '</div>' +
    (state.modalDelegacion === "tarea" ? renderModalDelegacion() : "") +
    (state.modalDelegacion === "estadisticas" ? renderModalEstadisticasDelegacion() : "") +
    (state.modalDelegacion === "confirmarEliminarTarea" ? renderModalConfirmarEliminarGenerico(
        "¿Eliminar esta tarea delegada?", "Esto eliminará el evento correspondiente también del calendario. Esta acción no se puede deshacer.",
        "btn-cancelar-eliminar-deleg", "btn-confirmar-eliminar-deleg"
      ) : "")
  );
}

function renderModalEstadisticasDelegacion() {
  const todas = tareasDelegadas();

  // Cantidad de tareas por responsable, ordenado de mayor a menor.
  const porResponsable = {};
  todas.forEach(function (ev) {
    const r = ev.responsable || "Sin asignar";
    if (!porResponsable[r]) porResponsable[r] = { total: 0, listas: 0 };
    porResponsable[r].total++;
    if (todoElRangoCompletado(ev)) porResponsable[r].listas++;
  });
  const responsablesOrdenados = Object.keys(porResponsable).sort(function (a, b) {
    return porResponsable[b].total - porResponsable[a].total;
  });
  const maxPorResponsable = responsablesOrdenados.length ? porResponsable[responsablesOrdenados[0]].total : 1;

  const filasResponsable = responsablesOrdenados.map(function (r) {
    const d = porResponsable[r];
    const pct = Math.round((d.total / maxPorResponsable) * 100);
    return (
      '<div style="margin-bottom:10px">' +
        '<div class="cond" style="display:flex;justify-content:space-between;font-size:12.5px;color:#C9D2DA;margin-bottom:4px">' +
          '<span>' + escapeHTML(r) + '</span>' +
          '<span class="mono" style="color:#8AA0B5">' + d.listas + '/' + d.total + ' listas</span>' +
        '</div>' +
        '<div style="height:8px;background:#0B1B2B;border-radius:4px;overflow:hidden">' +
          '<div style="height:100%;width:' + pct + '%;background:#D99A3D"></div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  // Cantidad de tareas por mes, últimos 6 meses (incluyendo el actual).
  const hoy = new Date();
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ anio: d.getFullYear(), mes: d.getMonth(), label: MESES_ABR[d.getMonth()] + " " + String(d.getFullYear()).slice(2) });
  }
  const conteoPorMes = meses.map(function (m) {
    const total = todas.filter(function (ev) {
      const fechaRef = ev.fechaFin || ev.fecha;
      const d = new Date(fechaRef + "T00:00:00");
      return d.getFullYear() === m.anio && d.getMonth() === m.mes;
    }).length;
    return { label: m.label, total: total };
  });
  const maxPorMes = Math.max.apply(null, conteoPorMes.map(function (c) { return c.total; }).concat([1]));

  const barrasMes = conteoPorMes.map(function (c) {
    const alturaPct = Math.round((c.total / maxPorMes) * 100);
    return (
      '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">' +
        '<div class="mono" style="font-size:10.5px;color:#C9D2DA">' + c.total + '</div>' +
        '<div style="width:100%;height:80px;display:flex;align-items:flex-end">' +
          '<div style="width:100%;height:' + Math.max(alturaPct, 3) + '%;background:#6FA8D9;border-radius:3px 3px 0 0"></div>' +
        '</div>' +
        '<div class="mono" style="font-size:9.5px;color:#5C7184">' + c.label + '</div>' +
      '</div>'
    );
  }).join("");

  // Resumen general por estado.
  const resumenEstados = ESTADOS_DELEGACION.map(function (es) {
    const cantidad = todas.filter(function (ev) { return estadoDelegacionDeEvento(ev) === es.id; }).length;
    return '<div style="text-align:center;flex:1"><div class="mono" style="font-size:20px;font-weight:700;color:' + es.color + '">' + cantidad + '</div><div class="cond" style="font-size:10.5px;color:#8AA0B5">' + es.label + '</div></div>';
  }).join("");

  return (
    '<div class="overlay" id="overlay-estadisticas-deleg">' +
      '<div class="modal wide">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">ESTADÍSTICAS DE DELEGACIÓN</div>' +
          '<button class="iconbtn" id="btn-cerrar-estadisticas-deleg">' + icon("x", 16) + '</button>' +
        '</div>' +

        '<div class="mono" style="font-size:10.5px;color:#8AA0B5;letter-spacing:0.5px;margin-bottom:10px">RESUMEN POR ESTADO</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:20px;padding:14px;background:#0B1B2B;border:1px solid #1E3247;border-radius:8px">' + resumenEstados + '</div>' +

        '<div class="mono" style="font-size:10.5px;color:#8AA0B5;letter-spacing:0.5px;margin-bottom:10px">TAREAS POR RESPONSABLE</div>' +
        '<div style="margin-bottom:20px;padding:14px;background:#0B1B2B;border:1px solid #1E3247;border-radius:8px">' +
          (filasResponsable || '<div class="cond" style="color:#5C7184;font-style:italic;font-size:12.5px">Sin tareas delegadas todavía.</div>') +
        '</div>' +

        '<div class="mono" style="font-size:10.5px;color:#8AA0B5;letter-spacing:0.5px;margin-bottom:10px">TAREAS POR MES (últimos 6 meses)</div>' +
        '<div style="display:flex;gap:6px;padding:14px;background:#0B1B2B;border:1px solid #1E3247;border-radius:8px">' + barrasMes + '</div>' +
      '</div>' +
    '</div>'
  );
}

function renderModalDelegacion() {
  const ev = state.delegacionEditando;
  const tarea = (ev && ev.titulo) || "";
  const responsable = (ev && ev.responsable) || "";
  const responsableEsLibre = responsable && state.responsables.indexOf(responsable) === -1;
  const fechaLimite = (ev && (ev.fechaFin || ev.fecha)) || fmtISO(new Date());
  const estado = ev ? estadoDelegacionDeEvento(ev) : "no_iniciada";

  const respOptions = state.responsables.map(function (r) {
    return '<option value="' + escapeHTML(r) + '"' + (responsable === r ? " selected" : "") + '>' + escapeHTML(r) + '</option>';
  }).join("");

  const estadoBtns = ESTADOS_DELEGACION.map(function (e) {
    const active = estado === e.id;
    return '<button class="cond" data-deleg-estado="' + e.id + '" style="flex:1;padding:8px 4px;border-radius:6px;font-size:10.5px;font-weight:600;cursor:pointer;border:1.5px solid ' + e.color + ';background:' + (active ? e.color : "transparent") + ';color:' + (active ? "#0B1B2B" : e.color) + '">' + e.label + '</button>';
  }).join("");

  return (
    '<div class="overlay" id="overlay-delegacion">' +
      '<div class="modal" style="max-width:420px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">' + (ev ? "EDITAR TAREA DELEGADA" : "DELEGAR TAREA") + '</div>' +
          '<button class="iconbtn" id="btn-cerrar-delegacion">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="cond" style="font-size:11.5px;color:#5C7184;margin-bottom:12px;line-height:1.4">Esto crea (o edita) un evento en tu calendario. Aparecerá también en la vista Semana/Mes con el responsable asignado.</div>' +
        '<div class="campo"><label class="campo-label mono">TAREA</label><textarea class="field" id="deleg-tarea" rows="2" placeholder="Ej: Preparar informe de interoperabilidad Salitre 2026">' + escapeHTML(tarea) + '</textarea></div>' +
        '<div class="campo"><label class="campo-label mono">RESPONSABLE</label>' +
          '<div id="deleg-resp-wrap">' +
          (responsableEsLibre
            ? '<div style="display:flex;gap:6px"><input class="field" id="deleg-responsable-libre" value="' + escapeHTML(responsable) + '" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-deleg-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>'
            : '<select class="field" id="deleg-responsable"><option value="">— Sin asignar —</option>' + respOptions + '<option value="__libre__">✎ Escribir otro nombre…</option></select>'
          ) +
          '</div>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">FECHA LÍMITE</label><input class="field" type="date" id="deleg-fecha" value="' + fechaLimite + '" /></div>' +
        '<div class="campo"><label class="campo-label mono">ESTADO</label><div class="prio-row" id="deleg-estado-row" data-value="' + estado + '">' + estadoBtns + '</div></div>' +
        '<div id="deleg-error"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel cond" id="btn-cancelar-delegacion">Cancelar</button>' +
          '<button class="btn-guardar cond" id="btn-guardar-delegacion">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function bindEventsDelegacion() {
  if (state.seccion !== "delegacion") return;

  document.querySelectorAll("[data-action='filtro-estado-deleg']").forEach(function (el) {
    el.onclick = function () { state.filtroEstadoDelegacion = el.getAttribute("data-estado"); render(); };
  });

  const btnFiltroRespDeleg = document.getElementById("btn-filtro-resp-deleg");
  if (btnFiltroRespDeleg) {
    btnFiltroRespDeleg.onclick = function (e) {
      e.stopPropagation();
      state.dropdownFiltroDelegAbierto = !state.dropdownFiltroDelegAbierto;
      render();
    };
  }
  document.querySelectorAll("[data-action='filtro-resp-deleg-check']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const nombre = el.getAttribute("data-nombre");
      const idx = state.filtroResponsablesDeleg.indexOf(nombre);
      if (idx === -1) state.filtroResponsablesDeleg.push(nombre); else state.filtroResponsablesDeleg.splice(idx, 1);
      render();
    };
  });
  document.querySelectorAll("[data-action='filtro-resp-deleg-todos']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroResponsablesDeleg = []; render(); };
  });
  document.querySelectorAll("[data-action='filtro-resp-deleg-ninguno']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      state.filtroResponsablesDeleg = Array.from(new Set(tareasDelegadas().map(function (ev) { return ev.responsable; }).filter(Boolean)));
      render();
    };
  });
  if (state.dropdownFiltroDelegAbierto) {
    const appEl = document.getElementById("app");
    appEl.onclick = function () { state.dropdownFiltroDelegAbierto = false; render(); };
  }

  const btnToggleOcultar = document.getElementById("btn-toggle-ocultar-completadas");
  if (btnToggleOcultar) btnToggleOcultar.onclick = function () { state.ocultarDelegacionesCompletadas = !state.ocultarDelegacionesCompletadas; render(); };

  const btnNuevaDelegacion = document.getElementById("btn-nueva-delegacion");
  if (btnNuevaDelegacion) btnNuevaDelegacion.onclick = function () { state.delegacionEditando = null; state.modalDelegacion = "tarea"; render(); };

  const btnAbrirEstadisticasDeleg = document.getElementById("btn-abrir-estadisticas-deleg");
  if (btnAbrirEstadisticasDeleg) btnAbrirEstadisticasDeleg.onclick = function () { state.modalDelegacion = "estadisticas"; render(); };
  const btnCerrarEstadisticasDeleg = document.getElementById("btn-cerrar-estadisticas-deleg");
  if (btnCerrarEstadisticasDeleg) btnCerrarEstadisticasDeleg.onclick = function () { state.modalDelegacion = null; render(); };
  const overlayEstadisticasDeleg = document.getElementById("overlay-estadisticas-deleg");
  if (overlayEstadisticasDeleg) overlayEstadisticasDeleg.onclick = function (e) { if (e.target === overlayEstadisticasDeleg) { state.modalDelegacion = null; render(); } };

  document.querySelectorAll("[data-action='editar-delegacion']").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-id");
      state.delegacionEditando = state.eventos.find(function (e) { return e.id === id; });
      state.modalDelegacion = "tarea";
      render();
    };
  });
  document.querySelectorAll("[data-action='toggle-deleg-lista']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const id = el.getAttribute("data-id");
      toggleEstado(id); // misma función que usa el calendario: mantiene un solo dato sincronizado
    };
  });
  document.querySelectorAll("[data-action='eliminar-delegacion']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      state.eliminarDelegacionPendienteId = el.getAttribute("data-id");
      state.modalDelegacion = "confirmarEliminarTarea";
      render();
    };
  });

  const cerrarModalDelegacion = function () { state.modalDelegacion = null; state.delegacionEditando = null; render(); };
  const btnCerrarDelegacion = document.getElementById("btn-cerrar-delegacion");
  const btnCancelarDelegacion = document.getElementById("btn-cancelar-delegacion");
  if (btnCerrarDelegacion) btnCerrarDelegacion.onclick = cerrarModalDelegacion;
  if (btnCancelarDelegacion) btnCancelarDelegacion.onclick = cerrarModalDelegacion;
  const overlayDelegacion = document.getElementById("overlay-delegacion");
  if (overlayDelegacion) overlayDelegacion.onclick = function (e) { if (e.target === overlayDelegacion) cerrarModalDelegacion(); };

  const respSelDeleg = document.getElementById("deleg-responsable");
  if (respSelDeleg) {
    respSelDeleg.onchange = function (e) {
      if (e.target.value === "__libre__") {
        document.getElementById("deleg-resp-wrap").innerHTML =
          '<div style="display:flex;gap:6px"><input class="field" id="deleg-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-deleg-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
        const btnVolverResp = document.getElementById("btn-deleg-resp-volver");
        if (btnVolverResp) {
          btnVolverResp.onclick = function () {
            const respOptions2 = state.responsables.map(function (r) { return '<option value="' + escapeHTML(r) + '">' + escapeHTML(r) + '</option>'; }).join("");
            document.getElementById("deleg-resp-wrap").innerHTML = '<select class="field" id="deleg-responsable"><option value="">— Sin asignar —</option>' + respOptions2 + '<option value="__libre__">✎ Escribir otro nombre…</option></select>';
          };
        }
      }
    };
  }

  const estadoRow = document.getElementById("deleg-estado-row");
  if (estadoRow) {
    estadoRow.querySelectorAll("[data-deleg-estado]").forEach(function (btn) {
      btn.onclick = function () {
        const estadoId = btn.getAttribute("data-deleg-estado");
        estadoRow.dataset.value = estadoId;
        estadoRow.querySelectorAll("[data-deleg-estado]").forEach(function (b2) {
          const eid = b2.getAttribute("data-deleg-estado");
          const e = estadoDelegacionById(eid);
          const active = eid === estadoId;
          b2.style.background = active ? e.color : "transparent";
          b2.style.color = active ? "#0B1B2B" : e.color;
        });
      };
    });
  }

  const btnGuardarDelegacion = document.getElementById("btn-guardar-delegacion");
  if (btnGuardarDelegacion) {
    btnGuardarDelegacion.onclick = function () {
      const tarea = document.getElementById("deleg-tarea").value.trim();
      const respLibre = document.getElementById("deleg-responsable-libre");
      const respSelect = document.getElementById("deleg-responsable");
      const responsable = respLibre ? respLibre.value.trim() : (respSelect ? respSelect.value : "");
      const fechaLimite = document.getElementById("deleg-fecha").value;
      const estadoSeleccionado = (document.getElementById("deleg-estado-row") || {}).dataset.value || "no_iniciada";
      const errorBox = document.getElementById("deleg-error");
      if (!tarea) { errorBox.innerHTML = '<div class="error-text cond">La descripción de la tarea es obligatoria.</div>'; return; }
      if (!responsable) { errorBox.innerHTML = '<div class="error-text cond">Debes asignar un responsable.</div>'; return; }

      const completado = estadoSeleccionado === "lista";

      if (state.delegacionEditando) {
        state.eventos = state.eventos.map(function (e) {
          if (e.id !== state.delegacionEditando.id) return e;
          return Object.assign({}, e, {
            titulo: tarea, responsable: responsable, fecha: fechaLimite, fechaFin: fechaLimite,
            estadoDelegacion: estadoSeleccionado, completado: completado,
          });
        });
      } else {
        state.eventos.push({
          id: uid(), titulo: tarea, fecha: fechaLimite, fechaFin: fechaLimite, hora: "", duracion: 30,
          categoria: (state.categorias[0] || {}).id || "tarea", responsable: responsable, prioridad: "media",
          lugar: "", notas: "", subtareas: [], estadoDelegacion: estadoSeleccionado, completado: completado,
        });
      }
      persist();
      state.modalDelegacion = null;
      state.delegacionEditando = null;
      render();
    };
  }

  const btnCancelarEliminarDeleg = document.getElementById("btn-cancelar-eliminar-deleg");
  if (btnCancelarEliminarDeleg) btnCancelarEliminarDeleg.onclick = function () { state.modalDelegacion = null; state.eliminarDelegacionPendienteId = null; render(); };
  const btnConfirmarEliminarDeleg = document.getElementById("btn-confirmar-eliminar-deleg");
  if (btnConfirmarEliminarDeleg) {
    btnConfirmarEliminarDeleg.onclick = function () {
      const id = state.eliminarDelegacionPendienteId;
      state.eventos = state.eventos.filter(function (e) { return e.id !== id; });
      persist();
      state.modalDelegacion = null;
      state.eliminarDelegacionPendienteId = null;
      render();
    };
  }

  const overlayGenericoDeleg = document.getElementById("overlay-confirmar-generico");
  if (overlayGenericoDeleg && state.modalDelegacion === "confirmarEliminarTarea") {
    overlayGenericoDeleg.onclick = function (e) {
      if (e.target !== overlayGenericoDeleg) return;
      state.modalDelegacion = null;
      state.eliminarDelegacionPendienteId = null;
      render();
    };
  }
}


/* ============================================================
   SECCIÓN MOLO — tráfico portuario: buques y sus actividades
   puntuales (zarpe, recalada, grúa, buceo, altura, DSOT, etc.)
   Vista tipo tabla: filas = buques, columnas = días.
   ============================================================ */
function tipoActividadMoloById(id) {
  return state.tiposActividadMolo.find(function (t) { return t.id === id; }) || null;
}
function actividadesDeBuqueEnFecha(buqueId, fechaIso) {
  return state.actividadesTrafico
    .filter(function (a) {
      if (a.buqueId !== buqueId) return false;
      const fin = a.fechaFin && a.fechaFin > a.fecha ? a.fechaFin : a.fecha;
      return fechaIso >= a.fecha && fechaIso <= fin;
    })
    .sort(function (a, b) { return (a.hora || "").localeCompare(b.hora || ""); });
}

function renderSeccionMolo() {
  const start = startOfWeek(state.cursorMolo);
  const dias = [];
  for (let i = 0; i < 7; i++) dias.push(addDays(start, i));
  const finSemana = dias[6];
  const hoy = new Date();
  const ANCHO_COL = 92; // debe coincidir con .molo-celda / .molo-dia-header en CSS

  if (state.buques.length === 0) {
    return (
      '<div style="padding:18px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">' +
          '<div class="mono" style="font-size:13px;color:#D99A3D;letter-spacing:1px;font-weight:600">⚓ MOLO — TRÁFICO PORTUARIO</div>' +
          '<button class="btn-primary cond" id="btn-nuevo-buque">' + icon("plus", 15) + ' Agregar buque</button>' +
        '</div>' +
        '<div class="cond" style="text-align:center;padding:50px 20px;color:#5C7184;font-style:italic">Aún no has agregado buques para seguimiento de tráfico portuario.</div>' +
      '</div>' +
      (state.modalMolo === "buque" ? renderModalBuque() : "")
    );
  }

  const cellsHeaderHtml = dias.map(function (d) {
    const esHoy = isSameDay(d, hoy);
    return '<div class="molo-dia-header' + (esHoy ? " today" : "") + '">' +
      '<div class="mono" style="font-size:10.5px;color:' + (esHoy ? "#D99A3D" : "#8AA0B5") + ';font-weight:700">' + DIAS_SEM[(d.getDay() + 6) % 7] + '</div>' +
      '<div class="cond" style="font-size:12px;color:#C9D2DA">' + d.getDate() + ' ' + MESES_ABR[d.getMonth()] + '</div>' +
    '</div>';
  }).join("");

  const filasHtml = state.buques.map(function (buque) {
    // Actividades del buque que se solapan con la semana visible, separadas en
    // multi-día (barra Gantt continua) y de un solo día (bloque dentro de la celda).
    const todasDelBuque = state.actividadesTrafico.filter(function (a) { return a.buqueId === buque.id; });
    const multiDia = [];
    const unDia = {}; // por fecha ISO

    todasDelBuque.forEach(function (a) {
      const fin = a.fechaFin && a.fechaFin > a.fecha ? a.fechaFin : a.fecha;
      const esMultiDia = fin > a.fecha;
      // ¿Se solapa con la semana visible?
      if (fin < fmtISO(start) || a.fecha > fmtISO(finSemana)) return;
      if (esMultiDia) {
        multiDia.push(a);
      } else {
        if (!unDia[a.fecha]) unDia[a.fecha] = [];
        unDia[a.fecha].push(a);
      }
    });

    const ALTO_NIVEL_GANTT = 38; // 34px de barra + 4px de separación entre niveles
    const nivelesGantt = multiDia.length;
    const paddingTopCeldas = nivelesGantt ? (nivelesGantt * ALTO_NIVEL_GANTT + 6) : 5;

    // Construir las celdas base (solo actividades de un día; las multi-día se
    // dibujan encima como barras absolutas, no dentro de la celda).
    const celdas = dias.map(function (d) {
      const iso = fmtISO(d);
      const esHoy = isSameDay(d, hoy);
      const acts = (unDia[iso] || []).slice().sort(function (a, b) { return (a.hora || "").localeCompare(b.hora || ""); });
      const bloquesHtml = acts.slice(0, 2).map(function (a) {
        const tipo = tipoActividadMoloById(a.tipo) || { color: "#8AA0B5", label: "?" };
        const horaFin = a.hora ? calcularHoraTermino(a.hora, a.duracion || 60) : "";
        return '<div class="molo-bloque" data-action="editar-actividad-molo-directo" data-id="' + a.id + '" style="position:relative;padding-top:11px;padding-bottom:11px;background:' + tipo.color + '22;border-left:3px solid ' + tipo.color + '" title="' + escapeHTML(tipo.label) + (a.hora ? " · " + a.hora : "") + '">' +
          (a.hora ? '<span class="mono" style="position:absolute;top:1px;left:4px;font-size:8px;font-weight:700;color:' + tipo.color + '">' + a.hora + '</span>' : "") +
          (horaFin ? '<span class="mono" style="position:absolute;bottom:1px;right:4px;font-size:8px;font-weight:700;color:' + tipo.color + '">' + horaFin + '</span>' : "") +
          '<span class="cond" style="display:block;text-align:center">' + escapeHTML(tipo.label) + '</span>' +
        '</div>';
      }).join("");
      const masHtml = acts.length > 2 ? '<div class="mono" style="font-size:9px;color:#5C7184;text-align:center">+' + (acts.length - 2) + ' más</div>' : "";
      return '<div class="molo-celda' + (esHoy ? " today" : "") + '" data-action="abrir-celda-molo" data-buque="' + buque.id + '" data-fecha="' + iso + '" style="padding-top:' + paddingTopCeldas + 'px">' +
        bloquesHtml + masHtml +
      '</div>';
    }).join("");

    // Barras Gantt continuas para actividades multi-día, cada una en su propio
    // nivel vertical dentro de la franja superior de la fila, para que dos o más
    // actividades del mismo buque en fechas que se solapan no queden superpuestas.
    const gantt = multiDia.map(function (a, idxGantt) {
      const tipo = tipoActividadMoloById(a.tipo) || { color: "#8AA0B5", label: "?" };
      const colorTexto = colorTextoLegible(tipo.color);
      const finReal = a.fechaFin && a.fechaFin > a.fecha ? a.fechaFin : a.fecha;
      // Recortar el rango a los límites de la semana visible.
      const inicioVisible = a.fecha < fmtISO(start) ? fmtISO(start) : a.fecha;
      const finVisible = finReal > fmtISO(finSemana) ? fmtISO(finSemana) : finReal;
      const colInicio = Math.round((new Date(inicioVisible + "T00:00:00") - start) / 86400000);
      const colFin = Math.round((new Date(finVisible + "T00:00:00") - start) / 86400000);
      const numCols = colFin - colInicio + 1;
      const left = colInicio * ANCHO_COL;
      const width = numCols * ANCHO_COL - 8; // pequeño margen visual
      const horaFin = a.hora ? calcularHoraTermino(a.hora, a.duracion || 60) : "";
      return '<div class="molo-barra-gantt" data-action="editar-actividad-molo-directo" data-id="' + a.id + '" style="left:' + (left + 4) + 'px;width:' + width + 'px;top:' + (idxGantt * ALTO_NIVEL_GANTT) + 'px;background:' + tipo.color + ';color:' + colorTexto + '" title="' + escapeHTML(tipo.label) + '">' +
        (a.hora ? '<span class="mono molo-barra-hora-ini" style="color:' + colorTexto + '">' + a.hora + '</span>' : "") +
        (horaFin ? '<span class="mono molo-barra-hora-fin" style="color:' + colorTexto + '">' + horaFin + '</span>' : "") +
        '<span class="molo-barra-gantt-label" style="color:' + colorTexto + '">' + escapeHTML(tipo.label) + '</span>' +
      '</div>';
    }).join("");

    return (
      '<div class="molo-fila">' +
        '<div class="molo-fila-nombre" data-action="editar-buque" data-id="' + buque.id + '">' +
          '<div class="cond" style="font-size:13px;font-weight:600;color:#E4EAEF">' + escapeHTML(buque.nombre) + '</div>' +
          (buque.tipo ? '<div class="cond" style="font-size:10.5px;color:#8AA0B5;margin-top:1px">' + escapeHTML(buque.tipo) + '</div>' : "") +
        '</div>' +
        '<div class="molo-celdas">' + celdas + gantt + '</div>' +
      '</div>'
    );
  }).join("");

  return (
    '<div style="padding:18px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">' +
        '<div class="mono" style="font-size:13px;color:#D99A3D;letter-spacing:1px;font-weight:600">⚓ MOLO — TRÁFICO PORTUARIO</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +

  const actsHtml = acts.length === 0
    ? '<div class="empty-state cond">Sin actividades registradas.</div>'

        const tipo = tipoActividadMoloById(a.tipo) || { color: "#8AA0B5", label: "?" };
        return '<div class="hecho-card" style="border-left:6px solid ' + tipo.color + '">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
            '<div style="flex:1;min-width:0">' +
              '<div class="mono" style="font-size:10px;color:' + tipo.color + ';font-weight:700;letter-spacing:0.5px;margin-bottom:4px">' + escapeHTML(tipo.label) + (a.hora ? " · " + a.hora : "") + '</div>' +
              (a.notas ? '<div class="cond" style="font-size:13px;color:#C9D2DA;line-height:1.4">' + escapeHTML(a.notas) + '</div>' : "") +
            '</div>' +
            '<div style="display:flex;gap:4px;flex-shrink:0">' +
              '<button class="iconbtn-sm" data-action="editar-actividad-molo" data-id="' + a.id + '" title="Editar">' + icon("edit", 13) + '</button>' +
              '<button class="iconbtn-sm" data-action="eliminar-actividad-molo" data-id="' + a.id + '" title="Eliminar">' + icon("trash", 13) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';

  return (
    '<div class="overlay" id="overlay-detalle-celda-molo">' +
      '<div class="modal">' +
        '<div class="modal-head" style="align-items:flex-start">' +

            '<div class="mono" style="font-size:11px;color:#8AA0B5;letter-spacing:1px">' + escapeHTML((buque && buque.nombre) || "") + '</div>' +
            '<div class="cond" style="font-size:18px;font-weight:600;color:#E4EAEF">' + fechaLabel + '</div>' +
          '</div>' +
          '<button class="iconbtn" id="btn-cerrar-detalle-celda-molo">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="scrollbar" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:50vh;overflow-y:auto">' + actsHtml + '</div>' +
        '<button class="cond" id="btn-agregar-actividad-desde-celda" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:7px;border:none;background:#5FE3A1;color:#0B1B2B;font-weight:700;font-size:13px;cursor:pointer">' +
          icon("plus", 15) + ' Agregar actividad</button>' +
      '</div>' +
    '</div>'
  );
}

function renderModalActividadMolo() {
  const a = state.actividadEditando;
  const buqueId = (a && a.buqueId) || (state.celdaMoloDetalle && state.celdaMoloDetalle.buqueId) || (state.buques[0] && state.buques[0].id) || "";
  const fecha = (a && a.fecha) || (state.celdaMoloDetalle && state.celdaMoloDetalle.fecha) || fmtISO(new Date());
  const fechaFin = (a && a.fechaFin) || fecha;
  const tipo = (a && a.tipo) || (state.tiposActividadMolo[0] && state.tiposActividadMolo[0].id) || "";
  const hora = (a && a.hora) || "08:00";
  const duracionTotal = (a && a.duracion) || 60;
  const durHoras = Math.floor(duracionTotal / 60);
  const durMinutos = duracionTotal % 60;
  const notas = (a && a.notas) || "";

  const buqueOptions = state.buques.map(function (b) {
    return '<option value="' + b.id + '"' + (buqueId === b.id ? " selected" : "") + '>' + escapeHTML(b.nombre) + '</option>';
  }).join("");
  const tipoOptions = state.tiposActividadMolo.map(function (t) {
    return '<option value="' + t.id + '"' + (tipo === t.id ? " selected" : "") + '>' + escapeHTML(t.label) + '</option>';
  }).join("");

  const horasOptions = [];
  for (let h = 0; h <= 12; h++) {
    horasOptions.push('<option value="' + h + '"' + (durHoras === h ? " selected" : "") + '>' + h + '</option>');
  }
  const minutosOptions = [0, 15, 30, 45].map(function (m) {
    return '<option value="' + m + '"' + (durMinutos === m ? " selected" : "") + '>' + pad(m) + '</option>';
  }).join("");

  return (
    '<div class="overlay" id="overlay-actividad-molo">' +
      '<div class="modal" style="max-width:400px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">' + (a ? "EDITAR ACTIVIDAD" : "NUEVA ACTIVIDAD") + '</div>' +
          '<button class="iconbtn" id="btn-cerrar-actividad-molo">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">BUQUE</label><select class="field" id="act-molo-buque">' + buqueOptions + '</select></div>' +
        '<div class="campo"><label class="campo-label mono">TIPO DE ACTIVIDAD</label><select class="field" id="act-molo-tipo">' + tipoOptions + '</select></div>' +
        '<div class="row-gap">' +
          '<div class="campo" style="flex:1"><label class="campo-label mono">FECHA INICIO</label><input class="field" type="date" id="act-molo-fecha" value="' + fecha + '" /></div>' +
          '<div class="campo" style="flex:1"><label class="campo-label mono">FECHA TÉRMINO</label><input class="field" type="date" id="act-molo-fecha-fin" value="' + fechaFin + '" min="' + fecha + '" /></div>' +
        '</div>' +
        '<div class="row-gap">' +
          '<div class="campo" style="flex:1"><label class="campo-label mono">HORA INICIO</label><input class="field" type="time" id="act-molo-hora" value="' + hora + '" />' +
            '<div class="mono" id="act-molo-hora-termino" style="font-size:10.5px;color:#8AA0B5;margin-top:4px">Término: ' + calcularHoraTermino(hora, duracionTotal) + '</div>' +
          '</div>' +
          '<div class="campo" style="width:74px"><label class="campo-label mono">HORAS</label><select class="field" id="act-molo-dur-horas">' + horasOptions.join("") + '</select></div>' +
          '<div class="campo" style="width:74px"><label class="campo-label mono">MIN.</label><select class="field" id="act-molo-dur-minutos">' + minutosOptions + '</select></div>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">NOTAS (OPCIONAL)</label><textarea class="field" id="act-molo-notas" rows="2" placeholder="Detalles de la actividad…">' + escapeHTML(notas) + '</textarea></div>' +
        '<div id="act-molo-error"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel cond" id="btn-cancelar-actividad-molo">Cancelar</button>' +
          '<button class="btn-guardar cond" id="btn-guardar-actividad-molo">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}
