<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Bitácora Operativa</title>

<link rel="manifest" href="./manifest.json" />

<style>
  @font-face { font-family: 'system-mono'; src: local('Menlo'); }
  html, body { margin: 0; padding: 0; background: #0B1B2B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, system-ui, sans-serif; color: #C9D2DA; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .cond { font-family: -apple-system, system-ui, sans-serif; }
  ::selection { background: #D99A3D; color: #0B1B2B; }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid #D99A3D; outline-offset: 2px;
  }
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #2A3F54; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  input[type="date"], input[type="time"] { color-scheme: dark; }
  button { -webkit-appearance: none; appearance: none; }

  #app { min-height: 100vh; background: #0B1B2B; }

  .topbar {
    border-bottom: 1px solid #1E3247;
    background: linear-gradient(180deg, #0E2235 0%, #0B1B2B 100%);
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; justify-content: space-between;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; animation: pulse-dot 2s infinite; }
  .stat { text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; }
  .stat-label { color: #8AA0B5; font-size: 11px; letter-spacing: 0.5px; }

  .iconbtn {
    background: transparent; border: 1px solid #2A3F54; border-radius: 6px; color: #8AA0B5;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .iconbtn-sm {
    background: transparent; border: none; color: #8AA0B5;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .navbtn {
    background: #0E2235; border: 1px solid #1E3247; border-radius: 7px; color: #C9D2DA;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  .controls { padding: 14px 18px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .tabgroup { display: flex; gap: 6px; background: #0E2235; border: 1px solid #1E3247; border-radius: 8px; padding: 4px; }
  .tabbtn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; background: transparent; color: #C9D2DA; }
  .tabbtn.active { background: #D99A3D; color: #0B1B2B; }

  select.pill, .pillbtn {
    background: #0E2235; color: #C9D2DA; border: 1px solid #1E3247; border-radius: 6px;
    padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  .btn-primary {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px;
    border: none; background: #5FE3A1; color: #0B1B2B; font-weight: 700; font-size: 13px; cursor: pointer;
  }

  .navtemporal { padding: 16px 18px 0; display: flex; align-items: center; justify-content: space-between; }
  .navlabel { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; color: #C9D2DA; }
  .hoybtn { font-size: 12px; color: #D99A3D; background: transparent; border: 1px solid #2A3F54; border-radius: 5px; padding: 4px 9px; cursor: pointer; }

  .view-area { padding: 10px 18px 90px; }

  .daycard { background: #0E2235; border: 1px solid #1E3247; border-radius: 10px; overflow: hidden; margin-bottom: 10px; border-top: 3px solid #1E3247; }
  .daycard.alt { background: #0C1F30; }
  .daycard.today { background: #102A40; border-color: #D99A3D; border-top-color: #D99A3D; }
  .daycard-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid #1E3247; }
  .daycard-head.empty { border-bottom: none; }
  .badge-hoy { font-size: 10px; background: #D99A3D; color: #0B1B2B; padding: 1px 6px; border-radius: 4px; font-weight: 700; }
  .empty-day { padding: 10px 14px; font-size: 12.5px; color: #5C7184; font-style: italic; }

  .fila-evento { display: flex; align-items: center; gap: 10px; padding: 9px 14px; }
  .fila-evento .acciones { display: flex; gap: 4px; opacity: 0.5; }
  .fila-evento:hover .acciones { opacity: 1; }
  .fila-evento .hora { font-size: 12.5px; color: #D99A3D; font-weight: 600; min-width: 50px; }
  .fila-evento .titulo { font-size: 13.5px; color: #E4EAEF; font-weight: 500; }
  .fila-evento .titulo.done { text-decoration: line-through; }
  .check { width: 16px; height: 16px; min-width: 16px; border-radius: 4px; cursor: pointer; padding: 0; border: 1.5px solid; }
  .meta-row { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; align-items: center; }
  .meta-resp { font-size: 11px; color: #8AA0B5; display: flex; align-items: center; gap: 3px; }
  .meta-prio { font-size: 10.5px; font-weight: 600; letter-spacing: 0.3px; }
  .meta-vencido { font-size: 10px; color: #E0524A; font-weight: 700; letter-spacing: 0.5px; }
  .btn-manana {
    display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid #E0524A; background: transparent; color: #E0524A;
    font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }

  .month-dow-sticky-wrap {
    position: sticky; top: 0; z-index: 5; background: #0B1B2B;
    padding-top: 6px; padding-bottom: 4px; border-bottom: 1px solid #1E3247;
    overflow-x: auto; margin-bottom: 6px;
  }
  .month-dow-sticky-wrap::-webkit-scrollbar { display: none; }
  .month-scroll { overflow-x: auto; padding-bottom: 6px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, minmax(124px, 1fr)); gap: 6px; min-width: 880px; }
  .month-dow { display: grid; grid-template-columns: repeat(7, minmax(124px, 1fr)); gap: 6px; min-width: 880px; }
  .dow-label { text-align: center; font-size: 12px; color: #5C7184; padding: 4px 0; letter-spacing: 1px; }
  .month-cell { min-height: 132px; min-width: 0; max-width: 100%; border-radius: 8px; padding: 7px 8px; cursor: pointer; border: 1px solid #1E3247; background: #0E2235; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .month-cell.today { background: #102A40; border-color: #D99A3D; }
  .month-cell.outside { opacity: 0.45; background: #0A1622; }
  .month-cell-num { font-size: 13px; font-weight: 500; color: #8AA0B5; text-align: right; }
  .month-cell-num.today { font-weight: 700; color: #D99A3D; }
  .month-evt { font-size: 12px; line-height: 1.35; color: #C9D2DA; padding: 3px 5px 3px 7px; border-radius: 3px; white-space: normal; overflow-wrap: break-word; border-left: 5px solid; }
  .month-evt.done { text-decoration: line-through; }
  .month-more { font-size: 10.5px; color: #5C7184; font-family: ui-monospace, monospace; padding-top: 1px; }

  .fab {
    position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); right: 18px;
    display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 24px;
    border: 1px solid #2A3F54; background: #0E2235; color: #D99A3D; font-weight: 600; font-size: 13px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 40;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(5,12,20,0.75); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal {
    background: #0E2235; border: 1px solid #2A3F54; border-radius: 12px; padding: 20px;
    width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal.wide { max-width: 520px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-size: 13px; color: #D99A3D; letter-spacing: 1px; font-weight: 600; }

  .campo { margin-bottom: 12px; }
  .campo-label { display: block; font-size: 10.5px; color: #8AA0B5; letter-spacing: 0.5px; margin-bottom: 4px; }
  .field {
    width: 100%; background: #0B1B2B; border: 1px solid #2A3F54; border-radius: 7px;
    padding: 9px 10px; color: #E4EAEF; font-size: 13.5px;
  }
  textarea.field { resize: vertical; }

  .row-gap { display: flex; gap: 10px; }
  .prio-row { display: flex; gap: 6px; }
  .prio-btn { flex: 1; padding: 7px 0; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: transparent; }

  .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn-cancel { flex: 1; padding: 10px; border-radius: 7px; border: 1px solid #2A3F54; background: transparent; color: #C9D2DA; font-size: 13.5px; cursor: pointer; }
  .btn-guardar { flex: 1.4; padding: 10px; border-radius: 7px; border: none; background: #D99A3D; color: #0B1B2B; font-weight: 700; font-size: 13.5px; cursor: pointer; }

  .error-text { color: #E0524A; font-size: 12.5px; margin-bottom: 10px; }

  .chip {
    display: flex; align-items: center; gap: 5px; background: #0B1B2B; border: 1px solid #2A3F54;
    border-radius: 16px; padding: 5px 6px 5px 12px; font-size: 12.5px; color: #C9D2DA;
  }
  .chip button { background: transparent; border: none; color: #8AA0B5; cursor: pointer; display: flex; }

  .empty-state { color: #5C7184; font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   BITÁCORA OPERATIVA — JavaScript vanilla puro, sin dependencias
   ============================================================ */

/* ---------- Iconos SVG como strings ---------- */
const ICONS = {
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  calendarDays: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h2M14 14h2M8 18h2M14 18h2"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
  chevronRight: '<polyline points="9 18 15 12 9 6"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  edit: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  tag: '<path d="M20.59 13.41 13 21l-9-9V3h9z"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
  alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  skip: '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>',
  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2 2 5-5"/>',
};
function icon(name, size) {
  size = size || 16;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block">' + (ICONS[name] || '') + '</svg>';
}

/* ---------- Helpers de fecha ---------- */
function pad(n) { return String(n).padStart(2, "0"); }
function calcularHoraTermino(horaInicio, duracionMin) {
  if (!horaInicio) return "";
  const partes = horaInicio.split(":");
  const totalMin = parseInt(partes[0]) * 60 + parseInt(partes[1]) + (Number(duracionMin) || 0);
  const horasFinales = Math.floor((totalMin % 1440) / 60);
  const minutosFinales = totalMin % 60;
  const diasExtra = Math.floor(totalMin / 1440);
  return pad(horasFinales) + ":" + pad(minutosFinales) + (diasExtra > 0 ? " (+" + diasExtra + "d)" : "");
}
function fmtISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtDTG(d) {
  const dias = ["DOM", "LUN", "MAR", "MIE", "JUE", "VIE", "SAB"];
  return pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + "Z " + dias[d.getDay()];
}
const MESES = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const MESES_ABR = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const DIAS_SEM = ["LUN","MAR","MIE","JUE","VIE","SAB","DOM"];
const DIAS_SEM_FULL = ["LUNES","MARTES","MIERCOLES","JUEVES","VIERNES","SABADO","DOMINGO"];

function startOfWeek(d) {
  const x = new Date(d);
  const day = x.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0, 0, 0, 0);
  return x;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function escapeHTML(s) {
  if (s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---------- Datos por defecto ---------- */
const CATEGORIAS_DEFAULT = [
  { id: "tarea", label: "TAREA", color: "#5FE3A1" },
  { id: "reunion", label: "REUNIÓN", color: "#6FA8D9" },
  { id: "plazo", label: "PLAZO/RESPUESTA", color: "#E0524A" },
  { id: "navegacion", label: "NAVEGACIÓN", color: "#D99A3D" },
  { id: "cic", label: "EJERCICIO CIC", color: "#C97FE0" },
];
const RESPONSABLES_DEFAULT = ["OFOPER", "PWO-A", "PWO-U", "CONDESTABLE", "SATOPER", "INSTRUCCIÓN", "T1 MILLÓN", "T1 CORTHORN", "T2 BRITO"];
const PRIORIDADES = [
  { id: "alta", label: "ALTA", color: "#E0524A" },
  { id: "media", label: "MEDIA", color: "#D99A3D" },
  { id: "baja", label: "BAJA", color: "#5FE3A1" },
];

/* ---------- Persistencia local ---------- */
const STORAGE_KEY = "bitacora:eventos";
const CAT_KEY = "bitacora:categorias";
const RESP_KEY = "bitacora:responsables";

function loadLocal(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

/* ---------- Exportación ICS ---------- */
function toICSDate(dateStr, timeStr) {
  const parts = dateStr.split("-");
  const tparts = (timeStr || "00:00").split(":");
  return parts[0] + parts[1] + parts[2] + "T" + pad(tparts[0]) + pad(tparts[1]) + "00";
}
function buildICS(evento) {
  const dtStart = toICSDate(evento.fecha, evento.hora || "08:00");
  const horaParts = (evento.hora || "08:00").split(":");
  const startDate = new Date(
    parseInt(evento.fecha.slice(0, 4)),
    parseInt(evento.fecha.slice(5, 7)) - 1,
    parseInt(evento.fecha.slice(8, 10)),
    parseInt(horaParts[0]), parseInt(horaParts[1])
  );
  const endDate = new Date(startDate.getTime() + (evento.duracion || 30) * 60000);
  const dtEnd = endDate.getFullYear() + pad(endDate.getMonth() + 1) + pad(endDate.getDate()) + "T" + pad(endDate.getHours()) + pad(endDate.getMinutes()) + "00";
  const now = new Date();
  const dtStamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "T" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + "Z";
  function esc(s) { return (s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bitacora Operativa//ES", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + evento.id + "@bitacora-operativa",
    "DTSTAMP:" + dtStamp,
    "DTSTART:" + dtStart,
    "DTEND:" + dtEnd,
    "SUMMARY:" + esc(evento.titulo),
    "DESCRIPTION:" + esc("Responsable: " + (evento.responsable || "-") + "\\nPrioridad: " + (evento.prioridad || "-") + "\\nNotas: " + (evento.notas || "-")),
    evento.lugar ? "LOCATION:" + esc(evento.lugar) : null,
    "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT15M",
    "DESCRIPTION:" + esc(evento.titulo),
    "END:VALARM", "END:VEVENT", "END:VCALENDAR",
  ].filter(Boolean);
  return lines.join("\r\n");
}
function downloadICS(evento) {
  const ics = buildICS(evento);
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const safeName = (evento.titulo || "evento").replace(/[^a-zA-Z0-9]+/g, "_").slice(0, 40);
  a.download = evento.fecha + "_" + safeName + ".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadICSBatch(eventos, nombre) {
  const blocks = eventos.map(function (e) {
    const ics = buildICS(e);
    const start = ics.indexOf("BEGIN:VEVENT");
    const end = ics.indexOf("END:VEVENT") + "END:VEVENT".length;
    return ics.slice(start, end);
  });
  const full = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bitacora Operativa//ES", "CALSCALE:GREGORIAN"].concat(blocks, ["END:VCALENDAR"]).join("\r\n");
  const blob = new Blob([full], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (nombre || "bitacora") + ".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const state = {
  vista: "semana",
  cursor: new Date(),
  eventos: loadLocal(STORAGE_KEY, []),
  categorias: loadLocal(CAT_KEY, CATEGORIAS_DEFAULT),
  responsables: loadLocal(RESP_KEY, RESPONSABLES_DEFAULT),
  filtroCategoria: "todas",
  filtroResponsable: "todos",
  modal: null, // 'evento' | 'categorias' | 'detalleDia'
  eventoEditando: null,
  fechaSeleccionada: null,
  diaDetalle: null,
  eliminarPendienteId: null,
};

function persist() {
  saveLocal(STORAGE_KEY, state.eventos);
  saveLocal(CAT_KEY, state.categorias);
  saveLocal(RESP_KEY, state.responsables);
}

function catById(id) {
  return state.categorias.find(function (c) { return c.id === id; }) || null;
}
function prioById(id) {
  return PRIORIDADES.find(function (p) { return p.id === id; }) || null;
}
function colorTextoLegible(hexColor) {
  if (!hexColor) return "#0B1B2B";
  const hex = hexColor.replace("#", "");
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  const brillo = (r * 299 + g * 587 + b * 114) / 1000;
  return brillo > 150 ? "#0B1B2B" : "#FFFFFF";
}
function inicialCategoria(cat) {
  if (!cat || !cat.label) return "?";
  const limpio = cat.label.trim();
  return limpio.charAt(0).toUpperCase();
}

function eventosVisibles() {
  // Las tareas completadas no se muestran en semana/mes/detalle de día;
  // viven en su propio listado "Tareas Completadas".
  let base = state.eventos.filter(function (e) { return !e.completado; });
  if (state.filtroCategoria !== "todas") {
    base = base.filter(function (e) { return e.categoria === state.filtroCategoria; });
  }
  if (state.filtroResponsable !== "todos") {
    base = base.filter(function (e) { return (e.responsable || "") === state.filtroResponsable; });
  }
  return base;
}
function eventosCompletados() {
  return state.eventos
    .filter(function (e) { return e.completado; })
    .sort(function (a, b) { return (b.fecha + (b.hora || "")).localeCompare(a.fecha + (a.hora || "")); });
}
function eventosPorFecha() {
  const map = {};
  eventosVisibles().forEach(function (e) {
    const fin = e.fechaFin && e.fechaFin > e.fecha ? e.fechaFin : e.fecha;
    let cursor = new Date(e.fecha + "T00:00:00");
    const finDate = new Date(fin + "T00:00:00");
    while (cursor <= finDate) {
      const iso = fmtISO(cursor);
      if (!map[iso]) map[iso] = [];
      map[iso].push(e);
      cursor = addDays(cursor, 1);
    }
  });
  Object.keys(map).forEach(function (k) {
    map[k].sort(function (a, b) { return (a.hora || "").localeCompare(b.hora || ""); });
  });
  return map;
}

   ACCIONES
   ============================================================ */
function abrirNuevo(fecha) {
  state.eventoEditando = null;
  state.fechaSeleccionada = fecha || fmtISO(new Date());
  state.modal = "evento";
  render();
}
function abrirEditar(ev) {

  state.fechaSeleccionada = ev.fecha;
  state.modal = "evento";
  render();
}
function cerrarModal() {
  state.modal = null;
  render();
}
const REPETICION_HORIZONTE = 12; // número de ocurrencias futuras a generar

function sumarRepeticion(fechaISO, tipo) {
  const d = new Date(fechaISO + "T00:00:00");
  if (tipo === "diaria") return fmtISO(addDays(d, 1));
  if (tipo === "semanal") return fmtISO(addDays(d, 7));
  if (tipo === "mensual") {
    const nuevo = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate());
    return fmtISO(nuevo);
  }
  return fechaISO;
}

function guardarEvento(data) {
  if (state.eventoEditando) {
    state.eventos = state.eventos.map(function (e) {
      return e.id === state.eventoEditando.id ? Object.assign({}, e, data) : e;
    });
  } else {
    const serieId = (data.repetir && data.repetir !== "nunca") ? uid() : null;
    const primero = Object.assign({ id: uid() }, data, serieId ? { repetSerieId: serieId } : {});
    state.eventos.push(primero);

    if (serieId) {
      // Generar ocurrencias futuras manteniendo la misma duración del rango (fecha → fechaFin)
      const diasRango = Math.round((new Date(data.fechaFin + "T00:00:00") - new Date(data.fecha + "T00:00:00")) / 86400000);
      let fechaCursor = data.fecha;
      for (let i = 0; i < REPETICION_HORIZONTE; i++) {
        fechaCursor = sumarRepeticion(fechaCursor, data.repetir);
        const fechaFinCursor = fmtISO(addDays(new Date(fechaCursor + "T00:00:00"), diasRango));
        state.eventos.push(Object.assign({}, data, {
          id: uid(),
          fecha: fechaCursor,
          fechaFin: fechaFinCursor,
          repetSerieId: serieId,
          completado: false,
        }));
      }
    }
  }
  persist();
  state.modal = null;
  render();
}
function eliminarEvento(id) {
  state.eventos = state.eventos.filter(function (e) { return e.id !== id; });
  persist();
  render();
}
function pedirConfirmacionEliminar(id) {
  state.eliminarPendienteId = id;
  render();
}
function cancelarConfirmacionEliminar() {
  state.eliminarPendienteId = null;
  render();
}
function confirmarEliminar() {
  if (state.eliminarPendienteId) {
    eliminarEvento(state.eliminarPendienteId);
  }
  state.eliminarPendienteId = null;
  render();
}
function toggleEstado(id) {
  state.eventos = state.eventos.map(function (e) {
    return e.id === id ? Object.assign({}, e, { completado: !e.completado }) : e;
  });
  persist();
  render();
}
function moverASiguienteDia(id) {
  state.eventos = state.eventos.map(function (e) {
    if (e.id !== id) return e;
    const fechaOriginal = new Date(e.fecha + "T00:00:00");
    const nuevaFecha = fmtISO(addDays(fechaOriginal, 1));
    const update = { fecha: nuevaFecha };
    if (e.fechaFin && e.fechaFin > e.fecha) {
      const finOriginal = new Date(e.fechaFin + "T00:00:00");
      update.fechaFin = fmtISO(addDays(finOriginal, 1));
    } else {
      update.fechaFin = nuevaFecha;
    }
    return Object.assign({}, e, update);
  });
  persist();
  render();
}
function moverTodosVencidos() {
  const hoyISO = fmtISO(new Date());
  const mananaISO = fmtISO(addDays(new Date(), 1));
  state.eventos = state.eventos.map(function (e) {
    if (e.completado || e.fecha >= hoyISO) return e;
    const update = { fecha: mananaISO };
    if (e.fechaFin && e.fechaFin > e.fecha) {
      const diasRango = Math.round((new Date(e.fechaFin + "T00:00:00") - new Date(e.fecha + "T00:00:00")) / 86400000);
      update.fechaFin = fmtISO(addDays(new Date(mananaISO + "T00:00:00"), diasRango));
    } else {
      update.fechaFin = mananaISO;
    }
    return Object.assign({}, e, update);
  });
  persist();
  render();
}
function agregarCategoria(label, color) {
  if (!label.trim()) return;
  state.categorias.push({ id: uid(), label: label.trim().toUpperCase(), color: color });
  persist();
  render();
}
function eliminarCategoria(id) {
  state.categorias = state.categorias.filter(function (c) { return c.id !== id; });
  persist();
  render();
}
function agregarResponsable(nombre) {
  if (!nombre.trim() || state.responsables.indexOf(nombre.trim()) !== -1) return;
  state.responsables.push(nombre.trim());
  persist();
  render();
}
function eliminarResponsable(nombre) {
  state.responsables = state.responsables.filter(function (r) { return r !== nombre; });
  persist();
  render();
}

function renderNavTemporal() {
  let label;
  if (state.vista === "semana") {
    const start = startOfWeek(state.cursor);
    const end = addDays(start, 6);
    const mismoMes = start.getMonth() === end.getMonth();
    label = mismoMes
      ? start.getDate() + " – " + end.getDate() + " " + MESES[start.getMonth()] + " " + start.getFullYear()
      : start.getDate() + " " + MESES_ABR[start.getMonth()] + " – " + end.getDate() + " " + MESES_ABR[end.getMonth()] + " " + end.getFullYear();
  } else {
    label = MESES[state.cursor.getMonth()] + " " + state.cursor.getFullYear();
  }
  return (
    '<div class="navtemporal">' +
      '<button class="navbtn" id="nav-prev" aria-label="Anterior">' + icon("chevronLeft", 18) + '</button>' +

/* ============================================================
   RENDER — FILA DE EVENTO
   ============================================================ */
function renderFilaEvento(ev, vencido) {
  const cat = catById(ev.categoria);
  const color = (cat && cat.color) || "#8AA0B5";
  const prio = prioById(ev.prioridad);
  const esMultiDia = ev.fechaFin && ev.fechaFin > ev.fecha;
  let rangoLabel = "";
  if (esMultiDia) {
    const dIni = new Date(ev.fecha + "T00:00:00");
    const dFin = new Date(ev.fechaFin + "T00:00:00");
    rangoLabel = dIni.getDate() + " " + MESES_ABR[dIni.getMonth()] + " → " + dFin.getDate() + " " + MESES_ABR[dFin.getMonth()];
  }
  const horaTermino = ev.hora ? calcularHoraTermino(ev.hora, ev.duracion || 30) : "";
  const colorBanda = vencido ? "#E0524A" : color;
  const colorLetra = colorTextoLegible(colorBanda);
  const letraInicial = vencido ? "!" : inicialCategoria(cat);
  return (
    '<div class="fila-evento" data-action="editar-fila" data-id="' + ev.id + '" style="opacity:' + (ev.completado ? "0.5" : "1") + ';background:' + (vencido ? "rgba(224,82,74,0.06)" : "transparent") + ';cursor:pointer;padding:0;gap:0">' +
      '<div class="mono" style="align-self:stretch;width:26px;min-width:26px;background:' + colorBanda + ';color:' + colorLetra + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:6px 0 0 6px" title="' + escapeHTML((cat && cat.label) || "") + '">' + letraInicial + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;flex:1;min-width:0">' +
      '<button class="check" data-action="toggle" data-id="' + ev.id + '" style="border-color:' + color + ';background:' + (ev.completado ? color : "transparent") + '" title="Marcar"></button>' +
      '<div class="hora mono">' + (ev.hora || "—") + (horaTermino ? '<div style="font-size:9.5px;color:#5C7184;font-weight:500">' + horaTermino + '</div>' : "") + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="titulo cond' + (ev.completado ? " done" : "") + '">' + escapeHTML(ev.titulo) + '</div>' +
        '<div class="meta-row">' +
          (vencido ? '<span class="meta-vencido mono">VENCIDO</span>' : "") +
          (esMultiDia ? '<span class="mono" style="font-size:10px;color:' + color + ';font-weight:600">' + icon("skip", 9) + ' ' + rangoLabel + '</span>' : "") +
          (ev.repetSerieId ? '<span class="mono" style="font-size:10px;color:#8AA0B5">↻</span>' : "") +
          (ev.responsable ? '<span class="meta-resp cond">' + icon("user", 10) + ' ' + escapeHTML(ev.responsable) + '</span>' : "") +
          (prio ? '<span class="meta-prio cond" style="color:' + prio.color + '">' + prio.label + '</span>' : "") +
        '</div>' +
      '</div>' +
      (vencido ? '<button class="btn-manana cond" data-action="manana" data-id="' + ev.id + '">' + icon("skip", 12) + ' Mañana</button>' : "") +
      '<div class="acciones">' +
        '<button class="iconbtn-sm" data-action="export" data-id="' + ev.id + '" title="Alarma (.ics)">' + icon("alert", 12) + '</button>' +
        '<button class="iconbtn-sm" data-action="eliminar" data-id="' + ev.id + '" title="Eliminar">' + icon("trash", 12) + '</button>' +
      '</div>' +
      '</div>' +
    '</div>'
  );
}

/* ============================================================
   RENDER — VISTA SEMANA
   ============================================================ */
function renderVistaSemana() {
  const start = startOfWeek(state.cursor);
  const dias = [];
  for (let i = 0; i < 7; i++) dias.push(addDays(start, i));
  const hoy = new Date();
  const hoyISO = fmtISO(hoy);
  const porFecha = eventosPorFecha();

  // Acentos sutiles por día de la semana (LUN→DOM), distintos entre sí pero discretos.
  const ACENTOS_DIA = ["#6FA8D9", "#5FE3A1", "#D99A3D", "#C97FE0", "#7FB8C9", "#B8A06F", "#8A8FE0"];

  let html = "";
  dias.forEach(function (d, i) {
    const iso = fmtISO(d);
    const evs = porFecha[iso] || [];
    const esHoy = isSameDay(d, hoy);
    const acento = ACENTOS_DIA[i];
    const claseAlt = (i % 2 === 1 && !esHoy) ? " alt" : "";
    html +=
      '<div class="daycard' + (esHoy ? " today" : claseAlt) + '" style="' + (esHoy ? "" : "border-top-color:" + acento) + '">' +
        '<div class="daycard-head' + (evs.length ? "" : " empty") + '">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<div class="mono" style="font-size:12px;font-weight:700;color:' + (esHoy ? "#D99A3D" : acento) + ';letter-spacing:1px">' + DIAS_SEM[i] + '</div>' +
            '<div class="cond" style="font-size:14px;color:#C9D2DA">' + d.getDate() + ' ' + MESES_ABR[d.getMonth()] + '</div>' +
            (esHoy ? '<span class="badge-hoy mono">HOY</span>' : "") +
          '</div>' +
          '<div style="display:flex;gap:6px">' +
            (evs.length > 0 ? '<button class="iconbtn" data-action="export-dia" data-fecha="' + iso + '" title="Exportar día">' + icon("download", 14) + '</button>' : "") +
            '<button class="iconbtn" data-action="nuevo-fecha" data-fecha="' + iso + '" title="Agregar evento">' + icon("plus", 14) + '</button>' +
          '</div>' +
        '</div>' +
        (evs.length === 0
          ? '<div class="empty-day cond">Sin novedades</div>'
          : evs.map(function (ev) { return renderFilaEvento(ev, !ev.completado && ev.fecha < hoyISO); }).join("")
        ) +
      '</div>';
  });
  return '<div>' + html + '</div>';
}

/* ============================================================
   RENDER — VISTA MES
   ============================================================ */
function renderVistaMes() {
  const first = startOfMonth(state.cursor);
  const startGrid = startOfWeek(first);
  const celdas = [];
  for (let i = 0; i < 42; i++) celdas.push(addDays(startGrid, i));
  const hoy = new Date();
  const mesActual = state.cursor.getMonth();
  const porFecha = eventosPorFecha();

  let dowHtml = DIAS_SEM.map(function (d) { return '<div class="dow-label mono">' + d + '</div>'; }).join("");

  let cellsHtml = celdas.map(function (d) {
    const iso = fmtISO(d);
    const evs = porFecha[iso] || [];
    const enMes = d.getMonth() === mesActual;
    const esHoy = isSameDay(d, hoy);
    let evsHtml = evs.slice(0, 4).map(function (ev) {
      const cat = catById(ev.categoria);
      const color = (cat && cat.color) || "#8AA0B5";
      const letraInicial = inicialCategoria(cat);
      return '<div class="month-evt cond' + (ev.completado ? " done" : "") + '" style="background:' + color + '22;border-left-color:' + color + '">' +
        '<span class="mono" style="color:' + color + ';font-weight:700">' + letraInicial + '</span> ' +
        (ev.hora ? '<span class="mono" style="color:#D99A3D;font-weight:600">' + ev.hora + '</span> ' : "") + escapeHTML(ev.titulo) + '</div>';
    }).join("");
    if (evs.length > 4) evsHtml += '<div class="month-more">+' + (evs.length - 4) + ' más</div>';

    return (
      '<div class="month-cell' + (esHoy ? " today" : "") + (enMes ? "" : " outside") + '" data-action="dia-click" data-fecha="' + iso + '" data-has-events="' + (evs.length ? "1" : "0") + '">' +
        '<div class="month-cell-num mono' + (esHoy ? " today" : "") + '">' + d.getDate() + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0">' + evsHtml + '</div>' +
      '</div>'
    );
  }).join("");

  return (
    '<div id="month-dow-wrap" class="month-dow-sticky-wrap scrollbar">' +
      '<div class="month-dow">' + dowHtml + '</div>' +
    '</div>' +
    '<div id="month-grid-wrap" class="month-scroll scrollbar">' +
      '<div class="month-grid">' + cellsHtml + '</div>' +
    '</div>' +
    '<div class="cond" style="text-align:center;font-size:11px;color:#5C7184;margin-top:8px">← Desliza horizontalmente para ver toda la semana →</div>'
  );
}

/* ============================================================
   RENDER — MODALES

  const durMinutos = duracionTotal % 60;
  const categoria = (ev && ev.categoria) || (state.categorias[0] || {}).id || "";
  const responsable = (ev && ev.responsable) || "";
  const responsableEsLibre = responsable && state.responsables.indexOf(responsable) === -1;
  const prioridad = (ev && ev.prioridad) || "media";
  const lugar = (ev && ev.lugar) || "";
  const notas = (ev && ev.notas) || "";
  const titulo = (ev && ev.titulo) || "";
  const repetir = (ev && ev.repetir) || "nunca";

  const catOptions = state.categorias.map(function (c) {
    return '<option value="' + c.id + '"' + (categoria === c.id ? " selected" : "") + '>' + escapeHTML(c.label) + '</option>';

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render() {
  const fab = state.eventos.length > 0
    ? '<button class="fab cond" id="btn-export-todo">' + icon("download", 15) + ' Exportar todo (.ics)</button>'
    : "";

  let modalHtml = "";
  if (state.modal === "evento") modalHtml = renderModalEvento();
  else if (state.modal === "categorias") modalHtml = renderModalCategorias();
  else if (state.modal === "detalleDia") modalHtml = renderModalDetalleDia();
  else if (state.modal === "completadas") modalHtml = renderModalCompletadas();
  else if (state.modal === "diagnostico") modalHtml = renderModalDiagnostico();

  const confirmHtml = state.eliminarPendienteId ? renderModalConfirmarEliminar() : "";

  const html =
    renderTopbar() +
    renderControles() +
    renderNavTemporal() +
    '<div class="view-area">' + (state.vista === "semana" ? renderVistaSemana() : renderVistaMes()) + '</div>' +
    fab +
    modalHtml +
    confirmHtml;

  document.getElementById("app").innerHTML = html;
  bindEvents();
}

/* ============================================================
   EVENTOS DE INTERFAZ (delegación simple por re-render)
   ============================================================ */
function bindEvents() {
  const app = document.getElementById("app");

  // Sincronizar scroll horizontal entre el header de días (sticky) y el grid de celdas (vista mes)
  const dowWrap = document.getElementById("month-dow-wrap");
  const gridWrap = document.getElementById("month-grid-wrap");
  if (dowWrap && gridWrap) {
    let sincronizando = false;
    dowWrap.onscroll = function () {
      if (sincronizando) return;
      sincronizando = true;
      gridWrap.scrollLeft = dowWrap.scrollLeft;
      sincronizando = false;
    };
    gridWrap.onscroll = function () {
      if (sincronizando) return;
      sincronizando = true;
      dowWrap.scrollLeft = gridWrap.scrollLeft;
      sincronizando = false;
    };
  }

  // Tabs
  const tabSemana = document.getElementById("tab-semana");
  const tabMes = document.getElementById("tab-mes");
  if (tabSemana) tabSemana.onclick = function () { state.vista = "semana"; render(); };
  if (tabMes) tabMes.onclick = function () { state.vista = "mes"; render(); };

  // Filtro categoría
  const filtroSel = document.getElementById("filtro-categoria");
  if (filtroSel) filtroSel.onchange = function (e) { state.filtroCategoria = e.target.value; render(); };
  const filtroResp = document.getElementById("filtro-responsable");
  if (filtroResp) filtroResp.onchange = function (e) { state.filtroResponsable = e.target.value; render(); };

  // Botones top
  const btnCategorias = document.getElementById("btn-categorias");
  if (btnCategorias) btnCategorias.onclick = function () { state.modal = "categorias"; render(); };
  const btnCompletadas = document.getElementById("btn-completadas");
  if (btnCompletadas) btnCompletadas.onclick = function () { state.modal = "completadas"; render(); };
  const btnDiagnostico = document.getElementById("btn-diagnostico");
  if (btnDiagnostico) btnDiagnostico.onclick = function () { state.modal = "diagnostico"; render(); };
  const btnNuevoEvento = document.getElementById("btn-nuevo-evento");
  if (btnNuevoEvento) btnNuevoEvento.onclick = function () { abrirNuevo(fmtISO(new Date())); };
  const btnMoverTodos = document.getElementById("btn-mover-todos");
  if (btnMoverTodos) btnMoverTodos.onclick = moverTodosVencidos;

  // Nav temporal
  const navPrev = document.getElementById("nav-prev");
  const navNext = document.getElementById("nav-next");
  const navHoy = document.getElementById("nav-hoy");
  if (navPrev) navPrev.onclick = function () {
    state.cursor = state.vista === "semana" ? addDays(state.cursor, -7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1);
    render();
  };
  if (navNext) navNext.onclick = function () {
    state.cursor = state.vista === "semana" ? addDays(state.cursor, 7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1);
    render();
  };
  if (navHoy) navHoy.onclick = function () { state.cursor = new Date(); render(); };

  // FAB exportar todo
  const btnExportTodo = document.getElementById("btn-export-todo");
  if (btnExportTodo) btnExportTodo.onclick = function () { downloadICSBatch(eventosVisibles(), "bitacora_completa"); };

  // Delegación de acciones por data-action dentro de #app
  app.querySelectorAll("[data-action]").forEach(function (el) {
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");
    const fecha = el.getAttribute("data-fecha");

    if (action === "toggle") el.onclick = function (e) { e.stopPropagation(); toggleEstado(id); };
    else if (action === "manana") el.onclick = function (e) { e.stopPropagation(); moverASiguienteDia(id); };
    else if (action === "export") el.onclick = function (e) {
      e.stopPropagation();
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) downloadICS(ev);
    };
    else if (action === "editar") el.onclick = function () {
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) abrirEditar(ev);
    };
    else if (action === "editar-fila") el.onclick = function () {
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) abrirEditar(ev);
    };
    else if (action === "eliminar") el.onclick = function (e) { e.stopPropagation(); pedirConfirmacionEliminar(id); };
    else if (action === "export-dia") el.onclick = function (e) {
      e.stopPropagation();
      const evs = eventosPorFecha()[fecha] || [];
      downloadICSBatch(evs, "dia_" + fecha);
    };
    else if (action === "nuevo-fecha") el.onclick = function (e) { e.stopPropagation(); abrirNuevo(fecha); };
    else if (action === "dia-click") el.onclick = function () {
      const hasEvents = el.getAttribute("data-has-events") === "1";
      if (hasEvents) { state.diaDetalle = fecha; state.modal = "detalleDia"; render(); }
      else abrirNuevo(fecha);
    };
    else if (action === "cerrar-modal") el.onclick = cerrarModal;
    else if (action === "del-categoria") el.onclick = function (e) { e.stopPropagation(); eliminarCategoria(id); };
    else if (action === "del-responsable") el.onclick = function (e) { e.stopPropagation(); eliminarResponsable(el.getAttribute("data-nombre")); };
  });

  // Cerrar overlay al tocar el fondo (no el modal)
  ["overlay-evento", "overlay-categorias", "overlay-detalle-dia", "overlay-completadas", "overlay-diagnostico"].forEach(function (oid) {
    const overlay = document.getElementById(oid);
    if (overlay) {
      overlay.onclick = function (e) { if (e.target === overlay) cerrarModal(); };
    }
  });

  // Modal de confirmación de eliminación (capa independiente, puede estar sobre otro modal)
  const overlayConfirmar = document.getElementById("overlay-confirmar-eliminar");
  if (overlayConfirmar) {
    overlayConfirmar.onclick = function (e) { if (e.target === overlayConfirmar) cancelarConfirmacionEliminar(); };
  }
  const btnCancelarEliminar = document.getElementById("btn-cancelar-eliminar");
  if (btnCancelarEliminar) btnCancelarEliminar.onclick = cancelarConfirmacionEliminar;
  const btnCancelarEliminar2 = document.getElementById("btn-cancelar-eliminar-2");
  if (btnCancelarEliminar2) btnCancelarEliminar2.onclick = cancelarConfirmacionEliminar;
  const btnConfirmarEliminar = document.getElementById("btn-confirmar-eliminar");
  if (btnConfirmarEliminar) btnConfirmarEliminar.onclick = confirmarEliminar;

  /* ---------- Modal evento: lógica específica ---------- */
  if (state.modal === "evento") {
    const fechaInicioInput = document.getElementById("ev-fecha");
    const fechaFinInput = document.getElementById("ev-fecha-fin");
    if (fechaInicioInput && fechaFinInput) {
      fechaInicioInput.onchange = function () {
        fechaFinInput.min = fechaInicioInput.value;
        if (fechaFinInput.value < fechaInicioInput.value) fechaFinInput.value = fechaInicioInput.value;
      };
    }

    // Recalcular y mostrar la hora de término en vivo al cambiar hora inicio o duración
    const horaInput = document.getElementById("ev-hora");
    const horasSel = document.getElementById("ev-dur-horas");
    const minutosSel = document.getElementById("ev-dur-minutos");
    const terminoLabel = document.getElementById("ev-hora-termino");
    function actualizarHoraTermino() {
      if (!horaInput || !horasSel || !minutosSel || !terminoLabel) return;
      const durMin = (Number(horasSel.value) || 0) * 60 + (Number(minutosSel.value) || 0);
      terminoLabel.textContent = "Término: " + calcularHoraTermino(horaInput.value, durMin);
    }
    if (horaInput) horaInput.onchange = actualizarHoraTermino;
    if (horasSel) horasSel.onchange = actualizarHoraTermino;
    if (minutosSel) minutosSel.onchange = actualizarHoraTermino;

    const respSel = document.getElementById("ev-responsable");
    if (respSel) {
      respSel.onchange = function (e) {
        if (e.target.value === "__libre__") {
          // re-render forzando modo libre: simulamos guardando un responsable temporal vacío marcado
          const tempEv = Object.assign({}, state.eventoEditando || {}, { responsable: " " });
          // truco simple: usamos un dataset para forzar modo libre
          document.getElementById("resp-wrap").innerHTML =
            '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
          document.getElementById("btn-resp-volver").onclick = function () {
            document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
            bindRespSelect();
          };
        }
      };
    }
    const btnRespVolver = document.getElementById("btn-resp-volver");
    if (btnRespVolver) {
      btnRespVolver.onclick = function () {
        document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
        bindRespSelect();
      };
    }

    // Botones de prioridad (sin re-render completo, solo toggle visual + estado en dataset)
    const prioRow = document.getElementById("prio-row");
    if (prioRow) {
      let prioridadActual = (state.eventoEditando && state.eventoEditando.prioridad) || "media";
      prioRow.querySelectorAll(".prio-btn").forEach(function (btn) {
        btn.onclick = function () {
          prioridadActual = btn.getAttribute("data-prio");
          prioRow.querySelectorAll(".prio-btn").forEach(function (b2) {
            const pid = b2.getAttribute("data-prio");
            const p = prioById(pid);
            const active = pid === prioridadActual;
            b2.style.background = active ? p.color : "transparent";
            b2.style.color = active ? "#0B1B2B" : p.color;
          });
          prioRow.dataset.value = prioridadActual;
        };
      });
      prioRow.dataset.value = prioridadActual;
    }

    const btnGuardar = document.getElementById("btn-guardar-evento");
    if (btnGuardar) {
      btnGuardar.onclick = function () {
        const titulo = document.getElementById("ev-titulo").value;
        const fecha = document.getElementById("ev-fecha").value;
        let fechaFin = document.getElementById("ev-fecha-fin").value || fecha;
        const hora = document.getElementById("ev-hora").value;
        const durHoras = Number(document.getElementById("ev-dur-horas").value) || 0;
        const durMinutos = Number(document.getElementById("ev-dur-minutos").value) || 0;
        const duracion = durHoras * 60 + durMinutos;
        const repetir = document.getElementById("ev-repetir").value;
        const categoria = document.getElementById("ev-categoria").value;
        const respLibre = document.getElementById("ev-responsable-libre");
        const respSelect = document.getElementById("ev-responsable");
        const responsable = respLibre ? respLibre.value : (respSelect ? respSelect.value : "");
        const lugar = document.getElementById("ev-lugar").value;
        const notas = document.getElementById("ev-notas").value;
        const prioridad = (document.getElementById("prio-row") || {}).dataset
          ? document.getElementById("prio-row").dataset.value
          : "media";

        const errorBox = document.getElementById("ev-error");
        if (!titulo.trim()) { errorBox.innerHTML = '<div class="error-text cond">El título es obligatorio.</div>'; return; }
        if (!fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha es obligatoria.</div>'; return; }
        if (fechaFin < fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha de término no puede ser anterior a la fecha de inicio.</div>'; return; }
        if (duracion <= 0) { errorBox.innerHTML = '<div class="error-text cond">La duración debe ser mayor a 0.</div>'; return; }

        guardarEvento({
          titulo: titulo.trim(), fecha: fecha, fechaFin: fechaFin, hora: hora, duracion: duracion,
          repetir: repetir, categoria: categoria, responsable: (responsable || "").trim(), prioridad: prioridad || "media",
          lugar: lugar.trim(), notas: notas.trim(),
          completado: (state.eventoEditando && state.eventoEditando.completado) || false,
        });
      };
    }
  }

  /* ---------- Modal categorías: lógica específica ---------- */
  if (state.modal === "categorias") {
    const btnAddCat = document.getElementById("btn-add-categoria");
    if (btnAddCat) {
      btnAddCat.onclick = function () {
        const nombre = document.getElementById("nueva-cat-nombre").value;
        const color = document.getElementById("nueva-cat-color").value;
        agregarCategoria(nombre, color);
      };
    }
    const nuevaCatInput = document.getElementById("nueva-cat-nombre");
    if (nuevaCatInput) {
      nuevaCatInput.onkeydown = function (e) {
        if (e.key === "Enter") {
          const color = document.getElementById("nueva-cat-color").value;
          agregarCategoria(nuevaCatInput.value, color);
        }
      };
    }
    const btnAddResp = document.getElementById("btn-add-responsable");
    if (btnAddResp) {
      btnAddResp.onclick = function () {
        const nombre = document.getElementById("nuevo-resp-nombre").value;
        agregarResponsable(nombre);
      };
    }
    const nuevoRespInput = document.getElementById("nuevo-resp-nombre");
    if (nuevoRespInput) {
      nuevoRespInput.onkeydown = function (e) {
        if (e.key === "Enter") agregarResponsable(nuevoRespInput.value);
      };
    }
  }

  /* ---------- Modal detalle día ---------- */
  if (state.modal === "detalleDia") {
    const btnAgregarDia = document.getElementById("btn-agregar-dia");
    if (btnAgregarDia) {
      btnAgregarDia.onclick = function () {
        const fecha = state.diaDetalle;
        state.modal = null;
        abrirNuevo(fecha);
      };
    }
  }

  /* ---------- Modal diagnóstico (modo sin internet) ---------- */
  if (state.modal === "diagnostico") {
    const btnReintentar = document.getElementById("btn-reintentar-cache");
    if (btnReintentar) {
      btnReintentar.onclick = function () {
        btnReintentar.textContent = "Guardando…";
        if (!("serviceWorker" in navigator) || !("caches" in window)) {
          window.swEstado.error = "Este navegador no soporta caché offline.";
          render();
          return;
        }
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
          window.swEstado.registrado = true;
          return reg.update();
        }).then(function () {
          return caches.open("bitacora-operativa-v1");
        }).then(function (cache) {
          return Promise.all([
            cache.add(window.location.href),
            cache.add(new URL("./index.html", window.location.href).href),
            cache.add(new URL("./manifest.json", window.location.href).href),
            cache.add(new URL("./sw.js", window.location.href).href),
          ]);
        }).then(function () {
          window.swEstado.cacheado = true;
          window.swEstado.error = null;
          render();
        }).catch(function (err) {
          window.swEstado.error = "Error al reintentar: " + err.message;
          render();
        });
      };
    }
  }
}

function renderRespSelectOnly(selected) {
  const respOptions = state.responsables.map(function (r) {
    return '<option value="' + escapeHTML(r) + '"' + (selected === r ? " selected" : "") + '>' + escapeHTML(r) + '</option>';
  }).join("");
  return '<select class="field" id="ev-responsable"><option value="">— Sin asignar —</option>' + respOptions + '<option value="__libre__">✎ Escribir otro nombre…</option></select>';
}
function bindRespSelect() {
  const respSel = document.getElementById("ev-responsable");
  if (respSel) {
    respSel.onchange = function (e) {
      if (e.target.value === "__libre__") {
        document.getElementById("resp-wrap").innerHTML =
          '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
        document.getElementById("btn-resp-volver").onclick = function () {
          document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
          bindRespSelect();
        };
      }
    };
  }
}

/* ---------- Reloj en vivo (actualiza solo el texto, sin re-render completo) ---------- */
setInterval(function () {
  const clockEl = document.getElementById("dtg-clock");
  if (clockEl) clockEl.textContent = fmtDTG(new Date());
}, 30000);

/* ---------- Arranque ---------- */
render();

/* ---------- Service Worker real para funcionamiento sin internet ----------
   Registrado desde un archivo sw.js propio (no Blob), que es el método
   estándar y confiable, incluyendo en Safari/iOS 16.4+.
   La ruta es relativa para funcionar correctamente bajo la subcarpeta
   de GitHub Pages (https://usuario.github.io/nombre-repo/).
   Se registra inmediatamente (sin esperar "load") y se expone su estado
   en window.swEstado para poder verificarlo desde la propia interfaz. */
window.swEstado = { soportado: false, registrado: false, cacheado: false, error: null };

if ("serviceWorker" in navigator) {
  window.swEstado.soportado = true;
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
    window.swEstado.registrado = true;
    // Forzar el cacheo explícito de la página actual completa (URL absoluta),
    // como refuerzo adicional al cache.addAll() que ya hace sw.js en su evento "install".
    if ("caches" in window) {
      caches.open("bitacora-operativa-v1").then(function (cache) {
        return Promise.all([
          cache.add(window.location.href),
          cache.add(new URL("./index.html", window.location.href).href),
          cache.add(new URL("./manifest.json", window.location.href).href),
        ]);
      }).then(function () {
        window.swEstado.cacheado = true;
      }).catch(function (err) {
        window.swEstado.error = "Error al cachear: " + err.message;
      });
    }
  }).catch(function (err) {
    window.swEstado.error = "Error al registrar: " + err.message;
  });
} else {
  window.swEstado.error = "Este navegador no soporta Service Workers.";
}
</script>
</body>
</html>
