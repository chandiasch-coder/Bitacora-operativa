function bindEventsMolo() {
  if (state.seccion !== "molo") return;

  const btnNuevoBuque = document.getElementById("btn-nuevo-buque");
  if (btnNuevoBuque) btnNuevoBuque.onclick = function () { state.buqueEditando = null; state.modalMolo = "buque"; render(); };

  const moloNavPrev = document.getElementById("molo-nav-prev");
  const moloNavNext = document.getElementById("molo-nav-next");
  const moloNavHoy = document.getElementById("molo-nav-hoy");
  if (moloNavPrev) moloNavPrev.onclick = function () { state.cursorMolo = addDays(state.cursorMolo, -7); render(); };
  if (moloNavNext) moloNavNext.onclick = function () { state.cursorMolo = addDays(state.cursorMolo, 7); render(); };
  if (moloNavHoy) moloNavHoy.onclick = function () { state.cursorMolo = new Date(); render(); };

  const btnTiposActividad = document.getElementById("btn-tipos-actividad-molo");
  if (btnTiposActividad) btnTiposActividad.onclick = function () { state.modalMolo = "tiposActividad"; render(); };

  const btnGestionarBuques = document.getElementById("btn-gestionar-buques");
  if (btnGestionarBuques) btnGestionarBuques.onclick = function () { state.modalMolo = "gestionarBuques"; render(); };

  const btnNuevaActividadMolo = document.getElementById("btn-nueva-actividad-molo");
  if (btnNuevaActividadMolo) btnNuevaActividadMolo.onclick = function () {
    if (state.buques.length === 0) { state.buqueEditando = null; state.modalMolo = "buque"; render(); return; }
    state.actividadEditando = null;
    state.modalMolo = "actividad";
    render();
  };

  document.querySelectorAll("[data-action='abrir-celda-molo']").forEach(function (el) {
    el.onclick = function () {
      state.celdaMoloDetalle = { buqueId: el.getAttribute("data-buque"), fecha: el.getAttribute("data-fecha") };
      render();
    };
  });
  document.querySelectorAll("[data-action='editar-actividad-molo-directo']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const id = el.getAttribute("data-id");
      state.actividadEditando = state.actividadesTrafico.find(function (a) { return a.id === id; });
      state.celdaMoloDetalle = null;
      state.modalMolo = "actividad";
      render();
    };
  });
  document.querySelectorAll("[data-action='editar-buque']").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-id");
      state.buqueEditando = state.buques.find(function (b) { return b.id === id; });
      state.modalMolo = "buque";
      render();
    };
  });

  // Modal buque
  const cerrarModalBuque = function () { state.modalMolo = null; state.buqueEditando = null; render(); };
  const btnCerrarBuque = document.getElementById("btn-cerrar-buque");
  const btnCancelarBuque = document.getElementById("btn-cancelar-buque");
  if (btnCerrarBuque) btnCerrarBuque.onclick = cerrarModalBuque;
  if (btnCancelarBuque) btnCancelarBuque.onclick = cerrarModalBuque;
  const overlayBuque = document.getElementById("overlay-buque");
  if (overlayBuque) overlayBuque.onclick = function (e) { if (e.target === overlayBuque) cerrarModalBuque(); };

  const btnGuardarBuque = document.getElementById("btn-guardar-buque");
  if (btnGuardarBuque) {
    btnGuardarBuque.onclick = function () {
      const nombre = document.getElementById("buque-nombre").value.trim();
      const tipo = document.getElementById("buque-tipo").value.trim();
      const errorBox = document.getElementById("buque-error");
      if (!nombre) { errorBox.innerHTML = '<div class="error-text cond">El nombre es obligatorio.</div>'; return; }
      if (state.buqueEditando) {
        state.buques = state.buques.map(function (b) {
          return b.id === state.buqueEditando.id ? Object.assign({}, b, { nombre: nombre, tipo: tipo }) : b;
        });
      } else {
        state.buques.push({ id: uid(), nombre: nombre, tipo: tipo });
      }
      persist();
      state.modalMolo = null;
      state.buqueEditando = null;
      render();
    };
  }
  const btnEliminarBuqueDesdeModal = document.getElementById("btn-eliminar-buque-desde-modal");
  if (btnEliminarBuqueDesdeModal) {
    btnEliminarBuqueDesdeModal.onclick = function () {
      state.eliminarBuquePendienteId = state.buqueEditando.id;
      state.modalMolo = "confirmarEliminarBuque";
      render();
    };
  }

  // Confirmar eliminar buque
  const btnCancelarEliminarBuque = document.getElementById("btn-cancelar-eliminar-buque");
  if (btnCancelarEliminarBuque) btnCancelarEliminarBuque.onclick = function () { state.modalMolo = null; state.eliminarBuquePendienteId = null; render(); };
  const btnConfirmarEliminarBuque = document.getElementById("btn-confirmar-eliminar-buque");
  if (btnConfirmarEliminarBuque) {
    btnConfirmarEliminarBuque.onclick = function () {
      const id = state.eliminarBuquePendienteId;
      state.buques = state.buques.filter(function (b) { return b.id !== id; });
      state.actividadesTrafico = state.actividadesTrafico.filter(function (a) { return a.buqueId !== id; });
      persist();
      state.modalMolo = null;
      state.eliminarBuquePendienteId = null;
      state.buqueEditando = null;
      render();
    };
  }

  // Modal actividad
  const cerrarModalActividad = function () { state.modalMolo = state.celdaMoloDetalle ? null : null; state.actividadEditando = null; if (!state.celdaMoloDetalle) state.modalMolo = null; render(); };
  const btnCerrarActividadMolo = document.getElementById("btn-cerrar-actividad-molo");
  const btnCancelarActividadMolo = document.getElementById("btn-cancelar-actividad-molo");
  if (btnCerrarActividadMolo) btnCerrarActividadMolo.onclick = function () { state.modalMolo = null; state.actividadEditando = null; render(); };
  if (btnCancelarActividadMolo) btnCancelarActividadMolo.onclick = function () { state.modalMolo = null; state.actividadEditando = null; render(); };
  const overlayActividadMolo = document.getElementById("overlay-actividad-molo");
  if (overlayActividadMolo) overlayActividadMolo.onclick = function (e) { if (e.target === overlayActividadMolo) { state.modalMolo = null; state.actividadEditando = null; render(); } };

  const fechaInicioMolo = document.getElementById("act-molo-fecha");
  const fechaFinMolo = document.getElementById("act-molo-fecha-fin");
  if (fechaInicioMolo && fechaFinMolo) {
    fechaInicioMolo.onchange = function () {
      fechaFinMolo.min = fechaInicioMolo.value;
      if (fechaFinMolo.value < fechaInicioMolo.value) fechaFinMolo.value = fechaInicioMolo.value;
    };
  }
  const horaInicioMolo = document.getElementById("act-molo-hora");
  const horasMoloSel = document.getElementById("act-molo-dur-horas");
  const minutosMoloSel = document.getElementById("act-molo-dur-minutos");
  const terminoMoloLabel = document.getElementById("act-molo-hora-termino");
  function actualizarHoraTerminoMolo() {
    if (!horaInicioMolo || !horasMoloSel || !minutosMoloSel || !terminoMoloLabel) return;
    const durMin = (Number(horasMoloSel.value) || 0) * 60 + (Number(minutosMoloSel.value) || 0);
    terminoMoloLabel.textContent = "Término: " + calcularHoraTermino(horaInicioMolo.value, durMin);
  }
  if (horaInicioMolo) horaInicioMolo.onchange = actualizarHoraTerminoMolo;
  if (horasMoloSel) horasMoloSel.onchange = actualizarHoraTerminoMolo;
  if (minutosMoloSel) minutosMoloSel.onchange = actualizarHoraTerminoMolo;

  const btnGuardarActividadMolo = document.getElementById("btn-guardar-actividad-molo");
  if (btnGuardarActividadMolo) {
    btnGuardarActividadMolo.onclick = function () {
      const buqueId = document.getElementById("act-molo-buque").value;
      const tipo = document.getElementById("act-molo-tipo").value;
      const fecha = document.getElementById("act-molo-fecha").value;
      let fechaFin = document.getElementById("act-molo-fecha-fin").value || fecha;
      const hora = document.getElementById("act-molo-hora").value;
      const durHoras = Number(document.getElementById("act-molo-dur-horas").value) || 0;
      const durMinutos = Number(document.getElementById("act-molo-dur-minutos").value) || 0;
      const duracion = durHoras * 60 + durMinutos;
      const notas = document.getElementById("act-molo-notas").value.trim();
      const errorBox = document.getElementById("act-molo-error");
      if (!buqueId) { errorBox.innerHTML = '<div class="error-text cond">Debes seleccionar un buque.</div>'; return; }
      if (!fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha es obligatoria.</div>'; return; }
      if (fechaFin < fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha de término no puede ser anterior a la de inicio.</div>'; return; }
      if (state.actividadEditando) {
        state.actividadesTrafico = state.actividadesTrafico.map(function (a) {
          return a.id === state.actividadEditando.id ? Object.assign({}, a, { buqueId: buqueId, tipo: tipo, fecha: fecha, fechaFin: fechaFin, hora: hora, duracion: duracion, notas: notas }) : a;
        });
      } else {
        state.actividadesTrafico.push({ id: uid(), buqueId: buqueId, tipo: tipo, fecha: fecha, fechaFin: fechaFin, hora: hora, duracion: duracion, notas: notas });
      }
      persist();
      state.modalMolo = null;
      state.actividadEditando = null;
      render();
    };
  }

  // Detalle de celda (buque x día)
  const btnCerrarDetalleCelda = document.getElementById("btn-cerrar-detalle-celda-molo");
  if (btnCerrarDetalleCelda) btnCerrarDetalleCelda.onclick = function () { state.celdaMoloDetalle = null; render(); };
  const overlayDetalleCelda = document.getElementById("overlay-detalle-celda-molo");
  if (overlayDetalleCelda) overlayDetalleCelda.onclick = function (e) { if (e.target === overlayDetalleCelda) { state.celdaMoloDetalle = null; render(); } };
  const btnAgregarActividadDesdeCelda = document.getElementById("btn-agregar-actividad-desde-celda");
  if (btnAgregarActividadDesdeCelda) {
    btnAgregarActividadDesdeCelda.onclick = function () {
      // Importante: NO limpiar state.celdaMoloDetalle aquí — renderModalActividadMolo
      // lo usa como fallback para pre-llenar buque y fecha. El detalle de celda se
      // oculta automáticamente mientras modalMolo esté activo (ver condición en render).
      state.actividadEditando = null;
      state.modalMolo = "actividad";
      render();
    };
  }
  document.querySelectorAll("[data-action='editar-actividad-molo']").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-id");
      state.actividadEditando = state.actividadesTrafico.find(function (a) { return a.id === id; });
      state.modalMolo = "actividad";
      render();
    };
  });
  document.querySelectorAll("[data-action='eliminar-actividad-molo']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      state.eliminarActividadPendienteId = el.getAttribute("data-id");
      state.modalMolo = "confirmarEliminarActividad";
      render();
    };
  });
  const btnCancelarEliminarActMolo = document.getElementById("btn-cancelar-eliminar-actividad-molo");
  if (btnCancelarEliminarActMolo) btnCancelarEliminarActMolo.onclick = function () { state.modalMolo = null; state.eliminarActividadPendienteId = null; render(); };
  const btnConfirmarEliminarActMolo = document.getElementById("btn-confirmar-eliminar-actividad-molo");
  if (btnConfirmarEliminarActMolo) {
    btnConfirmarEliminarActMolo.onclick = function () {
      const id = state.eliminarActividadPendienteId;
      state.actividadesTrafico = state.actividadesTrafico.filter(function (a) { return a.id !== id; });
      persist();
      state.modalMolo = null;
      state.eliminarActividadPendienteId = null;
      render();
    };
  }

  // Modal tipos de actividad
  const btnCerrarTiposActividad = document.getElementById("btn-cerrar-tipos-actividad");
  if (btnCerrarTiposActividad) btnCerrarTiposActividad.onclick = function () { state.modalMolo = null; render(); };
  const overlayTiposActividad = document.getElementById("overlay-tipos-actividad");
  if (overlayTiposActividad) overlayTiposActividad.onclick = function (e) { if (e.target === overlayTiposActividad) { state.modalMolo = null; render(); } };
  document.querySelectorAll("[data-action='del-tipo-actividad-molo']").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-id");
      state.tiposActividadMolo = state.tiposActividadMolo.filter(function (t) { return t.id !== id; });
      persist();
      render();
    };
  });
  const btnAddTipoActividad = document.getElementById("btn-add-tipo-actividad");
  if (btnAddTipoActividad) {
    btnAddTipoActividad.onclick = function () {
      const nombre = document.getElementById("nuevo-tipo-nombre").value.trim();
      const color = document.getElementById("nuevo-tipo-color").value;
      if (!nombre) return;
      state.tiposActividadMolo.push({ id: uid(), label: nombre.toUpperCase(), color: color });
      persist();
      render();
    };
  }
  const nuevoTipoNombre = document.getElementById("nuevo-tipo-nombre");
  if (nuevoTipoNombre) {
    nuevoTipoNombre.onkeydown = function (e) {
      if (e.key === "Enter") {
        const color = document.getElementById("nuevo-tipo-color").value;
        if (!nuevoTipoNombre.value.trim()) return;
        state.tiposActividadMolo.push({ id: uid(), label: nuevoTipoNombre.value.trim().toUpperCase(), color: color });
        persist();
        render();
      }
    };
  }

  // Modal gestionar buques
  const btnCerrarGestionarBuques = document.getElementById("btn-cerrar-gestionar-buques");
  if (btnCerrarGestionarBuques) btnCerrarGestionarBuques.onclick = function () { state.modalMolo = null; render(); };
  const overlayGestionarBuques = document.getElementById("overlay-gestionar-buques");
  if (overlayGestionarBuques) overlayGestionarBuques.onclick = function (e) { if (e.target === overlayGestionarBuques) { state.modalMolo = null; render(); } };
  const btnAgregarBuqueDesdeGestor = document.getElementById("btn-agregar-buque-desde-gestor");
  if (btnAgregarBuqueDesdeGestor) btnAgregarBuqueDesdeGestor.onclick = function () { state.buqueEditando = null; state.modalMolo = "buque"; render(); };
  document.querySelectorAll("[data-action='editar-buque-desde-gestor']").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-id");
      state.buqueEditando = state.buques.find(function (b) { return b.id === id; });
      state.modalMolo = "buque";
      render();
    };
  });
  document.querySelectorAll("[data-action='del-buque-desde-gestor']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      state.eliminarBuquePendienteId = el.getAttribute("data-id");
      state.modalMolo = "confirmarEliminarBuque";
      render();
    };
  });

  // Overlay genérico de confirmación (compartido con Personal/Delegación, ya bindeado
  // por bindEventsPersonal/bindEventsDelegacion, pero esos solo corren si su sección
  // está activa; aquí lo manejamos también para los casos propios de Molo).
  const overlayGenericoMolo = document.getElementById("overlay-confirmar-generico");
  if (overlayGenericoMolo) {
    overlayGenericoMolo.onclick = function (e) {
      if (e.target !== overlayGenericoMolo) return;
      if (state.modalMolo === "confirmarEliminarBuque") { state.modalMolo = null; state.eliminarBuquePendienteId = null; }
      if (state.modalMolo === "confirmarEliminarActividad") { state.modalMolo = null; state.eliminarActividadPendienteId = null; }
      render();
    };
  }
}

/* ============================================================
   PANTALLA DE BLOQUEO POR PIN
   ============================================================ */
function renderPantallaBloqueo() {
  const modo = state.pinModoCreacion; // null = ingresar PIN existente; 'elegirLongitud' | 'crear' | 'confirmar'
  if (modo === "elegirLongitud") return renderPantallaElegirLongitudPin();

  const longitudActual = state.pinTemp.length;
  const longitudObjetivo = state.pinLongitudObjetivo || 4;
  const dotsTotal = modo ? longitudObjetivo : Math.max(longitudActual, 4);
  const dots = [];
  for (let i = 0; i < dotsTotal; i++) {
    const lleno = i < longitudActual;
    dots.push('<div style="width:14px;height:14px;border-radius:50%;border:2px solid #D99A3D;background:' + (lleno ? "#D99A3D" : "transparent") + ';transition:background 0.1s"></div>');
  }
  const dotsHtml = dots.join("");

  let titulo, subtitulo;
  if (!modo) {
    titulo = "Ingresa tu PIN";
    subtitulo = "Este PIN es propio de este dispositivo.";
  } else if (modo === "crear") {
    titulo = "Crea tu PIN";
    subtitulo = "Ingresa " + longitudObjetivo + " dígitos.";
  } else {
    titulo = "Confirma tu PIN";
    subtitulo = "Ingresa el mismo PIN nuevamente.";
  }

  const numeros = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
  const tecladoHtml = numeros.map(function (n) {
    if (n === "") return '<div></div>';
    if (n === "⌫") {
      return '<button id="pin-borrar" style="background:transparent;border:none;color:#C9D2DA;font-size:20px;display:flex;align-items:center;justify-content:center;height:64px;cursor:pointer">⌫</button>';
    }
    return '<button class="pin-tecla mono" data-digito="' + n + '" style="background:#0E2235;border:1px solid #2A3F54;border-radius:12px;color:#E4EAEF;font-size:22px;font-weight:600;height:64px;cursor:pointer">' + n + '</button>';
  }).join("");

  return (
    '<div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;background:#0B1B2B">' +
      '<div style="margin-bottom:36px;text-align:center">' +
        '<div class="topbar-titulo cond" style="margin-bottom:6px">PLANIFICADOR DE OPERACIONES</div>' +
        '<div class="cond" style="font-size:16px;color:#E4EAEF;font-weight:600;margin-top:18px">' + titulo + '</div>' +
        '<div class="cond" style="font-size:12.5px;color:#8AA0B5;margin-top:4px">' + subtitulo + '</div>' +
      '</div>' +
      '<div style="display:flex;gap:10px;margin-bottom:14px">' + dotsHtml + '</div>' +
      (state.pinError ? '<div class="cond" style="color:#E0524A;font-size:12.5px;margin-bottom:14px;text-align:center">' + escapeHTML(state.pinError) + '</div>' : '<div style="height:14px;margin-bottom:14px"></div>') +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:280px">' + tecladoHtml + '</div>' +
      (modo ? '<button id="pin-cancelar-creacion" class="cond" style="margin-top:24px;background:transparent;border:none;color:#5C7184;font-size:12.5px;cursor:pointer">Cancelar</button>' : '') +
    '</div>'
  );
}

function renderPantallaElegirLongitudPin() {
  const opciones = [4, 5, 6];
  const botonesHtml = opciones.map(function (n) {
    return '<button class="pin-longitud-btn cond" data-longitud="' + n + '" style="padding:16px;border-radius:10px;border:1px solid #2A3F54;background:#0E2235;color:#E4EAEF;font-size:15px;font-weight:600;cursor:pointer">' + n + ' dígitos</button>';
  }).join("");
  return (

      '<div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px">' + botonesHtml + '</div>' +

}

function bindEventsBloqueo() {
  document.querySelectorAll(".pin-longitud-btn").forEach(function (btn) {
    btn.onclick = function () {
      state.pinLongitudObjetivo = Number(btn.getAttribute("data-longitud"));
      state.pinModoCreacion = "crear";
      state.pinTemp = "";
      render();
    };
  });
  document.querySelectorAll(".pin-tecla").forEach(function (btn) {
    btn.onclick = function () {
      if (state.pinTemp.length >= 6) return;
      state.pinTemp += btn.getAttribute("data-digito");
      state.pinError = "";
      procesarPinSiCompleto();
    };
  });
  const btnBorrar = document.getElementById("pin-borrar");
  if (btnBorrar) {
    btnBorrar.onclick = function () {
      state.pinTemp = state.pinTemp.slice(0, -1);
      state.pinError = "";
      render();
    };
  }
  const btnCancelarCreacion = document.getElementById("pin-cancelar-creacion");
  if (btnCancelarCreacion) {
    btnCancelarCreacion.onclick = function () {
      const habiaPinAntes = !!loadLocal(PIN_KEY, null);
      state.pinModoCreacion = null;
      state.pinTemp = "";
      state.pinPrimerIngreso = "";
      state.pinError = "";
      // Si ya existía un PIN guardado (estábamos cambiándolo), al cancelar volvemos
      // a pedir el PIN actual en vez de dejar la app abierta sin protección.
      state.pantallaBloqueada = habiaPinAntes;
      render();
    };
  }
}

function procesarPinSiCompleto() {
  const pin = state.pinTemp;
  const modo = state.pinModoCreacion;

  if (!modo) {
    // Modo ingreso: comparar contra el PIN guardado en cuanto la longitud coincida.
    const guardado = loadLocal(PIN_KEY, "");
    if (pin.length === guardado.length) {
      if (pin === guardado) {
        state.pinTemp = "";
        state.pinError = "";
        if (state.pinVerificandoParaCambiar) {
          // Verificación exitosa al intentar cambiar el PIN: pasamos directo a
          // crear uno nuevo, sin desbloquear la app de vuelta al calendario.
          state.pinVerificandoParaCambiar = false;
          iniciarCreacionPin();
        } else {
          state.pantallaBloqueada = false;
        }
      } else {
        state.pinError = "PIN incorrecto. Intenta nuevamente.";
        state.pinTemp = "";
      }
    }
  } else if (modo === "crear") {
    if (pin.length === state.pinLongitudObjetivo) {
      state.pinPrimerIngreso = pin;
      state.pinTemp = "";
      state.pinModoCreacion = "confirmar";
    }
  } else if (modo === "confirmar") {
    if (pin.length === state.pinPrimerIngreso.length) {
      if (pin === state.pinPrimerIngreso) {
        saveLocal(PIN_KEY, pin);
        state.pantallaBloqueada = false;
        state.pinModoCreacion = null;
        state.pinTemp = "";
        state.pinPrimerIngreso = "";
        state.pinError = "";
      } else {
        state.pinError = "Los PIN no coinciden. Intenta de nuevo.";
        state.pinTemp = "";
        state.pinModoCreacion = "crear";
        state.pinPrimerIngreso = "";
      }
    }
  }
  render();
}

// Inicia el flujo de crear/cambiar PIN desde el menú lateral.
function iniciarCreacionPin() {
  state.pinModoCreacion = "elegirLongitud";
  state.pinTemp = "";
  state.pinPrimerIngreso = "";
  state.pinError = "";
  state.pantallaBloqueada = true;
  state.drawerSeccionesAbierto = false;
  render();
}

function eliminarPin() {
  try { localStorage.removeItem(PIN_KEY); } catch (e) {}
  state.pantallaBloqueada = false;
  render();
}

function renderNavTemporal() {
  let label;

    const start = startOfWeek(state.cursor);
    const end = addDays(start, 6);
    const mismoMes = start.getMonth() === end.getMonth();
    label = mismoMes
      ? start.getDate() + " – " + end.getDate() + " " + MESES[start.getMonth()] + " " + start.getFullYear()
      : start.getDate() + " " + MESES_ABR[start.getMonth()] + " – " + end.getDate() + " " + MESES_ABR[end.getMonth()] + " " + end.getFullYear();

/* ============================================================
   RENDER — FILA DE EVENTO
   ============================================================ */
function renderFilaEvento(ev, vencido, fechaCelda) {
  const cat = catById(ev.categoria);
  const color = (cat && cat.color) || "#8AA0B5";
  const prio = prioById(ev.prioridad);
  const esMultiDia = ev.fechaFin && ev.fechaFin > ev.fecha;
  const fechaRef = fechaCelda || ev.fecha;
  const completadoAqui = estaCompletadoEnFecha(ev, fechaRef);
  let rangoLabel = "";
  if (esMultiDia) {
    const dIni = new Date(ev.fecha + "T00:00:00");
    const dFin = new Date(ev.fechaFin + "T00:00:00");
    rangoLabel = dIni.getDate() + " " + MESES_ABR[dIni.getMonth()] + " → " + dFin.getDate() + " " + MESES_ABR[dFin.getMonth()];
  }
  const horaTermino = ev.hora ? calcularHoraTermino(ev.hora, ev.duracion || 30) : "";
  const colorBanda = vencido ? "#E0524A" : color;
  const colorLetra = colorTextoLegible(colorBanda);
  const letraInicial = vencido ? "!" : inicialCategoria(cat);
  const fondoFila = completadoAqui ? "#070F18" : (vencido ? "rgba(224,82,74,0.06)" : "transparent");
  return (
    '<div class="fila-evento" data-action="editar-fila" data-id="' + ev.id + '" style="opacity:' + (completadoAqui ? "0.65" : "1") + ';background:' + fondoFila + ';cursor:pointer;padding:0;gap:0">' +
      '<div class="mono" style="align-self:stretch;width:26px;min-width:26px;background:' + colorBanda + ';color:' + colorLetra + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:6px 0 0 6px" title="' + escapeHTML((cat && cat.label) || "") + '">' + letraInicial + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;flex:1;min-width:0">' +
      '<button class="check" data-action="toggle" data-id="' + ev.id + '" data-fecha-celda="' + fechaRef + '" style="border-color:' + color + ';background:' + (completadoAqui ? color : "transparent") + ';display:flex;align-items:center;justify-content:center;color:#0B1B2B" title="Marcar">' + (completadoAqui ? icon("checkCircle", 11) : "") + '</button>' +
      '<div class="hora mono">' + (ev.hora || "—") + (horaTermino ? '<div style="font-size:9.5px;color:#5C7184;font-weight:500">' + horaTermino + '</div>' : "") + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="titulo cond' + (completadoAqui ? " done" : "") + '">' + escapeHTML(ev.titulo) + '</div>' +
        '<div class="meta-row">' +
          (completadoAqui ? '<span class="mono" style="font-size:10px;color:#5FE3A1;font-weight:700">' + icon("checkCircle", 9) + ' LISTA' + (esMultiDia ? " (este día)" : "") + '</span>' : "") +
          (vencido ? '<span class="meta-vencido mono">VENCIDO</span>' : "") +
          (esMultiDia ? '<span class="mono" style="font-size:10px;color:' + color + ';font-weight:600">' + icon("skip", 9) + ' ' + rangoLabel + '</span>' : "") +
          (ev.repetSerieId ? '<span class="mono" style="font-size:10px;color:#8AA0B5">↻</span>' : "") +
          (ev.interdepartamental ? '<span class="mono" style="font-size:10px;color:#D99A3D;font-weight:700">' + icon("megaphone", 10) + ' INTERDEPTO.</span>' : "") +
          (Array.isArray(ev.subtareas) && ev.subtareas.length ? '<span class="mono" style="font-size:10px;color:#8AA0B5">' + icon("list", 9) + ' ' + ev.subtareas.filter(function(s){return s.hecho;}).length + '/' + ev.subtareas.length + '</span>' : "") +
          (ev.responsable ? '<span class="meta-resp cond">' + icon("user", 10) + ' ' + escapeHTML(ev.responsable) + '</span>' : "") +
          (prio ? '<span class="meta-prio cond" style="color:' + prio.color + '">' + prio.label + '</span>' : "") +
        '</div>' +
      '</div>' +
      (vencido ? '<button class="btn-manana cond" data-action="hoy-boton" data-id="' + ev.id + '">' + icon("skip", 12) + ' Hoy</button>' : "") +
      '<div class="acciones">' +
        '<button class="iconbtn-sm" data-action="export" data-id="' + ev.id + '" title="Alarma (.ics)">' + icon("alert", 12) + '</button>' +
        '<button class="iconbtn-sm" data-action="eliminar" data-id="' + ev.id + '" title="Eliminar">' + icon("trash", 12) + '</button>' +
      '</div>' +
      '</div>' +
    '</div>'
  );
}

/* ============================================================
   RENDER — VISTA AGENDA (lista simple, próximos días con eventos)
   ============================================================ */
function renderVistaAgenda() {
  const hoy = new Date();
  const hoyISO = fmtISO(hoy);
  const porFecha = eventosPorFecha();

  // Próximos 30 días desde hoy, solo se muestran los que tienen al menos un evento.
  const fechasConEventos = [];
  for (let i = 0; i < 30; i++) {
    const iso = fmtISO(addDays(hoy, i));
    if (porFecha[iso] && porFecha[iso].length) fechasConEventos.push(iso);
  }

  if (!fechasConEventos.length) {
    return '<div class="cond" style="text-align:center;padding:40px 20px;color:#5C7184;font-style:italic">' +
      'No hay eventos próximos. Todo despejado por los próximos 30 días.' +
    '</div>';
  }

  let html = '<div style="display:flex;flex-direction:column;gap:14px">';
  fechasConEventos.forEach(function (iso) {
    const d = new Date(iso + "T00:00:00");
    const esHoy = iso === hoyISO;
    const esManana = iso === fmtISO(addDays(hoy, 1));
    const evs = porFecha[iso];
    const nombreFeriado = feriadoEnFecha(iso);
    const esFinde = esFinDeSemanaISO(iso);
    let etiqueta = DIAS_SEM_FULL[(d.getDay() + 6) % 7] + ", " + d.getDate() + " " + MESES[d.getMonth()].toLowerCase();
    if (esHoy) etiqueta = "HOY — " + etiqueta;
    else if (esManana) etiqueta = "MAÑANA — " + etiqueta;

    html +=
      '<div>' +
        '<div class="mono" style="font-size:11.5px;font-weight:700;color:' + (esHoy ? "#D99A3D" : "#8AA0B5") + ';letter-spacing:0.5px;margin-bottom:6px;padding-left:2px;display:flex;align-items:center;gap:8px">' +
          '<span>' + etiqueta.toUpperCase() + '</span>' +
          (nombreFeriado ? '<span style="font-size:9.5px;color:#C97FE0;border:1px solid #C97FE0;border-radius:4px;padding:1px 5px" title="' + escapeHTML(nombreFeriado) + '">FERIADO</span>' : (esFinde && !esHoy ? '<span style="font-size:9.5px;color:#5C7184">FIN DE SEMANA</span>' : "")) +
        '</div>' +
        '<div class="daycard' + (esHoy ? " today" : (!esHoy && (nombreFeriado || esFinde) ? " dia-especial" : "")) + '" style="border-top:3px solid ' + (esHoy ? "#D99A3D" : "#1E3247") + '">' +
          evs.map(function (ev) { return renderFilaEvento(ev, !estaCompletadoEnFecha(ev, iso) && iso < hoyISO, iso); }).join("") +
        '</div>' +
      '</div>';
  });
  html += '</div>';
  return html;
}

function renderVistaSemana() {
  const start = startOfWeek(state.cursor);
  const dias = [];
  for (let i = 0; i < 7; i++) dias.push(addDays(start, i));
  const hoy = new Date();
  const hoyISO = fmtISO(hoy);
  const porFecha = eventosPorFecha();

  // Acentos sutiles por día de la semana (LUN→DOM), distintos entre sí pero discretos.
  const ACENTOS_DIA = ["#6FA8D9", "#5FE3A1", "#D99A3D", "#C97FE0", "#7FB8C9", "#B8A06F", "#8A8FE0"];

  let html = "";
  dias.forEach(function (d, i) {
    const iso = fmtISO(d);
    const evs = porFecha[iso] || [];
    const esHoy = isSameDay(d, hoy);
    const acento = ACENTOS_DIA[i];
    const nombreFeriado = feriadoEnFecha(iso);
    const esFinde = esFinDeSemanaISO(iso);
    const claseAlt = (i % 2 === 1 && !esHoy) ? " alt" : "";
    const claseEspecial = (!esHoy && (nombreFeriado || esFinde)) ? " dia-especial" : "";
    const colapsado = !!state.diasColapsados[iso];
    html +=
      '<div class="daycard' + (esHoy ? " today" : claseAlt) + claseEspecial + '" style="' + (esHoy ? "" : "border-top-color:" + acento) + '">' +
        '<div class="daycard-head' + (evs.length && !colapsado ? "" : " empty") + '" data-action="toggle-dia-colapso" data-fecha="' + iso + '" style="cursor:pointer">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="color:#5C7184;display:flex;transition:transform 0.15s;transform:rotate(' + (colapsado ? "-90deg" : "0deg") + ')">' + icon("chevronDown", 14) + '</span>' +
            '<div class="mono" style="font-size:12px;font-weight:700;color:' + (esHoy ? "#D99A3D" : acento) + ';letter-spacing:1px">' + DIAS_SEM[i] + '</div>' +
            '<div class="cond" style="font-size:14px;color:#C9D2DA">' + d.getDate() + ' ' + MESES_ABR[d.getMonth()] + '</div>' +
            (esHoy ? '<span class="badge-hoy mono">HOY</span>' : "") +
            (nombreFeriado ? '<span class="mono" style="font-size:9.5px;color:#C97FE0;border:1px solid #C97FE0;border-radius:4px;padding:1px 5px" title="' + escapeHTML(nombreFeriado) + '">FERIADO</span>' : (esFinde ? '<span class="mono" style="font-size:9.5px;color:#5C7184">FIN DE SEMANA</span>' : "")) +
            (colapsado && evs.length ? '<span class="mono" style="font-size:11px;color:#5C7184">(' + evs.length + ')</span>' : "") +
          '</div>' +
          '<div style="display:flex;gap:6px">' +
            (evs.length > 0 ? '<button class="iconbtn" data-action="export-dia" data-fecha="' + iso + '" title="Exportar día">' + icon("download", 14) + '</button>' : "") +
            '<button class="iconbtn" data-action="nuevo-fecha" data-fecha="' + iso + '" title="Agregar evento">' + icon("plus", 14) + '</button>' +
          '</div>' +
        '</div>' +
        (colapsado
          ? ""
          : (evs.length === 0
              ? '<div class="empty-day cond">Sin novedades</div>'
              : evs.map(function (ev) { return renderFilaEvento(ev, !estaCompletadoEnFecha(ev, iso) && iso < hoyISO, iso); }).join("")
            )
        ) +
      '</div>';
  });
  return '<div>' + html + '</div>';
}

/* ============================================================
   RENDER — VISTA MES
   ============================================================ */
function renderVistaMes() {
  const first = startOfMonth(state.cursor);
  const startGrid = startOfWeek(first);
  const celdas = [];
  for (let i = 0; i < 42; i++) celdas.push(addDays(startGrid, i));
  const hoy = new Date();
  const mesActual = state.cursor.getMonth();
  const porFecha = eventosPorFecha();

  let dowHtml = DIAS_SEM.map(function (d) { return '<div class="dow-label mono">' + d + '</div>'; }).join("");

  let cellsHtml = celdas.map(function (d) {
    const iso = fmtISO(d);
    const evs = porFecha[iso] || [];
    const enMes = d.getMonth() === mesActual;
    const esHoy = isSameDay(d, hoy);
    const nombreFeriado = feriadoEnFecha(iso);
    const esFinde = esFinDeSemanaISO(iso);
    const claseEspecial = (!esHoy && (nombreFeriado || esFinde)) ? " dia-especial" : "";
    let evsHtml = evs.slice(0, 4).map(function (ev) {
      const cat = catById(ev.categoria);
      const color = (cat && cat.color) || "#8AA0B5";
      const letraInicial = inicialCategoria(cat);
      return '<div class="month-evt cond' + (estaCompletadoEnFecha(ev, iso) ? " done" : "") + '" style="background:' + color + '22;border-left-color:' + color + '">' +
        '<span class="mono" style="color:' + color + ';font-weight:700">' + letraInicial + '</span> ' +
        (ev.hora ? '<span class="mono" style="color:#D99A3D;font-weight:600">' + ev.hora + '</span> ' : "") + escapeHTML(ev.titulo) + '</div>';
    }).join("");
    if (evs.length > 4) evsHtml += '<div class="month-more">+' + (evs.length - 4) + ' más</div>';

    return (
      '<div class="month-cell' + (esHoy ? " today" : "") + (enMes ? "" : " outside") + claseEspecial + '" data-action="dia-click" data-fecha="' + iso + '" data-has-events="' + (evs.length ? "1" : "0") + '" title="' + (nombreFeriado ? escapeHTML(nombreFeriado) : "") + '">' +
        '<div class="month-cell-num mono' + (esHoy ? " today" : "") + '">' + d.getDate() + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0">' + evsHtml + '</div>' +
      '</div>'
    );
  }).join("");

  return (
    '<div id="month-dow-wrap" class="month-dow-sticky-wrap scrollbar">' +
      '<div class="month-dow">' + dowHtml + '</div>' +
    '</div>' +
    '<div id="month-grid-wrap" class="month-scroll scrollbar">' +

/* ---------- Fila de evento completado (con botón reactivar) ---------- */
function formatearTimestampCompletado(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const dias = ["DOM", "LUN", "MAR", "MIE", "JUE", "VIE", "SAB"];
  return dias[d.getDay()] + " " + pad(d.getDate()) + " " + MESES_ABR[d.getMonth()] + " " + d.getFullYear() + " · " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function renderFilaCompletada(ev) {
  const cat = catById(ev.categoria);
  const color = (cat && cat.color) || "#8AA0B5";
  const prio = prioById(ev.prioridad);
  const d = new Date(ev.fecha + "T00:00:00");
  const fechaLabel = d.getDate() + " " + MESES_ABR[d.getMonth()] + " " + d.getFullYear();
  const colorLetra = colorTextoLegible(color);
  const letraInicial = inicialCategoria(cat);

  // Registro de cuándo se marcó como completada. Para eventos multi-día con varios
  // días marcados, se listan todas las fechas con su respectivo momento de marcado.
  let marcadaHtml = "";
  if (esMultiDiaEvento(ev) && Array.isArray(ev.completadoFechas) && ev.completadoFechas.length) {
    const detalle = ev.completadoFechas.slice().sort().map(function (f) {
      const ts = obtenerTimestampCompletado(ev, f);
      const df = new Date(f + "T00:00:00");
      const labelDia = df.getDate() + " " + MESES_ABR[df.getMonth()];
      return labelDia + (ts ? " (marcada " + formatearTimestampCompletado(ts) + ")" : "");
    }).join(" · ");
    marcadaHtml = '<div class="mono" style="font-size:9.5px;color:#5C7184;margin-top:2px">' + icon("checkCircle", 9) + ' ' + detalle + '</div>';
  } else {
    const ts = obtenerTimestampCompletado(ev);
    if (ts) marcadaHtml = '<div class="mono" style="font-size:9.5px;color:#5C7184;margin-top:2px">' + icon("checkCircle", 9) + ' Marcada el ' + formatearTimestampCompletado(ts) + '</div>';
  }

  return (
    '<div class="fila-evento" style="opacity:0.7;padding:0;gap:0">' +
      '<div class="mono" style="align-self:stretch;width:26px;min-width:26px;background:' + color + ';color:' + colorLetra + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:6px 0 0 6px" title="' + escapeHTML((cat && cat.label) || "") + '">' + letraInicial + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;flex:1;min-width:0">' +
      '<button class="check" data-action="toggle" data-id="' + ev.id + '" style="border-color:' + color + ';background:' + color + '" title="Reactivar tarea"></button>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="titulo cond done">' + escapeHTML(ev.titulo) + '</div>' +
        '<div class="meta-row">' +
          '<span class="mono" style="font-size:10px;color:#5C7184">' + fechaLabel + (ev.hora ? " · " + ev.hora : "") + '</span>' +
          (ev.responsable ? '<span class="meta-resp cond">' + icon("user", 10) + ' ' + escapeHTML(ev.responsable) + '</span>' : "") +
          (prio ? '<span class="meta-prio cond" style="color:' + prio.color + '">' + prio.label + '</span>' : "") +
        '</div>' +
        marcadaHtml +
      '</div>' +
      '<button class="cond" data-action="toggle" data-id="' + ev.id + '" style="display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:6px;border:1px solid #5FE3A1;background:transparent;color:#5FE3A1;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0">Reactivar</button>' +
      '<div class="acciones" style="opacity:1">' +
        '<button class="iconbtn-sm" data-action="eliminar" data-id="' + ev.id + '" title="Eliminar">' + icon("trash", 12) + '</button>' +
      '</div>' +
      '</div>' +
    '</div>'
  );
}
