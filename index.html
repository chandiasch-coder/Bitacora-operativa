          '<input type="checkbox" data-action="filtro-resp-check" data-nombre="' + escapeHTML(r) + '"' + (checked ? " checked" : "") + ' />' +
          '<span class="cond">' + escapeHTML(r) + '</span>' +
        '</label>';
      }).join("");

  return (
    '<div class="overlay" id="overlay-panel-filtros">' +
      '<div class="modal" style="max-width:420px;align-self:flex-start;margin-top:60px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">FILTROS</div>' +
          '<button class="iconbtn" id="btn-cerrar-panel-filtros">' + icon("x", 16) + '</button>' +
        '</div>' +

        '<div class="campo">' +
          '<label class="campo-label mono">BUSCAR</label>' +
          '<div class="search-row">' +
            '<span style="color:#5C7184">' + icon("search", 15) + '</span>' +
            '<input class="field" id="campo-busqueda" placeholder="Título, lugar o notas…" value="' + escapeHTML(state.busqueda) + '" style="border:none;background:transparent;padding:6px 0" />' +
            (state.busqueda ? '<button id="btn-limpiar-busqueda" style="background:transparent;border:none;color:#8AA0B5;cursor:pointer;display:flex">' + icon("x", 14) + '</button>' : '') +
          '</div>' +
        '</div>' +

        '<div class="campo">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
            '<label class="campo-label mono" style="margin:0">CATEGORÍAS</label>' +
            '<div style="display:flex;gap:10px">' +
              '<button class="cond filtro-dropdown-link" data-action="filtro-cat-todas">Todas</button>' +
              '<button class="cond filtro-dropdown-link" data-action="filtro-cat-ninguna">Ninguna</button>' +
            '</div>' +
          '</div>' +
          '<div style="max-height:160px;overflow-y:auto;border:1px solid #1E3247;border-radius:8px;padding:6px" class="scrollbar">' + catItemsHtml + '</div>' +
        '</div>' +

        '<div class="campo">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
            '<label class="campo-label mono" style="margin:0">RESPONSABLES</label>' +
            '<div style="display:flex;gap:10px">' +
              '<button class="cond filtro-dropdown-link" data-action="filtro-resp-todos">Todos</button>' +
              '<button class="cond filtro-dropdown-link" data-action="filtro-resp-ninguno">Ninguno</button>' +
            '</div>' +
          '</div>' +
          '<div style="max-height:160px;overflow-y:auto;border:1px solid #1E3247;border-radius:8px;padding:6px" class="scrollbar">' + respItemsHtml + '</div>' +
        '</div>' +

        '<button class="pillbtn cond" id="btn-categorias" style="width:100%;justify-content:center;display:flex;align-items:center;gap:6px">' + icon("tag", 14) + ' Gestionar categorías y responsables</button>' +
      '</div>' +
    '</div>'
  );
}

/* ============================================================
   RENDER — NAV TEMPORAL
   ============================================================ */
function renderNavTemporal() {
  let label;
  if (state.vista === "semana") {
    const start = startOfWeek(state.cursor);
    const end = addDays(start, 6);
    const mismoMes = start.getMonth() === end.getMonth();
    label = mismoMes
      ? start.getDate() + " – " + end.getDate() + " " + MESES[start.getMonth()] + " " + start.getFullYear()
      : start.getDate() + " " + MESES_ABR[start.getMonth()] + " – " + end.getDate() + " " + MESES_ABR[end.getMonth()] + " " + end.getFullYear();
  } else {
    label = MESES[state.cursor.getMonth()] + " " + state.cursor.getFullYear();
  }
  return (
    '<div class="navtemporal">' +
      '<button class="navbtn" id="nav-prev" aria-label="Anterior">' + icon("chevronLeft", 18) + '</button>' +
      '<div style="display:flex;align-items:center;gap:12px">' +
        '<div class="navlabel mono">' + label + '</div>' +
        '<button class="hoybtn cond" id="nav-hoy">HOY</button>' +
      '</div>' +
      '<button class="navbtn" id="nav-next" aria-label="Siguiente">' + icon("chevronRight", 18) + '</button>' +
    '</div>'
  );
}

/* ============================================================
   RENDER — FILA DE EVENTO
   ============================================================ */
function renderFilaEvento(ev, vencido) {
  const cat = catById(ev.categoria);
  const color = (cat && cat.color) || "#8AA0B5";
  const prio = prioById(ev.prioridad);
  const esMultiDia = ev.fechaFin && ev.fechaFin > ev.fecha;
  let rangoLabel = "";
  if (esMultiDia) {
    const dIni = new Date(ev.fecha + "T00:00:00");
    const dFin = new Date(ev.fechaFin + "T00:00:00");
    rangoLabel = dIni.getDate() + " " + MESES_ABR[dIni.getMonth()] + " → " + dFin.getDate() + " " + MESES_ABR[dFin.getMonth()];
  }
  const horaTermino = ev.hora ? calcularHoraTermino(ev.hora, ev.duracion || 30) : "";
  const colorBanda = vencido ? "#E0524A" : color;
  const colorLetra = colorTextoLegible(colorBanda);
  const letraInicial = vencido ? "!" : inicialCategoria(cat);
  const fondoFila = ev.completado ? "#070F18" : (vencido ? "rgba(224,82,74,0.06)" : "transparent");
  return (
    '<div class="fila-evento" data-action="editar-fila" data-id="' + ev.id + '" style="opacity:' + (ev.completado ? "0.65" : "1") + ';background:' + fondoFila + ';cursor:pointer;padding:0;gap:0">' +
      '<div class="mono" style="align-self:stretch;width:26px;min-width:26px;background:' + colorBanda + ';color:' + colorLetra + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:6px 0 0 6px" title="' + escapeHTML((cat && cat.label) || "") + '">' + letraInicial + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;flex:1;min-width:0">' +
      '<button class="check" data-action="toggle" data-id="' + ev.id + '" style="border-color:' + color + ';background:' + (ev.completado ? color : "transparent") + ';display:flex;align-items:center;justify-content:center;color:#0B1B2B" title="Marcar">' + (ev.completado ? icon("checkCircle", 11) : "") + '</button>' +
      '<div class="hora mono">' + (ev.hora || "—") + (horaTermino ? '<div style="font-size:9.5px;color:#5C7184;font-weight:500">' + horaTermino + '</div>' : "") + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="titulo cond' + (ev.completado ? " done" : "") + '">' + escapeHTML(ev.titulo) + '</div>' +
        '<div class="meta-row">' +
          (ev.completado ? '<span class="mono" style="font-size:10px;color:#5FE3A1;font-weight:700">' + icon("checkCircle", 9) + ' LISTA</span>' : "") +
          (vencido ? '<span class="meta-vencido mono">VENCIDO</span>' : "") +
          (esMultiDia ? '<span class="mono" style="font-size:10px;color:' + color + ';font-weight:600">' + icon("skip", 9) + ' ' + rangoLabel + '</span>' : "") +
          (ev.repetSerieId ? '<span class="mono" style="font-size:10px;color:#8AA0B5">↻</span>' : "") +
          (Array.isArray(ev.subtareas) && ev.subtareas.length ? '<span class="mono" style="font-size:10px;color:#8AA0B5">' + icon("list", 9) + ' ' + ev.subtareas.filter(function(s){return s.hecho;}).length + '/' + ev.subtareas.length + '</span>' : "") +
          (ev.responsable ? '<span class="meta-resp cond">' + icon("user", 10) + ' ' + escapeHTML(ev.responsable) + '</span>' : "") +
          (prio ? '<span class="meta-prio cond" style="color:' + prio.color + '">' + prio.label + '</span>' : "") +
        '</div>' +
      '</div>' +
      (vencido ? '<button class="btn-manana cond" data-action="manana" data-id="' + ev.id + '">' + icon("skip", 12) + ' Mañana</button>' : "") +
      '<div class="acciones">' +
        '<button class="iconbtn-sm" data-action="export" data-id="' + ev.id + '" title="Alarma (.ics)">' + icon("alert", 12) + '</button>' +
        '<button class="iconbtn-sm" data-action="eliminar" data-id="' + ev.id + '" title="Eliminar">' + icon("trash", 12) + '</button>' +
      '</div>' +
      '</div>' +
    '</div>'
  );
}

/* ============================================================
   RENDER — VISTA AGENDA (lista simple, próximos días con eventos)
   ============================================================ */
function renderVistaAgenda() {
  const hoy = new Date();
  const hoyISO = fmtISO(hoy);
  const porFecha = eventosPorFecha();

  // Próximos 30 días desde hoy, solo se muestran los que tienen al menos un evento.
  const fechasConEventos = [];
  for (let i = 0; i < 30; i++) {
    const iso = fmtISO(addDays(hoy, i));
    if (porFecha[iso] && porFecha[iso].length) fechasConEventos.push(iso);
  }

  if (!fechasConEventos.length) {
    return '<div class="cond" style="text-align:center;padding:40px 20px;color:#5C7184;font-style:italic">' +
      'No hay eventos próximos. Todo despejado por los próximos 30 días.' +
    '</div>';
  }

  let html = '<div style="display:flex;flex-direction:column;gap:14px">';
  fechasConEventos.forEach(function (iso) {
    const d = new Date(iso + "T00:00:00");
    const esHoy = iso === hoyISO;
    const esManana = iso === fmtISO(addDays(hoy, 1));
    const evs = porFecha[iso];
    let etiqueta = DIAS_SEM_FULL[(d.getDay() + 6) % 7] + ", " + d.getDate() + " " + MESES[d.getMonth()].toLowerCase();
    if (esHoy) etiqueta = "HOY — " + etiqueta;
    else if (esManana) etiqueta = "MAÑANA — " + etiqueta;

    html +=
      '<div>' +
        '<div class="mono" style="font-size:11.5px;font-weight:700;color:' + (esHoy ? "#D99A3D" : "#8AA0B5") + ';letter-spacing:0.5px;margin-bottom:6px;padding-left:2px">' + etiqueta.toUpperCase() + '</div>' +
        '<div class="daycard' + (esHoy ? " today" : "") + '" style="border-top:3px solid ' + (esHoy ? "#D99A3D" : "#1E3247") + '">' +
          evs.map(function (ev) { return renderFilaEvento(ev, !ev.completado && ev.fecha < hoyISO); }).join("") +
        '</div>' +
      '</div>';
  });
  html += '</div>';
  return html;
}

function renderVistaSemana() {
  const start = startOfWeek(state.cursor);
  const dias = [];
  for (let i = 0; i < 7; i++) dias.push(addDays(start, i));
  const hoy = new Date();
  const hoyISO = fmtISO(hoy);
  const porFecha = eventosPorFecha();

  // Acentos sutiles por día de la semana (LUN→DOM), distintos entre sí pero discretos.
  const ACENTOS_DIA = ["#6FA8D9", "#5FE3A1", "#D99A3D", "#C97FE0", "#7FB8C9", "#B8A06F", "#8A8FE0"];

  let html = "";
  dias.forEach(function (d, i) {
    const iso = fmtISO(d);
    const evs = porFecha[iso] || [];
    const esHoy = isSameDay(d, hoy);
    const acento = ACENTOS_DIA[i];
    const claseAlt = (i % 2 === 1 && !esHoy) ? " alt" : "";
    const colapsado = !!state.diasColapsados[iso];
    html +=
      '<div class="daycard' + (esHoy ? " today" : claseAlt) + '" style="' + (esHoy ? "" : "border-top-color:" + acento) + '">' +
        '<div class="daycard-head' + (evs.length && !colapsado ? "" : " empty") + '" data-action="toggle-dia-colapso" data-fecha="' + iso + '" style="cursor:pointer">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="color:#5C7184;display:flex;transition:transform 0.15s;transform:rotate(' + (colapsado ? "-90deg" : "0deg") + ')">' + icon("chevronDown", 14) + '</span>' +
            '<div class="mono" style="font-size:12px;font-weight:700;color:' + (esHoy ? "#D99A3D" : acento) + ';letter-spacing:1px">' + DIAS_SEM[i] + '</div>' +
            '<div class="cond" style="font-size:14px;color:#C9D2DA">' + d.getDate() + ' ' + MESES_ABR[d.getMonth()] + '</div>' +
            (esHoy ? '<span class="badge-hoy mono">HOY</span>' : "") +
            (colapsado && evs.length ? '<span class="mono" style="font-size:11px;color:#5C7184">(' + evs.length + ')</span>' : "") +
          '</div>' +
          '<div style="display:flex;gap:6px">' +
            (evs.length > 0 ? '<button class="iconbtn" data-action="export-dia" data-fecha="' + iso + '" title="Exportar día">' + icon("download", 14) + '</button>' : "") +
            '<button class="iconbtn" data-action="nuevo-fecha" data-fecha="' + iso + '" title="Agregar evento">' + icon("plus", 14) + '</button>' +
          '</div>' +
        '</div>' +
        (colapsado
          ? ""
          : (evs.length === 0
              ? '<div class="empty-day cond">Sin novedades</div>'
              : evs.map(function (ev) { return renderFilaEvento(ev, !ev.completado && ev.fecha < hoyISO); }).join("")
            )
        ) +
      '</div>';
  });
  return '<div>' + html + '</div>';
}

/* ============================================================
   RENDER — VISTA MES
   ============================================================ */
function renderVistaMes() {
  const first = startOfMonth(state.cursor);
  const startGrid = startOfWeek(first);
  const celdas = [];
  for (let i = 0; i < 42; i++) celdas.push(addDays(startGrid, i));
  const hoy = new Date();
  const mesActual = state.cursor.getMonth();
  const porFecha = eventosPorFecha();

  let dowHtml = DIAS_SEM.map(function (d) { return '<div class="dow-label mono">' + d + '</div>'; }).join("");

  let cellsHtml = celdas.map(function (d) {
    const iso = fmtISO(d);
    const evs = porFecha[iso] || [];
    const enMes = d.getMonth() === mesActual;
    const esHoy = isSameDay(d, hoy);
    let evsHtml = evs.slice(0, 4).map(function (ev) {
      const cat = catById(ev.categoria);
      const color = (cat && cat.color) || "#8AA0B5";
      const letraInicial = inicialCategoria(cat);
      return '<div class="month-evt cond' + (ev.completado ? " done" : "") + '" style="background:' + color + '22;border-left-color:' + color + '">' +
        '<span class="mono" style="color:' + color + ';font-weight:700">' + letraInicial + '</span> ' +
        (ev.hora ? '<span class="mono" style="color:#D99A3D;font-weight:600">' + ev.hora + '</span> ' : "") + escapeHTML(ev.titulo) + '</div>';
    }).join("");
    if (evs.length > 4) evsHtml += '<div class="month-more">+' + (evs.length - 4) + ' más</div>';

    return (
      '<div class="month-cell' + (esHoy ? " today" : "") + (enMes ? "" : " outside") + '" data-action="dia-click" data-fecha="' + iso + '" data-has-events="' + (evs.length ? "1" : "0") + '">' +
        '<div class="month-cell-num mono' + (esHoy ? " today" : "") + '">' + d.getDate() + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0">' + evsHtml + '</div>' +
      '</div>'
    );
  }).join("");

  return (
    '<div id="month-dow-wrap" class="month-dow-sticky-wrap scrollbar">' +
      '<div class="month-dow">' + dowHtml + '</div>' +
    '</div>' +
    '<div id="month-grid-wrap" class="month-scroll scrollbar">' +
      '<div class="month-grid">' + cellsHtml + '</div>' +
    '</div>' +
    '<div class="cond" style="text-align:center;font-size:11px;color:#5C7184;margin-top:8px">← Desliza horizontalmente para ver toda la semana →</div>'
  );
}

function renderSubtareasTempHtml() {
  const items = state.subtareasTemp || [];
  if (!items.length) {
    return '<div class="cond" style="font-size:12px;color:#5C7184;font-style:italic">Sin sub-tareas.</div>';
  }
  return items.map(function (st) {
    return '<div style="display:flex;align-items:center;gap:8px">' +
      '<button data-subtarea-toggle="' + st.id + '" style="width:16px;height:16px;min-width:16px;border-radius:4px;border:1.5px solid #5FE3A1;background:' + (st.hecho ? "#5FE3A1" : "transparent") + ';cursor:pointer;padding:0"></button>' +
      '<span class="cond" style="flex:1;font-size:13px;color:#C9D2DA;' + (st.hecho ? "text-decoration:line-through;opacity:0.6" : "") + '">' + escapeHTML(st.texto) + '</span>' +
      '<button data-subtarea-quitar="' + st.id + '" style="background:transparent;border:none;color:#8AA0B5;cursor:pointer;display:flex">' + icon("x", 13) + '</button>' +
    '</div>';
  }).join("");
}

function renderModalEvento() {
  const ev = state.eventoEditando;
  const fecha = (ev && ev.fecha) || state.fechaSeleccionada;
  const fechaFin = (ev && ev.fechaFin) || fecha;
  const hora = (ev && ev.hora) || "08:00";
  const duracionTotal = (ev && ev.duracion) || 30;
  const durHoras = Math.floor(duracionTotal / 60);
  const durMinutos = duracionTotal % 60;
  const categoria = (ev && ev.categoria) || (state.categorias[0] || {}).id || "";
  const responsable = (ev && ev.responsable) || "";
  const responsableEsLibre = responsable && state.responsables.indexOf(responsable) === -1;
  const prioridad = (ev && ev.prioridad) || "media";
  const lugar = (ev && ev.lugar) || "";
  const notas = (ev && ev.notas) || "";
  const titulo = (ev && ev.titulo) || "";
  const repetir = (ev && ev.repetir) || "nunca";
  if (!Array.isArray(state.subtareasTemp)) state.subtareasTemp = [];

  const catOptions = state.categorias.map(function (c) {
    return '<option value="' + c.id + '"' + (categoria === c.id ? " selected" : "") + '>' + escapeHTML(c.label) + '</option>';
  }).join("");

  const respOptions = state.responsables.map(function (r) {
    return '<option value="' + escapeHTML(r) + '"' + (responsable === r ? " selected" : "") + '>' + escapeHTML(r) + '</option>';
  }).join("");

  const prioButtons = PRIORIDADES.map(function (p) {
    const active = prioridad === p.id;
    return '<button class="prio-btn cond" data-prio="' + p.id + '" style="border:1.5px solid ' + p.color + ';background:' + (active ? p.color : "transparent") + ';color:' + (active ? "#0B1B2B" : p.color) + '">' + p.label + '</button>';
  }).join("");

  const horasOptions = [];
  for (let h = 0; h <= 12; h++) {
    horasOptions.push('<option value="' + h + '"' + (durHoras === h ? " selected" : "") + '>' + h + '</option>');
  }
  const minutosOptions = [0, 15, 30, 45].map(function (m) {
    return '<option value="' + m + '"' + (durMinutos === m ? " selected" : "") + '>' + pad(m) + '</option>';
  }).join("");

  const REPETICION_OPTS = [
    { id: "nunca", label: "No se repite" },
    { id: "diaria", label: "Diaria" },
    { id: "semanal", label: "Semanal" },
    { id: "mensual", label: "Mensual" },
  ];
  const repetOptions = REPETICION_OPTS.map(function (r) {
    return '<option value="' + r.id + '"' + (repetir === r.id ? " selected" : "") + '>' + r.label + '</option>';
  }).join("");

  return (
    '<div class="overlay" id="overlay-evento">' +
      '<div class="modal">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">' + (ev ? "EDITAR EVENTO" : "NUEVO EVENTO") + '</div>' +
          '<button class="iconbtn" data-action="cerrar-modal">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">TÍTULO</label>' +
          '<input class="field" id="ev-titulo" value="' + escapeHTML(titulo) + '" placeholder="Ej: Reunión de coordinación CIC" /></div>' +
        '<div class="row-gap">' +
          '<div class="campo" style="flex:1"><label class="campo-label mono">FECHA INICIO</label><input class="field" type="date" id="ev-fecha" value="' + fecha + '" /></div>' +
          '<div class="campo" style="flex:1"><label class="campo-label mono">FECHA TÉRMINO</label><input class="field" type="date" id="ev-fecha-fin" value="' + fechaFin + '" min="' + fecha + '" /></div>' +
        '</div>' +
        '<div class="row-gap">' +
          '<div class="campo" style="flex:1"><label class="campo-label mono">HORA INICIO</label><input class="field" type="time" id="ev-hora" value="' + hora + '" />' +
            '<div class="mono" id="ev-hora-termino" style="font-size:10.5px;color:#8AA0B5;margin-top:4px">Término: ' + calcularHoraTermino(hora, duracionTotal) + '</div>' +
          '</div>' +
          '<div class="campo" style="width:78px"><label class="campo-label mono">HORAS</label><select class="field" id="ev-dur-horas">' + horasOptions.join("") + '</select></div>' +
          '<div class="campo" style="width:78px"><label class="campo-label mono">MINUTOS</label><select class="field" id="ev-dur-minutos">' + minutosOptions + '</select></div>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">REPETICIÓN</label><select class="field" id="ev-repetir">' + repetOptions + '</select></div>' +
        '<div class="campo"><label class="campo-label mono">CATEGORÍA</label><select class="field" id="ev-categoria">' + catOptions + '</select></div>' +
        '<div class="campo"><label class="campo-label mono">RESPONSABLE</label>' +
          '<div id="resp-wrap">' +
          (responsableEsLibre
            ? '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="' + escapeHTML(responsable) + '" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>'
            : '<select class="field" id="ev-responsable"><option value="">— Sin asignar —</option>' + respOptions + '<option value="__libre__">✎ Escribir otro nombre…</option></select>'
          ) +
          '</div>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">PRIORIDAD</label><div class="prio-row" id="prio-row">' + prioButtons + '</div></div>' +
        '<div class="campo"><label class="campo-label mono">LUGAR (OPCIONAL)</label><input class="field" id="ev-lugar" value="' + escapeHTML(lugar) + '" placeholder="Ej: Puente, CIC, Cámara de oficiales" /></div>' +
        '<div class="campo">' +
          '<label class="campo-label mono">SUB-TAREAS (OPCIONAL)</label>' +
          '<div id="subtareas-lista" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">' + renderSubtareasTempHtml() + '</div>' +
          '<div style="display:flex;gap:6px">' +
            '<input class="field" id="nueva-subtarea" placeholder="Ej: Verificar combustible…" style="flex:1" />' +
            '<button class="cond" id="btn-add-subtarea" style="padding:0 14px;border-radius:7px;border:none;background:#5FE3A1;color:#0B1B2B;font-weight:700;cursor:pointer">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="campo"><label class="campo-label mono">NOTAS (OPCIONAL)</label><textarea class="field" id="ev-notas" rows="3">' + escapeHTML(notas) + '</textarea></div>' +
        '<div id="ev-error"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel cond" data-action="cerrar-modal">Cancelar</button>' +
          '<button class="btn-guardar cond" id="btn-guardar-evento">Guardar evento</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function renderModalCategorias() {
  const catRows = state.categorias.map(function (c) {
    return '<div style="display:flex;align-items:center;gap:8px">' +
      '<div style="width:14px;height:14px;border-radius:3px;background:' + c.color + ';flex-shrink:0"></div>' +
      '<div class="cond" style="flex:1;font-size:13.5px;color:#E4EAEF">' + escapeHTML(c.label) + '</div>' +
      '<button class="iconbtn-sm" data-action="del-categoria" data-id="' + c.id + '" title="Eliminar">' + icon("trash", 13) + '</button>' +
    '</div>';
  }).join('<div style="height:6px"></div>');

  const respChips = state.responsables.map(function (r) {
    return '<div class="chip cond">' + escapeHTML(r) + '<button data-action="del-responsable" data-nombre="' + escapeHTML(r) + '">' + icon("x", 12) + '</button></div>';
  }).join("");

  // Resumen de carga: pendientes (no completados, sin importar fecha) por responsable.
  const pendientesPorResp = {};
  state.eventos.filter(function (e) { return !e.completado; }).forEach(function (e) {
    const r = e.responsable || "— Sin asignar —";
    pendientesPorResp[r] = (pendientesPorResp[r] || 0) + 1;
  });
  const cargaOrdenada = Object.keys(pendientesPorResp).sort(function (a, b) { return pendientesPorResp[b] - pendientesPorResp[a]; });
  const maxCarga = cargaOrdenada.length ? pendientesPorResp[cargaOrdenada[0]] : 1;
  const cargaHtml = cargaOrdenada.length === 0
    ? '<div class="cond" style="font-size:12px;color:#5C7184;font-style:italic">Sin tareas pendientes asignadas.</div>'
    : cargaOrdenada.map(function (r) {
        const n = pendientesPorResp[r];
        const pct = Math.round((n / maxCarga) * 100);
        const colorBarra = n >= 5 ? "#E0524A" : n >= 3 ? "#D99A3D" : "#5FE3A1";
        return '<div style="margin-bottom:8px">' +
          '<div class="cond" style="display:flex;justify-content:space-between;font-size:12.5px;color:#C9D2DA;margin-bottom:3px">' +
            '<span>' + escapeHTML(r) + '</span><span class="mono" style="color:' + colorBarra + ';font-weight:700">' + n + '</span>' +
          '</div>' +
          '<div style="height:5px;background:#0B1B2B;border-radius:3px;overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:' + colorBarra + '"></div>' +
          '</div>' +
        '</div>';
      }).join("");

  return (
    '<div class="overlay" id="overlay-categorias">' +
      '<div class="modal wide">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">CATEGORÍAS Y RESPONSABLES</div>' +
          '<button class="iconbtn" data-action="cerrar-modal">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="mono" style="font-size:10.5px;color:#8AA0B5;letter-spacing:0.5px;margin-bottom:8px">' + icon("users", 11) + ' CARGA POR RESPONSABLE (PENDIENTES)</div>' +
        '<div style="margin-bottom:18px;padding:12px;background:#0B1B2B;border:1px solid #1E3247;border-radius:8px">' + cargaHtml + '</div>' +
        '<div class="mono" style="font-size:10.5px;color:#8AA0B5;letter-spacing:0.5px;margin-bottom:6px">CATEGORÍAS</div>' +
        '<div style="display:flex;flex-direction:column;margin-bottom:14px">' + catRows + '</div>' +
        '<div style="display:flex;gap:6px;margin-bottom:20px">' +

  const prio = prioById(ev.prioridad);
  const d = new Date(ev.fecha + "T00:00:00");
  const fechaLabel = d.getDate() + " " + MESES_ABR[d.getMonth()] + " " + d.getFullYear();
  const colorLetra = colorTextoLegible(color);
  const letraInicial = inicialCategoria(cat);
  return (
    '<div class="fila-evento" style="opacity:0.7;padding:0;gap:0">' +
      '<div class="mono" style="align-self:stretch;width:26px;min-width:26px;background:' + color + ';color:' + colorLetra + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:6px 0 0 6px" title="' + escapeHTML((cat && cat.label) || "") + '">' + letraInicial + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;flex:1;min-width:0">' +
      '<button class="check" data-action="toggle" data-id="' + ev.id + '" style="border-color:' + color + ';background:' + color + '" title="Reactivar tarea"></button>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="titulo cond done">' + escapeHTML(ev.titulo) + '</div>' +
        '<div class="meta-row">' +
          '<span class="mono" style="font-size:10px;color:#5C7184">' + fechaLabel + (ev.hora ? " · " + ev.hora : "") + '</span>' +
          (ev.responsable ? '<span class="meta-resp cond">' + icon("user", 10) + ' ' + escapeHTML(ev.responsable) + '</span>' : "") +
          (prio ? '<span class="meta-prio cond" style="color:' + prio.color + '">' + prio.label + '</span>' : "") +
        '</div>' +
      '</div>' +
      '<button class="cond" data-action="toggle" data-id="' + ev.id + '" style="display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:6px;border:1px solid #5FE3A1;background:transparent;color:#5FE3A1;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0">Reactivar</button>' +

function render() {
  let html;
  if (state.seccion === "personal") {
    html = renderTopbar() + renderSeccionPersonal();
  } else if (state.seccion === "delegacion") {
    html = renderTopbar() + renderSeccionDelegacion();
  } else if (state.seccion === "molo") {
    html = renderTopbar() + renderSeccionMolo();
  } else {
    const fab = state.eventos.length > 0
      ? '<button class="fab cond" id="btn-export-todo">' + icon("download", 15) + ' Exportar todo (.ics)</button>'
      : "";

    let modalHtml = "";
    if (state.modal === "evento") modalHtml = renderModalEvento();
    else if (state.modal === "categorias") modalHtml = renderModalCategorias();
    else if (state.modal === "detalleDia") modalHtml = renderModalDetalleDia();
    else if (state.modal === "completadas") modalHtml = renderModalCompletadas();
    else if (state.modal === "diagnostico") modalHtml = renderModalDiagnostico();

    const confirmHtml = state.eliminarPendienteId ? renderModalConfirmarEliminar() : "";

    html =
      renderTopbar() +
      renderControles() +
      (state.vista === "agenda" ? "" : renderNavTemporal()) +
      '<div class="view-area">' + (state.vista === "agenda" ? renderVistaAgenda() : state.vista === "semana" ? renderVistaSemana() : renderVistaMes()) + '</div>' +
      renderPieDePagina() +
      fab +
      modalHtml +
      confirmHtml;
  }

  document.getElementById("app").innerHTML = html;
  bindEvents();
}

/* ============================================================
   EVENTOS DE INTERFAZ (delegación simple por re-render)
   ============================================================ */
function bindEvents() {
  const app = document.getElementById("app");

  // Menú hamburguesa: abre/cierra el drawer lateral de secciones.
  const btnAbrirDrawer = document.getElementById("btn-abrir-drawer");
  if (btnAbrirDrawer) btnAbrirDrawer.onclick = function () { state.drawerSeccionesAbierto = true; render(); };
  const btnCerrarDrawer = document.getElementById("btn-cerrar-drawer");
  if (btnCerrarDrawer) btnCerrarDrawer.onclick = function () { state.drawerSeccionesAbierto = false; render(); };
  const drawerOverlay = document.getElementById("drawer-overlay");
  if (drawerOverlay) drawerOverlay.onclick = function (e) { if (e.target === drawerOverlay) { state.drawerSeccionesAbierto = false; render(); } };
  ["calendario", "personal", "delegacion", "molo"].forEach(function (sec) {
    const btn = document.getElementById("drawer-sec-" + sec);
    if (btn) btn.onclick = function () { state.seccion = sec; state.drawerSeccionesAbierto = false; render(); };
  });

  // El contador de pendientes/vencidos y su botón viven en la topbar, visible en
  // cualquier sección, así que se bindea aquí (antes del return temprano por sección).
  const btnMoverTodosGlobal = document.getElementById("btn-mover-todos");
  if (btnMoverTodosGlobal) btnMoverTodosGlobal.onclick = moverTodosVencidos;

  // Si no estamos en la sección calendario, el resto de bindings de esa sección no aplica.
  if (state.seccion !== "calendario") {
    bindEventsPersonal();
    bindEventsDelegacion();
    bindEventsMolo();
    return;
  }

  // Sincronizar scroll horizontal entre el header de días (sticky) y el grid de celdas (vista mes)
  const dowWrap = document.getElementById("month-dow-wrap");
  const gridWrap = document.getElementById("month-grid-wrap");
  if (dowWrap && gridWrap) {
    let sincronizando = false;
    dowWrap.onscroll = function () {
      if (sincronizando) return;
      sincronizando = true;
      gridWrap.scrollLeft = dowWrap.scrollLeft;
      sincronizando = false;
    };
    gridWrap.onscroll = function () {
      if (sincronizando) return;
      sincronizando = true;
      dowWrap.scrollLeft = gridWrap.scrollLeft;
      sincronizando = false;
    };
  }

  // Tabs
  const tabAgenda = document.getElementById("tab-agenda");
  const tabSemana = document.getElementById("tab-semana");
  const tabMes = document.getElementById("tab-mes");
  if (tabAgenda) tabAgenda.onclick = function () { state.vista = "agenda"; render(); };
  if (tabSemana) tabSemana.onclick = function () { state.vista = "semana"; render(); };
  if (tabMes) tabMes.onclick = function () { state.vista = "mes"; render(); };

  // Panel de filtros agrupado (buscador, categorías, responsables, ocultar completadas)
  const btnAbrirPanelFiltros = document.getElementById("btn-abrir-panel-filtros");
  if (btnAbrirPanelFiltros) btnAbrirPanelFiltros.onclick = function () { state.panelFiltrosAbierto = true; render(); };
  const btnCerrarPanelFiltros = document.getElementById("btn-cerrar-panel-filtros");
  if (btnCerrarPanelFiltros) btnCerrarPanelFiltros.onclick = function () { state.panelFiltrosAbierto = false; render(); };
  const overlayPanelFiltros = document.getElementById("overlay-panel-filtros");
  if (overlayPanelFiltros) overlayPanelFiltros.onclick = function (e) { if (e.target === overlayPanelFiltros) { state.panelFiltrosAbierto = false; render(); } };

  document.querySelectorAll("[data-action='filtro-cat-check']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const id = el.getAttribute("data-id");
      const idx = state.filtroCategorias.indexOf(id);
      if (idx === -1) state.filtroCategorias.push(id); else state.filtroCategorias.splice(idx, 1);
      render();
    };
  });
  document.querySelectorAll("[data-action='filtro-resp-check']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const nombre = el.getAttribute("data-nombre");
      const idx = state.filtroResponsables.indexOf(nombre);
      if (idx === -1) state.filtroResponsables.push(nombre); else state.filtroResponsables.splice(idx, 1);
      render();
    };
  });
  document.querySelectorAll("[data-action='filtro-cat-todas']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroCategorias = []; render(); };
  });
  document.querySelectorAll("[data-action='filtro-cat-ninguna']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroCategorias = state.categorias.map(function (c) { return c.id; }); render(); };
  });
  document.querySelectorAll("[data-action='filtro-resp-todos']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroResponsables = []; render(); };
  });
  document.querySelectorAll("[data-action='filtro-resp-ninguno']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const responsablesConDatos = Array.from(new Set(
        state.responsables.concat(state.eventos.map(function (ev) { return ev.responsable; }).filter(Boolean))
      ));
      state.filtroResponsables = responsablesConDatos;
      render();
    };
  });

  const btnToggleOcultarCal = document.getElementById("btn-toggle-ocultar-completadas-cal");
  if (btnToggleOcultarCal) btnToggleOcultarCal.onclick = function () { state.ocultarCompletadasCalendario = !state.ocultarCompletadasCalendario; render(); };

  const campoBusqueda = document.getElementById("campo-busqueda");
  if (campoBusqueda) {
    campoBusqueda.oninput = function (e) {
      state.busqueda = e.target.value;
      render();
      // Restaurar foco y posición del cursor tras el re-render (el input se reconstruye en el DOM).
      const nuevoInput = document.getElementById("campo-busqueda");
      if (nuevoInput) {
        nuevoInput.focus();
        const pos = nuevoInput.value.length;
        if (nuevoInput.setSelectionRange) nuevoInput.setSelectionRange(pos, pos);
      }
    };
  }
  const btnLimpiarBusqueda = document.getElementById("btn-limpiar-busqueda");
  if (btnLimpiarBusqueda) btnLimpiarBusqueda.onclick = function () { state.busqueda = ""; render(); };

  // Botones top
  const btnCategorias = document.getElementById("btn-categorias");
  if (btnCategorias) btnCategorias.onclick = function () { state.modal = "categorias"; state.panelFiltrosAbierto = false; render(); };
  const btnCompletadas = document.getElementById("btn-completadas");
  if (btnCompletadas) btnCompletadas.onclick = function () { state.modal = "completadas"; render(); };
  const btnDiagnostico = document.getElementById("btn-diagnostico");
  if (btnDiagnostico) btnDiagnostico.onclick = function () { state.modal = "diagnostico"; render(); };
  const btnNuevoEvento = document.getElementById("btn-nuevo-evento");
  if (btnNuevoEvento) btnNuevoEvento.onclick = function () { abrirNuevo(fmtISO(new Date())); };

  // Nav temporal
  const navPrev = document.getElementById("nav-prev");
  const navNext = document.getElementById("nav-next");
  const navHoy = document.getElementById("nav-hoy");
  if (navPrev) navPrev.onclick = function () {
    state.cursor = state.vista === "semana" ? addDays(state.cursor, -7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1);
    render();
  };
  if (navNext) navNext.onclick = function () {
    state.cursor = state.vista === "semana" ? addDays(state.cursor, 7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1);
    render();
  };
  if (navHoy) navHoy.onclick = function () { state.cursor = new Date(); render(); };

  // FAB exportar todo
  const btnExportTodo = document.getElementById("btn-export-todo");
  if (btnExportTodo) btnExportTodo.onclick = function () { downloadICSBatch(eventosVisibles(), "bitacora_completa"); };

  // Delegación de acciones por data-action dentro de #app
  app.querySelectorAll("[data-action]").forEach(function (el) {
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");
    const fecha = el.getAttribute("data-fecha");

    if (action === "toggle") el.onclick = function (e) { e.stopPropagation(); toggleEstado(id); };
    else if (action === "manana") el.onclick = function (e) { e.stopPropagation(); moverASiguienteDia(id); };
    else if (action === "export") el.onclick = function (e) {
      e.stopPropagation();
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) downloadICS(ev);
    };
    else if (action === "editar") el.onclick = function () {
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) abrirEditar(ev);
    };
    else if (action === "editar-fila") el.onclick = function () {
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) abrirEditar(ev);
    };
    else if (action === "eliminar") el.onclick = function (e) { e.stopPropagation(); pedirConfirmacionEliminar(id); };
    else if (action === "export-dia") el.onclick = function (e) {
      e.stopPropagation();
      const evs = eventosPorFecha()[fecha] || [];
      downloadICSBatch(evs, "dia_" + fecha);
    };
    else if (action === "nuevo-fecha") el.onclick = function (e) { e.stopPropagation(); abrirNuevo(fecha); };
    else if (action === "toggle-dia-colapso") el.onclick = function () {
      state.diasColapsados[fecha] = !state.diasColapsados[fecha];
      render();
    };
    else if (action === "dia-click") el.onclick = function () {
      const hasEvents = el.getAttribute("data-has-events") === "1";
      if (hasEvents) { state.diaDetalle = fecha; state.modal = "detalleDia"; render(); }
      else abrirNuevo(fecha);
    };
    else if (action === "cerrar-modal") el.onclick = cerrarModal;
    else if (action === "del-categoria") el.onclick = function (e) { e.stopPropagation(); eliminarCategoria(id); };
    else if (action === "del-responsable") el.onclick = function (e) { e.stopPropagation(); eliminarResponsable(el.getAttribute("data-nombre")); };
  });

  // Cerrar overlay al tocar el fondo (no el modal)
  ["overlay-evento", "overlay-categorias", "overlay-detalle-dia", "overlay-completadas", "overlay-diagnostico"].forEach(function (oid) {
    const overlay = document.getElementById(oid);
    if (overlay) {
      overlay.onclick = function (e) { if (e.target === overlay) cerrarModal(); };
    }
  });

  // Modal de confirmación de eliminación (capa independiente, puede estar sobre otro modal)
  const overlayConfirmar = document.getElementById("overlay-confirmar-eliminar");
  if (overlayConfirmar) {
    overlayConfirmar.onclick = function (e) { if (e.target === overlayConfirmar) cancelarConfirmacionEliminar(); };
  }
  const btnCancelarEliminar = document.getElementById("btn-cancelar-eliminar");
  if (btnCancelarEliminar) btnCancelarEliminar.onclick = cancelarConfirmacionEliminar;
  const btnCancelarEliminar2 = document.getElementById("btn-cancelar-eliminar-2");
  if (btnCancelarEliminar2) btnCancelarEliminar2.onclick = cancelarConfirmacionEliminar;
  const btnConfirmarEliminar = document.getElementById("btn-confirmar-eliminar");
  if (btnConfirmarEliminar) btnConfirmarEliminar.onclick = confirmarEliminar;

  /* ---------- Modal evento: lógica específica ---------- */
  if (state.modal === "evento") {
    const fechaInicioInput = document.getElementById("ev-fecha");
    const fechaFinInput = document.getElementById("ev-fecha-fin");
    if (fechaInicioInput && fechaFinInput) {
      fechaInicioInput.onchange = function () {
        fechaFinInput.min = fechaInicioInput.value;
        if (fechaFinInput.value < fechaInicioInput.value) fechaFinInput.value = fechaInicioInput.value;
      };
    }

    // Recalcular y mostrar la hora de término en vivo al cambiar hora inicio o duración
    const horaInput = document.getElementById("ev-hora");
    const horasSel = document.getElementById("ev-dur-horas");
    const minutosSel = document.getElementById("ev-dur-minutos");
    const terminoLabel = document.getElementById("ev-hora-termino");
    function actualizarHoraTermino() {
      if (!horaInput || !horasSel || !minutosSel || !terminoLabel) return;
      const durMin = (Number(horasSel.value) || 0) * 60 + (Number(minutosSel.value) || 0);
      terminoLabel.textContent = "Término: " + calcularHoraTermino(horaInput.value, durMin);
    }
    if (horaInput) horaInput.onchange = actualizarHoraTermino;
    if (horasSel) horasSel.onchange = actualizarHoraTermino;
    if (minutosSel) minutosSel.onchange = actualizarHoraTermino;

    // Subtareas: agregar, togglear, quitar (manteniendo el resto del formulario
    // intacto, re-renderizando solo lo necesario para no perder lo escrito).
    function refrescarFormularioTrasSubtarea() {
      // Antes de re-renderizar, capturamos el valor actual de los campos del
      // formulario para no perderlos al reconstruir el HTML del modal.
      const snapshot = {
        titulo: (document.getElementById("ev-titulo") || {}).value,
        fecha: (document.getElementById("ev-fecha") || {}).value,
        fechaFin: (document.getElementById("ev-fecha-fin") || {}).value,
        hora: (document.getElementById("ev-hora") || {}).value,
        lugar: (document.getElementById("ev-lugar") || {}).value,
        notas: (document.getElementById("ev-notas") || {}).value,
      };
      render();
      const ti = document.getElementById("ev-titulo"); if (ti && snapshot.titulo !== undefined) ti.value = snapshot.titulo;
      const fi = document.getElementById("ev-fecha"); if (fi && snapshot.fecha) fi.value = snapshot.fecha;
      const ff = document.getElementById("ev-fecha-fin"); if (ff && snapshot.fechaFin) ff.value = snapshot.fechaFin;
      const hi = document.getElementById("ev-hora"); if (hi && snapshot.hora) hi.value = snapshot.hora;
      const lu = document.getElementById("ev-lugar"); if (lu && snapshot.lugar !== undefined) lu.value = snapshot.lugar;
      const no = document.getElementById("ev-notas"); if (no && snapshot.notas !== undefined) no.value = snapshot.notas;
    }

    const btnAddSubtarea = document.getElementById("btn-add-subtarea");
    const nuevaSubtareaInput = document.getElementById("nueva-subtarea");
    function agregarSubtareaTemp() {
      const texto = nuevaSubtareaInput ? nuevaSubtareaInput.value.trim() : "";
      if (!texto) return;
      state.subtareasTemp.push({ id: uid(), texto: texto, hecho: false });
      refrescarFormularioTrasSubtarea();
      const ns = document.getElementById("nueva-subtarea");
      if (ns) ns.focus();
    }
    if (btnAddSubtarea) btnAddSubtarea.onclick = agregarSubtareaTemp;
    if (nuevaSubtareaInput) {
      nuevaSubtareaInput.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); agregarSubtareaTemp(); } };
    }
    document.querySelectorAll("[data-subtarea-toggle]").forEach(function (btn) {
      btn.onclick = function () {
        const id = btn.getAttribute("data-subtarea-toggle");
        state.subtareasTemp = state.subtareasTemp.map(function (st) {
          return st.id === id ? Object.assign({}, st, { hecho: !st.hecho }) : st;
        });
        refrescarFormularioTrasSubtarea();
      };
    });
    document.querySelectorAll("[data-subtarea-quitar]").forEach(function (btn) {
      btn.onclick = function () {
        const id = btn.getAttribute("data-subtarea-quitar");
        state.subtareasTemp = state.subtareasTemp.filter(function (st) { return st.id !== id; });
        refrescarFormularioTrasSubtarea();
      };
    });

    const respSel = document.getElementById("ev-responsable");
    if (respSel) {
      respSel.onchange = function (e) {
        if (e.target.value === "__libre__") {
          // re-render forzando modo libre: simulamos guardando un responsable temporal vacío marcado
          const tempEv = Object.assign({}, state.eventoEditando || {}, { responsable: " " });
          // truco simple: usamos un dataset para forzar modo libre
          document.getElementById("resp-wrap").innerHTML =
            '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
          document.getElementById("btn-resp-volver").onclick = function () {
            document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
            bindRespSelect();
          };
        }
      };
    }
    const btnRespVolver = document.getElementById("btn-resp-volver");
    if (btnRespVolver) {
      btnRespVolver.onclick = function () {
        document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
        bindRespSelect();
      };
    }

    // Botones de prioridad (sin re-render completo, solo toggle visual + estado en dataset)
    const prioRow = document.getElementById("prio-row");
    if (prioRow) {
      let prioridadActual = (state.eventoEditando && state.eventoEditando.prioridad) || "media";
      prioRow.querySelectorAll(".prio-btn").forEach(function (btn) {
        btn.onclick = function () {
          prioridadActual = btn.getAttribute("data-prio");
          prioRow.querySelectorAll(".prio-btn").forEach(function (b2) {
            const pid = b2.getAttribute("data-prio");
            const p = prioById(pid);
            const active = pid === prioridadActual;
            b2.style.background = active ? p.color : "transparent";
            b2.style.color = active ? "#0B1B2B" : p.color;
          });
          prioRow.dataset.value = prioridadActual;
        };
      });
      prioRow.dataset.value = prioridadActual;
    }

    const btnGuardar = document.getElementById("btn-guardar-evento");
    if (btnGuardar) {
      btnGuardar.onclick = function () {
        const titulo = document.getElementById("ev-titulo").value;
        const fecha = document.getElementById("ev-fecha").value;
        let fechaFin = document.getElementById("ev-fecha-fin").value || fecha;
        const hora = document.getElementById("ev-hora").value;
        const durHoras = Number(document.getElementById("ev-dur-horas").value) || 0;
        const durMinutos = Number(document.getElementById("ev-dur-minutos").value) || 0;
        const duracion = durHoras * 60 + durMinutos;
        const repetir = document.getElementById("ev-repetir").value;
        const categoria = document.getElementById("ev-categoria").value;
        const respLibre = document.getElementById("ev-responsable-libre");
        const respSelect = document.getElementById("ev-responsable");
        const responsable = respLibre ? respLibre.value : (respSelect ? respSelect.value : "");
        const lugar = document.getElementById("ev-lugar").value;
        const notas = document.getElementById("ev-notas").value;
        const prioridad = (document.getElementById("prio-row") || {}).dataset
          ? document.getElementById("prio-row").dataset.value
          : "media";

        const errorBox = document.getElementById("ev-error");
        if (!titulo.trim()) { errorBox.innerHTML = '<div class="error-text cond">El título es obligatorio.</div>'; return; }
        if (!fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha es obligatoria.</div>'; return; }
        if (fechaFin < fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha de término no puede ser anterior a la fecha de inicio.</div>'; return; }
        if (duracion <= 0) { errorBox.innerHTML = '<div class="error-text cond">La duración debe ser mayor a 0.</div>'; return; }

        guardarEvento({
          titulo: titulo.trim(), fecha: fecha, fechaFin: fechaFin, hora: hora, duracion: duracion,
          repetir: repetir, categoria: categoria, responsable: (responsable || "").trim(), prioridad: prioridad || "media",
          lugar: lugar.trim(), notas: notas.trim(), subtareas: state.subtareasTemp.slice(),
          completado: (state.eventoEditando && state.eventoEditando.completado) || false,
        });
      };
    }
  }

  /* ---------- Modal categorías: lógica específica ---------- */
  if (state.modal === "categorias") {
    const btnAddCat = document.getElementById("btn-add-categoria");
    if (btnAddCat) {
      btnAddCat.onclick = function () {
        const nombre = document.getElementById("nueva-cat-nombre").value;
        const color = document.getElementById("nueva-cat-color").value;
        agregarCategoria(nombre, color);
      };
    }
    const nuevaCatInput = document.getElementById("nueva-cat-nombre");
    if (nuevaCatInput) {
      nuevaCatInput.onkeydown = function (e) {
        if (e.key === "Enter") {
          const color = document.getElementById("nueva-cat-color").value;
          agregarCategoria(nuevaCatInput.value, color);
        }
      };
    }
    const btnAddResp = document.getElementById("btn-add-responsable");
    if (btnAddResp) {
      btnAddResp.onclick = function () {
        const nombre = document.getElementById("nuevo-resp-nombre").value;
        agregarResponsable(nombre);
      };
    }
    const nuevoRespInput = document.getElementById("nuevo-resp-nombre");
    if (nuevoRespInput) {
      nuevoRespInput.onkeydown = function (e) {
        if (e.key === "Enter") agregarResponsable(nuevoRespInput.value);
      };
    }
  }

  /* ---------- Modal detalle día ---------- */
  if (state.modal === "detalleDia") {
    const btnAgregarDia = document.getElementById("btn-agregar-dia");
    if (btnAgregarDia) {
      btnAgregarDia.onclick = function () {
        const fecha = state.diaDetalle;
        state.modal = null;
        abrirNuevo(fecha);
      };
    }
  }

  /* ---------- Modal diagnóstico (modo sin internet) ---------- */
  if (state.modal === "diagnostico") {
    const btnReintentar = document.getElementById("btn-reintentar-cache");
    if (btnReintentar) {
      btnReintentar.onclick = function () {
        btnReintentar.textContent = "Guardando…";
        if (!("serviceWorker" in navigator) || !("caches" in window)) {
          window.swEstado.error = "Este navegador no soporta caché offline.";
          render();
          return;
        }
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
          window.swEstado.registrado = true;
          return reg.update();
        }).then(function () {
          return caches.open("bitacora-operativa-v1");
        }).then(function (cache) {
          return Promise.all([
            cache.add(window.location.href),
            cache.add(new URL("./index.html", window.location.href).href),
            cache.add(new URL("./manifest.json", window.location.href).href),
            cache.add(new URL("./sw.js", window.location.href).href),
          ]);
        }).then(function () {
          window.swEstado.cacheado = true;
          window.swEstado.error = null;
          render();
        }).catch(function (err) {
          window.swEstado.error = "Error al reintentar: " + err.message;
          render();
        });
      };
    }

    const btnExportar = document.getElementById("btn-exportar-respaldo");
    if (btnExportar) {
      btnExportar.onclick = function () {
        // Construido dinámicamente desde CAMPOS_PERSISTENTES: cualquier dato nuevo
        // que se agregue ahí queda incluido aquí automáticamente, sin tocar este código.
        const respaldo = {
          tipo: "respaldo-bitacora-operativa",
          version: 2,
          fechaExportacion: new Date().toISOString(),
        };
        CAMPOS_PERSISTENTES.forEach(function (c) { respaldo[c.campo] = state[c.campo]; });

        const blob = new Blob([JSON.stringify(respaldo, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const hoyStr = fmtISO(new Date());
        a.download = "respaldo_bitacora_" + hoyStr + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        const msg = document.getElementById("respaldo-mensaje");
        if (msg) { msg.style.color = "#5FE3A1"; msg.textContent = "✅ Respaldo descargado (" + CAMPOS_PERSISTENTES.length + " conjuntos de datos)."; }
      };
    }

    const inputArchivo = document.getElementById("input-archivo-respaldo");
    const btnImportar = document.getElementById("btn-importar-respaldo");
    if (btnImportar && inputArchivo) {
      btnImportar.onclick = function () { inputArchivo.click(); };
      inputArchivo.onchange = function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const msg = document.getElementById("respaldo-mensaje");
          try {
            const data = JSON.parse(ev.target.result);
            if (!data || !Array.isArray(data.eventos)) {
              throw new Error("El archivo no tiene el formato esperado.");
            }
            // Restaura cada campo presente en el archivo, también de forma dinámica.
            // Los eventos siempre se restauran (incluso vacíos); el resto solo si
            // el archivo trae algo, para no borrar datos nuevos con un respaldo viejo
            // que no los conocía todavía.
            const detalle = [];
            CAMPOS_PERSISTENTES.forEach(function (c) {
              if (c.campo === "eventos") {
                state.eventos = data.eventos;
                detalle.push(data.eventos.length + " eventos");
                return;
              }
              if (Array.isArray(data[c.campo]) && data[c.campo].length) {
                state[c.campo] = data[c.campo];
                detalle.push(data[c.campo].length + " " + c.campo);
              }
            });
            persist();
            if (msg) { msg.style.color = "#5FE3A1"; msg.textContent = "✅ Respaldo restaurado: " + detalle.join(", ") + "."; }
            render();
          } catch (err) {
            if (msg) { msg.style.color = "#E0524A"; msg.textContent = "❌ No se pudo leer el archivo: " + err.message; }
            render();
          }
        };
        reader.readAsText(file);
      };
    }
  }
}

function renderRespSelectOnly(selected) {
  const respOptions = state.responsables.map(function (r) {
    return '<option value="' + escapeHTML(r) + '"' + (selected === r ? " selected" : "") + '>' + escapeHTML(r) + '</option>';
  }).join("");
  return '<select class="field" id="ev-responsable"><option value="">— Sin asignar —</option>' + respOptions + '<option value="__libre__">✎ Escribir otro nombre…</option></select>';
}
function bindRespSelect() {
  const respSel = document.getElementById("ev-responsable");
  if (respSel) {
    respSel.onchange = function (e) {
      if (e.target.value === "__libre__") {
        document.getElementById("resp-wrap").innerHTML =
          '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
        document.getElementById("btn-resp-volver").onclick = function () {
          document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
          bindRespSelect();
        };
      }
    };
  }
}

/* ---------- Reloj en vivo (actualiza solo el texto, sin re-render completo) ---------- */
setInterval(function () {
  const clockEl = document.getElementById("dtg-clock");
  if (clockEl) clockEl.textContent = fmtDTG(new Date());
}, 30000);

/* ---------- Arranque ---------- */
render();

/* ---------- Service Worker real para funcionamiento sin internet ----------
   Registrado desde un archivo sw.js propio (no Blob), que es el método
   estándar y confiable, incluyendo en Safari/iOS 16.4+.
   La ruta es relativa para funcionar correctamente bajo la subcarpeta
   de GitHub Pages (https://usuario.github.io/nombre-repo/).
   Se registra inmediatamente (sin esperar "load") y se expone su estado
   en window.swEstado para poder verificarlo desde la propia interfaz. */
window.swEstado = { soportado: false, registrado: false, cacheado: false, error: null };

if ("serviceWorker" in navigator) {
  window.swEstado.soportado = true;
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
    window.swEstado.registrado = true;
    // Forzar el cacheo explícito de la página actual completa (URL absoluta),
    // como refuerzo adicional al cache.addAll() que ya hace sw.js en su evento "install".
    if ("caches" in window) {
      caches.open("bitacora-operativa-v1").then(function (cache) {
        return Promise.all([
          cache.add(window.location.href),
          cache.add(new URL("./index.html", window.location.href).href),
          cache.add(new URL("./manifest.json", window.location.href).href),
        ]);
      }).then(function () {
        window.swEstado.cacheado = true;
      }).catch(function (err) {
        window.swEstado.error = "Error al cachear: " + err.message;
      });
    }
  }).catch(function (err) {
    window.swEstado.error = "Error al registrar: " + err.message;
  });
} else {
  window.swEstado.error = "Este navegador no soporta Service Workers.";
}
</script>
</body>
