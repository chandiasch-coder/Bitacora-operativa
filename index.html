    { label: "Service Worker soportado por este navegador", ok: sw.soportado },
    { label: "Service Worker registrado correctamente", ok: sw.registrado },
    { label: "Página guardada en caché para uso sin internet", ok: sw.cacheado },
  ];
  const filasHtml = filas.map(function (f) {
    const icono = f.ok ? "✅" : "❌";
    const color = f.ok ? "#5FE3A1" : "#E0524A";
    return '<div class="cond" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1E3247">' +
      '<span style="font-size:16px">' + icono + '</span>' +
      '<span style="font-size:13.5px;color:' + (f.ok ? "#C9D2DA" : color) + '">' + f.label + '</span>' +
    '</div>';
  }).join("");

  const errorHtml = sw.error
    ? '<div class="cond" style="margin-top:12px;padding:10px;border-radius:7px;background:rgba(224,82,74,0.1);border:1px solid #E0524A;color:#E0524A;font-size:12.5px">' + escapeHTML(sw.error) + '</div>'
    : '';

  const todoOk = sw.soportado && sw.registrado && sw.cacheado;
  const resumenHtml = todoOk
    ? '<div class="cond" style="margin-top:12px;padding:10px;border-radius:7px;background:rgba(95,227,161,0.1);border:1px solid #5FE3A1;color:#5FE3A1;font-size:13px;text-align:center;font-weight:600">✅ Listo — la app debería funcionar sin internet</div>'
    : '<div class="cond" style="margin-top:12px;padding:10px;border-radius:7px;background:rgba(217,154,61,0.1);border:1px solid #D99A3D;color:#D99A3D;font-size:13px;text-align:center;font-weight:600">⚠ Aún no está lista para modo sin internet</div>';

  return (
    '<div class="overlay" id="overlay-diagnostico">' +
      '<div class="modal" style="max-width:380px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">MODO SIN INTERNET</div>' +
          '<button class="iconbtn" data-action="cerrar-modal">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div>' + filasHtml + '</div>' +
        errorHtml +
        resumenHtml +
        '<button class="cond" id="btn-reintentar-cache" style="margin-top:14px;width:100%;padding:10px;border-radius:7px;border:1px solid #2A3F54;background:transparent;color:#C9D2DA;font-size:13px;cursor:pointer">Reintentar guardado en caché</button>' +
        '<div class="cond" style="margin-top:10px;font-size:11px;color:#5C7184;line-height:1.5">Si el primer recuadro está en rojo (❌), abre esta página con internet activo, espera a que el segundo y tercer recuadro se pongan en verde, y luego vuelve a intentar sin conexión.</div>' +
        '<div style="margin-top:20px;padding-top:16px;border-top:1px solid #1E3247">' +
          '<div class="mono" style="font-size:10.5px;color:#8AA0B5;letter-spacing:0.5px;margin-bottom:10px">RESPALDO DE DATOS</div>' +
          '<div class="cond" style="font-size:11.5px;color:#8AA0B5;line-height:1.5;margin-bottom:10px">Guarda una copia de todo: eventos, categorías, responsables, Personal (personas y hechos), y Molo (buques y actividades). Útil antes de borrar caché del navegador o cambiar de teléfono.</div>' +
          '<div style="display:flex;gap:8px">' +
            '<button class="cond" id="btn-exportar-respaldo" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:7px;border:1px solid #5FE3A1;background:transparent;color:#5FE3A1;font-size:12.5px;font-weight:600;cursor:pointer">' + icon("download2", 14) + ' Compartir respaldo</button>' +
            '<button class="cond" id="btn-importar-respaldo" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:7px;border:1px solid #D99A3D;background:transparent;color:#D99A3D;font-size:12.5px;font-weight:600;cursor:pointer">' + icon("upload", 14) + ' Restaurar respaldo</button>' +
          '</div>' +
          '<input type="file" id="input-archivo-respaldo" accept="application/json" style="display:none" />' +
          '<div id="respaldo-mensaje" class="cond" style="margin-top:8px;font-size:12px"></div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}


function renderModalEleccionSerie() {
  const eleccion = state.eleccionSerie;
  const ev = eleccion ? state.eventos.find(function (e) { return e.id === eleccion.eventoId; }) : null;
  const verbo = eleccion && eleccion.accion === "toggle"
    ? (ev && ev.completado ? "reactivar" : "marcar como lista")
    : "editar";
  return (
    '<div class="overlay" id="overlay-eleccion-serie">' +
      '<div class="modal" style="max-width:380px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono">EVENTO REPETIDO ↻</div>' +
          '<button class="iconbtn" id="btn-cancelar-eleccion-serie">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="cond" style="font-size:14px;color:#C9D2DA;line-height:1.5;margin-bottom:18px">' +
          'Este evento forma parte de una serie que se repite. ¿Quieres ' + verbo + ' solo esta ocurrencia, o toda la serie?' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          '<button class="cond" id="btn-eleccion-ocurrencia" style="width:100%;padding:11px;border-radius:7px;border:1px solid #2A3F54;background:transparent;color:#C9D2DA;font-weight:600;font-size:13.5px;cursor:pointer">Solo esta ocurrencia</button>' +
          '<button class="cond" id="btn-eleccion-toda-serie" style="width:100%;padding:11px;border-radius:7px;border:none;background:#D99A3D;color:#0B1B2B;font-weight:700;font-size:13.5px;cursor:pointer">Toda la serie</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function renderModalConfirmarEliminar() {
  const ev = state.eventos.find(function (e) { return e.id === state.eliminarPendienteId; });
  const titulo = ev ? ev.titulo : "este evento";
  return (
    '<div class="overlay" id="overlay-confirmar-eliminar">' +
      '<div class="modal" style="max-width:360px">' +
        '<div class="modal-head">' +
          '<div class="modal-title mono" style="color:#E0524A">CONFIRMAR ELIMINACIÓN</div>' +
          '<button class="iconbtn" id="btn-cancelar-eliminar">' + icon("x", 16) + '</button>' +
        '</div>' +
        '<div class="cond" style="font-size:14px;color:#C9D2DA;line-height:1.5;margin-bottom:18px">' +
          '¿Seguro que quieres eliminar <strong style="color:#E4EAEF">' + escapeHTML(titulo) + '</strong>? Esta acción no se puede deshacer.' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel cond" id="btn-cancelar-eliminar-2">Cancelar</button>' +
          '<button class="cond" id="btn-confirmar-eliminar" style="flex:1.4;padding:10px;border-radius:7px;border:none;background:#E0524A;color:#0B1B2B;font-weight:700;font-size:13.5px;cursor:pointer">Eliminar</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
let ultimaNavGuardada = { seccion: state.seccion, vista: state.vista };
saveLocal(ULTIMA_NAV_KEY, ultimaNavGuardada); // asegura que la clave exista desde el primer arranque
function guardarUltimaNavegacionSiCambio() {
  if (ultimaNavGuardada.seccion !== state.seccion || ultimaNavGuardada.vista !== state.vista) {
    ultimaNavGuardada = { seccion: state.seccion, vista: state.vista };
    saveLocal(ULTIMA_NAV_KEY, ultimaNavGuardada);
  }
}

function render() {
  if (state.pantallaBloqueada) {
    document.getElementById("app").innerHTML = renderPantallaBloqueo();
    bindEventsBloqueo();
    return;
  }
  guardarUltimaNavegacionSiCambio();
  let html;
  if (state.seccion === "personal") {
    html = renderTopbar() + '<div style="padding-bottom:max(80px, calc(70px + env(safe-area-inset-bottom)))">' + renderSeccionPersonal() + '</div>' + renderBarraMenuSolo();
  } else if (state.seccion === "delegacion") {
    html = renderTopbar() + '<div style="padding-bottom:max(80px, calc(70px + env(safe-area-inset-bottom)))">' + renderSeccionDelegacion() + '</div>' + renderBarraMenuSolo();
  } else if (state.seccion === "molo") {
    html = renderTopbar() + '<div style="padding-bottom:max(80px, calc(70px + env(safe-area-inset-bottom)))">' + renderSeccionMolo() + '</div>' + renderBarraMenuSolo();
  } else {
    let modalHtml = "";
    if (state.modal === "evento") modalHtml = renderModalEvento();
    else if (state.modal === "categorias") modalHtml = renderModalCategorias();
    else if (state.modal === "detalleDia") modalHtml = renderModalDetalleDia();
    else if (state.modal === "completadas") modalHtml = renderModalCompletadas();

    const confirmHtml = state.eliminarPendienteId ? renderModalConfirmarEliminar() : "";

    html =
      renderTopbar() +
      renderControles() +
      (state.vista === "agenda" ? "" : renderNavTemporal()) +
      '<div class="view-area" style="padding:10px 18px max(110px, calc(100px + env(safe-area-inset-bottom)))">' + (state.vista === "agenda" ? renderVistaAgenda() : state.vista === "semana" ? renderVistaSemana() : renderVistaMes()) + '</div>' +
      renderBarraAccionesFija() +
      modalHtml +
      confirmHtml;
  }

  // El modal de diagnóstico (botón "Offline") vive en el drawer lateral, accesible
  // desde cualquier sección, así que se agrega siempre al final, fuera del switch.
  if (state.modal === "diagnostico") html += renderModalDiagnostico();
  if (state.eleccionSerie) html += renderModalEleccionSerie();

  document.getElementById("app").innerHTML = html;
  bindEvents();
}

/* ============================================================
   EVENTOS DE INTERFAZ (delegación simple por re-render)
   ============================================================ */
function bindEvents() {
  const app = document.getElementById("app");

  // Menú hamburguesa: abre/cierra el drawer lateral de secciones.
  const btnAbrirDrawer = document.getElementById("btn-abrir-drawer");
  if (btnAbrirDrawer) btnAbrirDrawer.onclick = function () { state.drawerSeccionesAbierto = true; render(); };
  const btnCerrarDrawer = document.getElementById("btn-cerrar-drawer");
  if (btnCerrarDrawer) btnCerrarDrawer.onclick = function () { state.drawerSeccionesAbierto = false; render(); };
  const drawerOverlay = document.getElementById("drawer-overlay");
  if (drawerOverlay) drawerOverlay.onclick = function (e) { if (e.target === drawerOverlay) { state.drawerSeccionesAbierto = false; render(); } };
  ["calendario", "personal", "delegacion", "molo"].forEach(function (sec) {
    const btn = document.getElementById("drawer-sec-" + sec);
    if (btn) btn.onclick = function () { state.seccion = sec; state.drawerSeccionesAbierto = false; render(); };
  });

  // El contador de pendientes/vencidos y su botón viven en la topbar, visible en
  // cualquier sección, así que se bindea aquí (antes del return temprano por sección).
  const btnMoverTodosGlobal = document.getElementById("btn-mover-todos");
  if (btnMoverTodosGlobal) btnMoverTodosGlobal.onclick = moverTodosVencidos;

  // Botón "Offline" vive dentro del drawer; al abrir su modal, cerramos el drawer
  // primero para que no quede un panel detrás de otro.
  const btnDiagnosticoGlobal = document.getElementById("btn-diagnostico");
  if (btnDiagnosticoGlobal) {
    btnDiagnosticoGlobal.onclick = function () {
      state.drawerSeccionesAbierto = false;
      state.modal = "diagnostico";
      render();
    };
  }

  const btnDeshacerGlobal = document.getElementById("btn-deshacer");
  if (btnDeshacerGlobal && puedeDeshacer()) {
    btnDeshacerGlobal.onclick = function () {
      state.drawerSeccionesAbierto = false;
      deshacerUltimoCambio();
    };
  }

  const btnCambiarPinGlobal = document.getElementById("btn-cambiar-pin");
  if (btnCambiarPinGlobal) {
    btnCambiarPinGlobal.onclick = function () {
      const yaExistePin = !!loadLocal(PIN_KEY, null);
      state.drawerSeccionesAbierto = false;
      if (yaExistePin) {
        // Pide verificar el PIN actual antes de permitir cambiarlo; al verificarse
        // correctamente, en vez de solo desbloquear, pasa directo a crear uno nuevo.
        state.pinVerificandoParaCambiar = true;
        state.pantallaBloqueada = true;
        state.pinModoCreacion = null;
        state.pinTemp = "";
        state.pinError = "";
        render();
      } else {
        iniciarCreacionPin();
      }
    };
  }

  const btnExportTodoGlobal = document.getElementById("btn-export-todo");
  if (btnExportTodoGlobal) {
    btnExportTodoGlobal.onclick = function () {
      state.drawerSeccionesAbierto = false;
      downloadICSBatch(eventosVisibles(), "bitacora_completa");
      render();
    };
  }

  // Modal de elección "esta ocurrencia / toda la serie" — global, ya que el
  // calendario es la única sección donde puede dispararse, pero lo dejamos
  // accesible sin importar el switch de secciones por consistencia.
  if (state.eleccionSerie) {
    const btnCancelarEleccion = document.getElementById("btn-cancelar-eleccion-serie");
    if (btnCancelarEleccion) btnCancelarEleccion.onclick = cancelarEleccionSerie;
    const overlayEleccion = document.getElementById("overlay-eleccion-serie");
    if (overlayEleccion) overlayEleccion.onclick = function (e) { if (e.target === overlayEleccion) cancelarEleccionSerie(); };
    const btnOcurrencia = document.getElementById("btn-eleccion-ocurrencia");
    if (btnOcurrencia) btnOcurrencia.onclick = function () { resolverEleccionSerie("ocurrencia"); };
    const btnTodaSerie = document.getElementById("btn-eleccion-toda-serie");
    if (btnTodaSerie) btnTodaSerie.onclick = function () { resolverEleccionSerie("serie"); };
  }

  /* ---------- Modal diagnóstico (modo sin internet) ---------- */
  if (state.modal === "diagnostico") {
    const btnReintentar = document.getElementById("btn-reintentar-cache");
    if (btnReintentar) {
      btnReintentar.onclick = function () {
        btnReintentar.textContent = "Guardando…";
        if (!("serviceWorker" in navigator) || !("caches" in window)) {
          window.swEstado.error = "Este navegador no soporta caché offline.";
          render();
          return;
        }
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
          window.swEstado.registrado = true;
          return reg.update();
        }).then(function () {
          return caches.open("bitacora-operativa-v1");
        }).then(function (cache) {
          return Promise.all([
            cache.add(window.location.href),
            cache.add(new URL("./index.html", window.location.href).href),
            cache.add(new URL("./manifest.json", window.location.href).href),
            cache.add(new URL("./sw.js", window.location.href).href),
          ]);
        }).then(function () {
          window.swEstado.cacheado = true;
          window.swEstado.error = null;
          render();
        }).catch(function (err) {
          window.swEstado.error = "Error al reintentar: " + err.message;
          render();
        });
      };
    }

    const btnExportar = document.getElementById("btn-exportar-respaldo");
    if (btnExportar) {
      btnExportar.onclick = function () {
        // Construido dinámicamente desde CAMPOS_PERSISTENTES: cualquier dato nuevo
        // que se agregue ahí queda incluido aquí automáticamente, sin tocar este código.
        const respaldo = {
          tipo: "respaldo-bitacora-operativa",
          version: 2,
          fechaExportacion: new Date().toISOString(),
        };
        CAMPOS_PERSISTENTES.forEach(function (c) { respaldo[c.campo] = state[c.campo]; });

        const hoyStr = fmtISO(new Date());
        const nombreArchivo = "respaldo_bitacora_" + hoyStr + ".json";
        const contenido = JSON.stringify(respaldo, null, 2);
        const blob = new Blob([contenido], { type: "application/json" });
        const msg = document.getElementById("respaldo-mensaje");

        // Preferir la hoja nativa de compartir de iOS (incluye AirDrop directo)
        // cuando el navegador la soporta con archivos adjuntos. Si no está disponible
        // (Safari en Mac, navegadores de escritorio, versiones viejas de iOS), se
        // recurre a la descarga tradicional como respaldo.
        const archivo = new File([blob], nombreArchivo, { type: "application/json" });
        const puedeCompartirArchivo = navigator.canShare && navigator.canShare({ files: [archivo] });

        if (puedeCompartirArchivo) {
          navigator.share({
            files: [archivo],
            title: "Respaldo Planificador de Operaciones",
          }).then(function () {
            if (msg) { msg.style.color = "#5FE3A1"; msg.textContent = "✅ Respaldo compartido (" + CAMPOS_PERSISTENTES.length + " conjuntos de datos)."; }
          }).catch(function (err) {
            // El usuario canceló la hoja de compartir, o falló: no es un error real
            // que deba mostrarse como fallo, salvo que no sea una cancelación.
            if (err && err.name !== "AbortError") {
              if (msg) { msg.style.color = "#E0524A"; msg.textContent = "❌ No se pudo compartir: " + err.message; }
            }
          });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = nombreArchivo;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          if (msg) { msg.style.color = "#5FE3A1"; msg.textContent = "✅ Respaldo descargado (" + CAMPOS_PERSISTENTES.length + " conjuntos de datos)."; }
        }
      };
    }

    const inputArchivo = document.getElementById("input-archivo-respaldo");
    const btnImportar = document.getElementById("btn-importar-respaldo");
    if (btnImportar && inputArchivo) {
      btnImportar.onclick = function () { inputArchivo.click(); };
      inputArchivo.onchange = function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const msg = document.getElementById("respaldo-mensaje");
          try {
            const data = JSON.parse(ev.target.result);
            if (!data || !Array.isArray(data.eventos)) {
              throw new Error("El archivo no tiene el formato esperado.");
            }
            // Restaura cada campo presente en el archivo, también de forma dinámica.
            // Los eventos siempre se restauran (incluso vacíos); el resto solo si
            // el archivo trae algo, para no borrar datos nuevos con un respaldo viejo
            // que no los conocía todavía.
            const detalle = [];
            CAMPOS_PERSISTENTES.forEach(function (c) {
              if (c.campo === "eventos") {
                state.eventos = data.eventos;
                detalle.push(data.eventos.length + " eventos");
                return;
              }
              if (Array.isArray(data[c.campo]) && data[c.campo].length) {
                state[c.campo] = data[c.campo];
                detalle.push(data[c.campo].length + " " + c.campo);
              }
            });
            persist();
            if (msg) { msg.style.color = "#5FE3A1"; msg.textContent = "✅ Respaldo restaurado: " + detalle.join(", ") + "."; }
            render();
          } catch (err) {
            if (msg) { msg.style.color = "#E0524A"; msg.textContent = "❌ No se pudo leer el archivo: " + err.message; }
            render();
          }
        };
        reader.readAsText(file);
      };
    }
  }

  // Si no estamos en la sección calendario, el resto de bindings de esa sección no aplica.
  if (state.seccion !== "calendario") {
    bindEventsPersonal();
    bindEventsDelegacion();
    bindEventsMolo();
    return;
  }

  // Sincronizar scroll horizontal entre el header de días (sticky) y el grid de celdas (vista mes)
  const dowWrap = document.getElementById("month-dow-wrap");
  const gridWrap = document.getElementById("month-grid-wrap");
  if (dowWrap && gridWrap) {
    let sincronizando = false;
    dowWrap.onscroll = function () {
      if (sincronizando) return;
      sincronizando = true;
      gridWrap.scrollLeft = dowWrap.scrollLeft;
      sincronizando = false;
    };
    gridWrap.onscroll = function () {
      if (sincronizando) return;
      sincronizando = true;
      dowWrap.scrollLeft = gridWrap.scrollLeft;
      sincronizando = false;
    };
  }

  // Tabs
  const tabAgenda = document.getElementById("tab-agenda");
  const tabSemana = document.getElementById("tab-semana");
  const tabMes = document.getElementById("tab-mes");
  if (tabAgenda) tabAgenda.onclick = function () { state.vista = "agenda"; render(); };
  if (tabSemana) tabSemana.onclick = function () { state.vista = "semana"; render(); };
  if (tabMes) tabMes.onclick = function () { state.vista = "mes"; render(); };

  // Panel de filtros agrupado (buscador, categorías, responsables, ocultar completadas)
  const btnAbrirPanelFiltros = document.getElementById("btn-abrir-panel-filtros");
  if (btnAbrirPanelFiltros) btnAbrirPanelFiltros.onclick = function () { state.panelFiltrosAbierto = true; render(); };
  const btnCerrarPanelFiltros = document.getElementById("btn-cerrar-panel-filtros");
  if (btnCerrarPanelFiltros) btnCerrarPanelFiltros.onclick = function () { state.panelFiltrosAbierto = false; render(); };
  const overlayPanelFiltros = document.getElementById("overlay-panel-filtros");
  if (overlayPanelFiltros) overlayPanelFiltros.onclick = function (e) { if (e.target === overlayPanelFiltros) { state.panelFiltrosAbierto = false; render(); } };

  document.querySelectorAll("[data-action='filtro-cat-check']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const id = el.getAttribute("data-id");
      const idx = state.filtroCategorias.indexOf(id);
      if (idx === -1) state.filtroCategorias.push(id); else state.filtroCategorias.splice(idx, 1);
      render();
    };
  });
  document.querySelectorAll("[data-action='filtro-resp-check']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const nombre = el.getAttribute("data-nombre");
      const idx = state.filtroResponsables.indexOf(nombre);
      if (idx === -1) state.filtroResponsables.push(nombre); else state.filtroResponsables.splice(idx, 1);
      render();
    };
  });
  document.querySelectorAll("[data-action='filtro-cat-todas']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroCategorias = []; render(); };
  });
  document.querySelectorAll("[data-action='filtro-cat-ninguna']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroCategorias = state.categorias.map(function (c) { return c.id; }); render(); };
  });
  document.querySelectorAll("[data-action='filtro-resp-todos']").forEach(function (el) {
    el.onclick = function (e) { e.stopPropagation(); state.filtroResponsables = []; render(); };
  });
  document.querySelectorAll("[data-action='filtro-resp-ninguno']").forEach(function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      const responsablesConDatos = Array.from(new Set(
        state.responsables.concat(state.eventos.map(function (ev) { return ev.responsable; }).filter(Boolean))
      ));
      state.filtroResponsables = responsablesConDatos;
      render();
    };
  });

  const btnToggleOcultarCal = document.getElementById("btn-toggle-ocultar-completadas-cal");
  if (btnToggleOcultarCal) btnToggleOcultarCal.onclick = function () { state.ocultarCompletadasCalendario = !state.ocultarCompletadasCalendario; render(); };

  const btnToggleInterdep = document.getElementById("btn-toggle-interdepartamental");
  if (btnToggleInterdep) btnToggleInterdep.onclick = function () { state.soloInterdepartamental = !state.soloInterdepartamental; render(); };

  const campoBusqueda = document.getElementById("campo-busqueda");
  if (campoBusqueda) {
    campoBusqueda.oninput = function (e) {
      state.busqueda = e.target.value;
      render();
      // Restaurar foco y posición del cursor tras el re-render (el input se reconstruye en el DOM).
      const nuevoInput = document.getElementById("campo-busqueda");
      if (nuevoInput) {
        nuevoInput.focus();
        const pos = nuevoInput.value.length;
        if (nuevoInput.setSelectionRange) nuevoInput.setSelectionRange(pos, pos);
      }
    };
  }
  const btnLimpiarBusqueda = document.getElementById("btn-limpiar-busqueda");
  if (btnLimpiarBusqueda) btnLimpiarBusqueda.onclick = function () { state.busqueda = ""; render(); };

  // Botones top
  const btnCategorias = document.getElementById("btn-categorias");
  if (btnCategorias) btnCategorias.onclick = function () { state.modal = "categorias"; state.panelFiltrosAbierto = false; render(); };
  const btnCompletadas = document.getElementById("btn-completadas");
  if (btnCompletadas) btnCompletadas.onclick = function () { state.modal = "completadas"; render(); };
  const btnNuevoEvento = document.getElementById("btn-nuevo-evento");
  if (btnNuevoEvento) btnNuevoEvento.onclick = function () { abrirNuevo(fmtISO(new Date())); };

  // Nav temporal
  const navPrev = document.getElementById("nav-prev");
  const navNext = document.getElementById("nav-next");
  const navHoy = document.getElementById("nav-hoy");
  if (navPrev) navPrev.onclick = function () {
    state.cursor = state.vista === "semana" ? addDays(state.cursor, -7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1);
    render();
  };
  if (navNext) navNext.onclick = function () {
    state.cursor = state.vista === "semana" ? addDays(state.cursor, 7) : new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1);
    render();
  };
  if (navHoy) navHoy.onclick = function () { state.cursor = new Date(); render(); };

  // Delegación de acciones por data-action dentro de #app
  app.querySelectorAll("[data-action]").forEach(function (el) {
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");
    const fecha = el.getAttribute("data-fecha");

    if (action === "toggle") el.onclick = function (e) { e.stopPropagation(); iniciarToggle(id, el.getAttribute("data-fecha-celda")); };
    else if (action === "hoy-boton") el.onclick = function (e) { e.stopPropagation(); moverAHoy(id); };
    else if (action === "export") el.onclick = function (e) {
      e.stopPropagation();
      const ev = state.eventos.find(function (e) { return e.id === id; });
      if (ev) downloadICS(ev);
    };
    else if (action === "editar") el.onclick = function () { iniciarEditar(id); };
    else if (action === "editar-fila") el.onclick = function () { iniciarEditar(id); };
    else if (action === "eliminar") el.onclick = function (e) { e.stopPropagation(); pedirConfirmacionEliminar(id); };
    else if (action === "export-dia") el.onclick = function (e) {
      e.stopPropagation();
      const evs = eventosPorFecha()[fecha] || [];
      downloadICSBatch(evs, "dia_" + fecha);
    };
    else if (action === "nuevo-fecha") el.onclick = function (e) { e.stopPropagation(); abrirNuevo(fecha); };
    else if (action === "toggle-dia-colapso") el.onclick = function () {
      state.diasColapsados[fecha] = !state.diasColapsados[fecha];
      render();
    };
    else if (action === "dia-click") el.onclick = function () {
      const hasEvents = el.getAttribute("data-has-events") === "1";
      if (hasEvents) { state.diaDetalle = fecha; state.modal = "detalleDia"; render(); }
      else abrirNuevo(fecha);
    };
    else if (action === "cerrar-modal") el.onclick = cerrarModal;
    else if (action === "del-categoria") el.onclick = function (e) { e.stopPropagation(); eliminarCategoria(id); };
    else if (action === "del-responsable") el.onclick = function (e) { e.stopPropagation(); eliminarResponsable(el.getAttribute("data-nombre")); };
    else if (action === "editar-categoria") el.onclick = function (e) { e.stopPropagation(); state.categoriaEditandoId = id; render(); };
    else if (action === "cancelar-editar-categoria") el.onclick = function (e) { e.stopPropagation(); state.categoriaEditandoId = null; render(); };
    else if (action === "guardar-categoria") el.onclick = function (e) {
      e.stopPropagation();
      const nombreInput = document.getElementById("cat-edit-nombre-" + id);
      const colorInput = document.getElementById("cat-edit-color-" + id);
      const nombre = (nombreInput && nombreInput.value.trim()) || "";
      const color = (colorInput && colorInput.value) || "#8AA0B5";
      if (!nombre) return;
      state.categorias = state.categorias.map(function (c) {
        return c.id === id ? Object.assign({}, c, { label: nombre.toUpperCase(), color: color }) : c;
      });
      state.categoriaEditandoId = null;
      persist();
      render();
    };
    else if (action === "editar-responsable") el.onclick = function (e) { e.stopPropagation(); state.responsableEditandoNombre = el.getAttribute("data-nombre"); render(); };
    else if (action === "cancelar-editar-responsable") el.onclick = function (e) { e.stopPropagation(); state.responsableEditandoNombre = null; render(); };
    else if (action === "guardar-responsable") el.onclick = function (e) {
      e.stopPropagation();
      const nombreOriginal = el.getAttribute("data-nombre-original");
      const input = document.getElementById("resp-edit-nombre-input");
      const nuevoNombre = (input && input.value.trim()) || "";
      if (!nuevoNombre) return;
      // Renombrar el responsable en la lista predefinida Y en todos los eventos
      // que ya lo tenían asignado, para mantener consistencia con los datos existentes.
      state.responsables = state.responsables.map(function (r) { return r === nombreOriginal ? nuevoNombre : r; });
      state.eventos = state.eventos.map(function (ev) {
        return ev.responsable === nombreOriginal ? Object.assign({}, ev, { responsable: nuevoNombre }) : ev;
      });
      state.responsableEditandoNombre = null;
      persist();
      render();
    };
  });

  // Cerrar overlay al tocar el fondo (no el modal)
  ["overlay-evento", "overlay-categorias", "overlay-detalle-dia", "overlay-completadas", "overlay-diagnostico"].forEach(function (oid) {
    const overlay = document.getElementById(oid);
    if (overlay) {
      overlay.onclick = function (e) { if (e.target === overlay) cerrarModal(); };
    }
  });

  // Modal de confirmación de eliminación (capa independiente, puede estar sobre otro modal)
  const overlayConfirmar = document.getElementById("overlay-confirmar-eliminar");
  if (overlayConfirmar) {
    overlayConfirmar.onclick = function (e) { if (e.target === overlayConfirmar) cancelarConfirmacionEliminar(); };
  }
  const btnCancelarEliminar = document.getElementById("btn-cancelar-eliminar");
  if (btnCancelarEliminar) btnCancelarEliminar.onclick = cancelarConfirmacionEliminar;
  const btnCancelarEliminar2 = document.getElementById("btn-cancelar-eliminar-2");
  if (btnCancelarEliminar2) btnCancelarEliminar2.onclick = cancelarConfirmacionEliminar;
  const btnConfirmarEliminar = document.getElementById("btn-confirmar-eliminar");
  if (btnConfirmarEliminar) btnConfirmarEliminar.onclick = confirmarEliminar;

  /* ---------- Modal evento: lógica específica ---------- */
  if (state.modal === "evento") {
    const fechaInicioInput = document.getElementById("ev-fecha");
    const fechaFinInput = document.getElementById("ev-fecha-fin");
    if (fechaInicioInput && fechaFinInput) {
      fechaInicioInput.onchange = function () {
        fechaFinInput.min = fechaInicioInput.value;
        if (fechaFinInput.value < fechaInicioInput.value) fechaFinInput.value = fechaInicioInput.value;
      };
    }

    // Al ingresar la hora de inicio en un evento NUEVO (no al editar uno existente,
    // para no pisar una hora de término que el usuario ya haya definido a mano),
    // se actualiza automáticamente la hora de término a 30 minutos después.
    // Se escuchan tanto "input" como "change" porque el selector nativo de hora en
    // iOS Safari no siempre dispara "change" de forma confiable en cada interacción.
    const horaInicioInput = document.getElementById("ev-hora");
    const horaFinInput = document.getElementById("ev-hora-fin");
    if (horaInicioInput && horaFinInput && !state.eventoEditando) {
      const actualizarHoraFinAuto = function () {
        if (!horaInicioInput.value) return;
        horaFinInput.value = calcularHoraTermino(horaInicioInput.value, 30).split(" ")[0];
      };
      horaInicioInput.onchange = actualizarHoraFinAuto;
      horaInicioInput.oninput = actualizarHoraFinAuto;
    }

    const repetirSelect = document.getElementById("ev-repetir");
    const repetirHastaWrap = document.getElementById("ev-repetir-hasta-wrap");
    if (repetirSelect && repetirHastaWrap) {
      repetirSelect.onchange = function () {
        repetirHastaWrap.style.display = repetirSelect.value === "nunca" ? "none" : "";
      };
    }

    // Subtareas: agregar, togglear, quitar (manteniendo el resto del formulario
    // intacto, re-renderizando solo lo necesario para no perder lo escrito).
    function refrescarFormularioTrasSubtarea() {
      // Antes de re-renderizar, capturamos el valor actual de los campos del
      // formulario para no perderlos al reconstruir el HTML del modal.
      const snapshot = {
        titulo: (document.getElementById("ev-titulo") || {}).value,
        fecha: (document.getElementById("ev-fecha") || {}).value,
        fechaFin: (document.getElementById("ev-fecha-fin") || {}).value,
        hora: (document.getElementById("ev-hora") || {}).value,
        horaFin: (document.getElementById("ev-hora-fin") || {}).value,
        lugar: (document.getElementById("ev-lugar") || {}).value,
        notas: (document.getElementById("ev-notas") || {}).value,
        interdepartamental: (document.getElementById("ev-interdepartamental") || {}).checked,
        repetir: (document.getElementById("ev-repetir") || {}).value,
        repetirHasta: (document.getElementById("ev-repetir-hasta") || {}).value,
      };
      render();
      const ti = document.getElementById("ev-titulo"); if (ti && snapshot.titulo !== undefined) ti.value = snapshot.titulo;
      const fi = document.getElementById("ev-fecha"); if (fi && snapshot.fecha) fi.value = snapshot.fecha;
      const ff = document.getElementById("ev-fecha-fin"); if (ff && snapshot.fechaFin) ff.value = snapshot.fechaFin;
      const hi = document.getElementById("ev-hora"); if (hi && snapshot.hora) hi.value = snapshot.hora;
      const hf = document.getElementById("ev-hora-fin"); if (hf && snapshot.horaFin) hf.value = snapshot.horaFin;
      const lu = document.getElementById("ev-lugar"); if (lu && snapshot.lugar !== undefined) lu.value = snapshot.lugar;
      const no = document.getElementById("ev-notas"); if (no && snapshot.notas !== undefined) no.value = snapshot.notas;
      const idep = document.getElementById("ev-interdepartamental"); if (idep) idep.checked = !!snapshot.interdepartamental;
      const rep = document.getElementById("ev-repetir"); if (rep && snapshot.repetir) rep.value = snapshot.repetir;
      const repH = document.getElementById("ev-repetir-hasta"); if (repH && snapshot.repetirHasta) repH.value = snapshot.repetirHasta;
      const repHWrap = document.getElementById("ev-repetir-hasta-wrap");
      if (repHWrap) repHWrap.style.display = (snapshot.repetir === "nunca" || !snapshot.repetir) ? "none" : "";
    }

    const btnAddSubtarea = document.getElementById("btn-add-subtarea");
    const nuevaSubtareaInput = document.getElementById("nueva-subtarea");
    function agregarSubtareaTemp() {
      const texto = nuevaSubtareaInput ? nuevaSubtareaInput.value.trim() : "";
      if (!texto) return;
      state.subtareasTemp.push({ id: uid(), texto: texto, hecho: false });
      refrescarFormularioTrasSubtarea();
      const ns = document.getElementById("nueva-subtarea");
      if (ns) ns.focus();
    }
    if (btnAddSubtarea) btnAddSubtarea.onclick = agregarSubtareaTemp;
    if (nuevaSubtareaInput) {
      nuevaSubtareaInput.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); agregarSubtareaTemp(); } };
    }
    document.querySelectorAll("[data-subtarea-toggle]").forEach(function (btn) {
      btn.onclick = function () {
        const id = btn.getAttribute("data-subtarea-toggle");
        state.subtareasTemp = state.subtareasTemp.map(function (st) {
          return st.id === id ? Object.assign({}, st, { hecho: !st.hecho }) : st;
        });
        refrescarFormularioTrasSubtarea();
      };
    });
    document.querySelectorAll("[data-subtarea-quitar]").forEach(function (btn) {
      btn.onclick = function () {
        const id = btn.getAttribute("data-subtarea-quitar");
        state.subtareasTemp = state.subtareasTemp.filter(function (st) { return st.id !== id; });
        refrescarFormularioTrasSubtarea();
      };
    });

    const respSel = document.getElementById("ev-responsable");
    if (respSel) {
      respSel.onchange = function (e) {
        if (e.target.value === "__libre__") {
          // re-render forzando modo libre: simulamos guardando un responsable temporal vacío marcado
          const tempEv = Object.assign({}, state.eventoEditando || {}, { responsable: " " });
          // truco simple: usamos un dataset para forzar modo libre
          document.getElementById("resp-wrap").innerHTML =
            '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
          document.getElementById("btn-resp-volver").onclick = function () {
            document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
            bindRespSelect();
          };
          actualizarVisibilidadEstadoAvance();
          const respLibreInput = document.getElementById("ev-responsable-libre");
          if (respLibreInput) respLibreInput.oninput = actualizarVisibilidadEstadoAvance;
        } else {
          actualizarVisibilidadEstadoAvance();
        }
      };
    }
    const btnRespVolver = document.getElementById("btn-resp-volver");
    if (btnRespVolver) {
      btnRespVolver.onclick = function () {
        document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
        bindRespSelect();
        actualizarVisibilidadEstadoAvance();
      };
    }
    const respLibreInputInicial = document.getElementById("ev-responsable-libre");
    if (respLibreInputInicial) respLibreInputInicial.oninput = actualizarVisibilidadEstadoAvance;

    function actualizarVisibilidadEstadoAvance() {
      const wrap = document.getElementById("ev-estado-avance-wrap");
      if (!wrap) return;
      const respLibre = document.getElementById("ev-responsable-libre");
      const respSelectAhora = document.getElementById("ev-responsable");
      const valorResp = respLibre ? respLibre.value.trim() : (respSelectAhora ? respSelectAhora.value : "");
      wrap.style.display = valorResp ? "" : "none";
    }

    const estadoAvanceRow = document.getElementById("ev-estado-avance-row");
    if (estadoAvanceRow) {
      estadoAvanceRow.querySelectorAll("[data-estado-avance]").forEach(function (btn) {
        btn.onclick = function () {
          const estadoId = btn.getAttribute("data-estado-avance");
          estadoAvanceRow.dataset.value = estadoId;
          estadoAvanceRow.querySelectorAll("[data-estado-avance]").forEach(function (b2) {
            const eid = b2.getAttribute("data-estado-avance");
            const es = estadoDelegacionById(eid);
            const activo = eid === estadoId;
            b2.style.background = activo ? es.color : "transparent";
            b2.style.color = activo ? "#0B1B2B" : es.color;
          });
        };
      });
    }

    // Botones de prioridad (sin re-render completo, solo toggle visual + estado en dataset)
    const prioRow = document.getElementById("prio-row");
    if (prioRow) {
      let prioridadActual = (state.eventoEditando && state.eventoEditando.prioridad) || "media";
      prioRow.querySelectorAll(".prio-btn").forEach(function (btn) {
        btn.onclick = function () {
          prioridadActual = btn.getAttribute("data-prio");
          prioRow.querySelectorAll(".prio-btn").forEach(function (b2) {
            const pid = b2.getAttribute("data-prio");
            const p = prioById(pid);
            const active = pid === prioridadActual;
            b2.style.background = active ? p.color : "transparent";
            b2.style.color = active ? "#0B1B2B" : p.color;
          });
          prioRow.dataset.value = prioridadActual;
        };
      });
      prioRow.dataset.value = prioridadActual;
    }

    const btnGuardar = document.getElementById("btn-guardar-evento");
    if (btnGuardar) {
      btnGuardar.onclick = function () {
        const titulo = document.getElementById("ev-titulo").value;
        const fecha = document.getElementById("ev-fecha").value;
        let fechaFin = document.getElementById("ev-fecha-fin").value || fecha;
        const hora = document.getElementById("ev-hora").value;
        const horaFin = document.getElementById("ev-hora-fin").value;
        const repetir = document.getElementById("ev-repetir").value;
        const repetirHastaInput = document.getElementById("ev-repetir-hasta");
        const repetirHasta = (repetirHastaInput && repetirHastaInput.value) ? repetirHastaInput.value : "";
        const categoria = document.getElementById("ev-categoria").value;
        const respLibre = document.getElementById("ev-responsable-libre");
        const respSelect = document.getElementById("ev-responsable");
        const responsable = (respLibre ? respLibre.value : (respSelect ? respSelect.value : "")).trim();
        const lugar = document.getElementById("ev-lugar").value;
        const notas = document.getElementById("ev-notas").value;
        const interdepartamental = !!(document.getElementById("ev-interdepartamental") || {}).checked;
        const prioridad = (document.getElementById("prio-row") || {}).dataset
          ? document.getElementById("prio-row").dataset.value
          : "media";
        const estadoAvanceRowEl = document.getElementById("ev-estado-avance-row");
        const estadoAvance = (estadoAvanceRowEl && estadoAvanceRowEl.dataset.value) || "no_iniciada";

        const errorBox = document.getElementById("ev-error");
        if (!titulo.trim()) { errorBox.innerHTML = '<div class="error-text cond">El título es obligatorio.</div>'; return; }
        if (!fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha es obligatoria.</div>'; return; }
        if (fechaFin < fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha de término no puede ser anterior a la fecha de inicio.</div>'; return; }
        if (repetir !== "nunca" && repetirHasta && repetirHasta < fecha) { errorBox.innerHTML = '<div class="error-text cond">La fecha de la última repetición no puede ser anterior a la fecha de inicio.</div>'; return; }

        // Duración derivada de hora inicio/término (si término es menor, se asume que cruza a la madrugada del día siguiente).
        const minIni = (function () { const p = hora.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]); })();
        const minFin = (function () { const p = horaFin.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]); })();
        let duracion = minFin - minIni;
        if (duracion <= 0) duracion += 1440;
        if (duracion <= 0) { errorBox.innerHTML = '<div class="error-text cond">La hora de término debe ser distinta a la de inicio.</div>'; return; }

        // Si el responsable fue escrito a mano y no existe todavía en la lista
        // predefinida, se agrega automáticamente para reutilizarlo en el futuro.
        if (responsable && state.responsables.indexOf(responsable) === -1) {
          state.responsables.push(responsable);
        }

        guardarEvento({
          titulo: titulo.trim(), fecha: fecha, fechaFin: fechaFin, hora: hora, duracion: duracion,
          repetir: repetir, repetirHasta: repetir !== "nunca" ? repetirHasta : "",
          categoria: categoria, responsable: responsable, prioridad: prioridad || "media",
          lugar: lugar.trim(), notas: notas.trim(), subtareas: state.subtareasTemp.slice(),
          interdepartamental: interdepartamental,
          estadoDelegacion: responsable ? estadoAvance : undefined,
          completado: responsable ? (estadoAvance === "lista") : ((state.eventoEditando && state.eventoEditando.completado) || false),
        });
      };
    }
  }

  /* ---------- Modal categorías: lógica específica ---------- */
  if (state.modal === "categorias") {
    const btnAddCat = document.getElementById("btn-add-categoria");
    if (btnAddCat) {
      btnAddCat.onclick = function () {
        const nombre = document.getElementById("nueva-cat-nombre").value;
        const color = document.getElementById("nueva-cat-color").value;
        agregarCategoria(nombre, color);
      };
    }
    const nuevaCatInput = document.getElementById("nueva-cat-nombre");
    if (nuevaCatInput) {
      nuevaCatInput.onkeydown = function (e) {
        if (e.key === "Enter") {
          const color = document.getElementById("nueva-cat-color").value;
          agregarCategoria(nuevaCatInput.value, color);
        }
      };
    }
    const btnAddResp = document.getElementById("btn-add-responsable");
    if (btnAddResp) {
      btnAddResp.onclick = function () {
        const nombre = document.getElementById("nuevo-resp-nombre").value;
        agregarResponsable(nombre);
      };
    }
    const nuevoRespInput = document.getElementById("nuevo-resp-nombre");
    if (nuevoRespInput) {
      nuevoRespInput.onkeydown = function (e) {
        if (e.key === "Enter") agregarResponsable(nuevoRespInput.value);
      };
    }
  }

  /* ---------- Modal detalle día ---------- */
  if (state.modal === "detalleDia") {
    const btnAgregarDia = document.getElementById("btn-agregar-dia");
    if (btnAgregarDia) {
      btnAgregarDia.onclick = function () {
        const fecha = state.diaDetalle;
        state.modal = null;
        abrirNuevo(fecha);
      };
    }
  }

}

function renderRespSelectOnly(selected) {
  const respOptions = state.responsables.map(function (r) {
    return '<option value="' + escapeHTML(r) + '"' + (selected === r ? " selected" : "") + '>' + escapeHTML(r) + '</option>';
  }).join("");
  return '<select class="field" id="ev-responsable"><option value="">— Sin asignar —</option>' + respOptions + '<option value="__libre__">✎ Escribir otro nombre…</option></select>';
}
function bindRespSelect() {
  const respSel = document.getElementById("ev-responsable");
  if (respSel) {
    respSel.onchange = function (e) {
      if (e.target.value === "__libre__") {
        document.getElementById("resp-wrap").innerHTML =
          '<div style="display:flex;gap:6px"><input class="field" id="ev-responsable-libre" value="" placeholder="Nombre del responsable" style="flex:1" /><button class="iconbtn" id="btn-resp-volver" style="width:38px" title="Volver a lista">' + icon("x", 14) + '</button></div>';
        document.getElementById("btn-resp-volver").onclick = function () {
          document.getElementById("resp-wrap").innerHTML = renderRespSelectOnly("");
          bindRespSelect();
        };
      }
    };
  }
}

/* ---------- Fecha en vivo (actualiza solo el texto, sin re-render completo) ---------- */
setInterval(function () {
  const clockEl = document.getElementById("dtg-clock");
  if (clockEl) clockEl.textContent = fmtFechaLarga(new Date());
}, 30000);

/* ---------- Re-bloqueo automático por PIN tras tiempo en segundo plano ----------
   Si la app pasa a segundo plano (se minimiza, cambias de app, se apaga la
   pantalla) y vuelve después de más de UMBRAL_REBLOQUEO_MS, se vuelve a pedir
   el PIN, igual que al abrir la app por primera vez. Si vuelve antes de ese
   tiempo, no se interrumpe al usuario (evita pedir el PIN por cambios breves
   de app, como copiar algo del WhatsApp). */
const UMBRAL_REBLOQUEO_MS = 60 * 1000; // 1 minuto
let momentoOcultamiento = null;

document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    momentoOcultamiento = Date.now();
  } else {
    if (momentoOcultamiento !== null) {
      const tiempoOculto = Date.now() - momentoOcultamiento;
      momentoOcultamiento = null;
      if (tiempoOculto >= UMBRAL_REBLOQUEO_MS && loadLocal(PIN_KEY, null)) {
        state.pantallaBloqueada = true;
        state.pinModoCreacion = null;
        state.pinVerificandoParaCambiar = false;
        state.pinTemp = "";
        state.pinError = "";
        render();
      }
    }
  }
});

/* ---------- Arranque ---------- */
render();

/* ---------- Service Worker real para funcionamiento sin internet ----------
   Registrado desde un archivo sw.js propio (no Blob), que es el método
   estándar y confiable, incluyendo en Safari/iOS 16.4+.
   La ruta es relativa para funcionar correctamente bajo la subcarpeta
   de GitHub Pages (https://usuario.github.io/nombre-repo/).
   Se registra inmediatamente (sin esperar "load") y se expone su estado
   en window.swEstado para poder verificarlo desde la propia interfaz. */
window.swEstado = { soportado: false, registrado: false, cacheado: false, error: null };

if ("serviceWorker" in navigator) {
  window.swEstado.soportado = true;
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
    window.swEstado.registrado = true;
    // Forzar el cacheo explícito de la página actual completa (URL absoluta),
    // como refuerzo adicional al cache.addAll() que ya hace sw.js en su evento "install".
    if ("caches" in window) {
      caches.open("bitacora-operativa-v1").then(function (cache) {
        return Promise.all([
          cache.add(window.location.href),
          cache.add(new URL("./index.html", window.location.href).href),
          cache.add(new URL("./manifest.json", window.location.href).href),
        ]);
      }).then(function () {
        window.swEstado.cacheado = true;
      }).catch(function (err) {
        window.swEstado.error = "Error al cachear: " + err.message;
      });
    }
  }).catch(function (err) {
    window.swEstado.error = "Error al registrar: " + err.message;
  });
} else {
  window.swEstado.error = "Este navegador no soporta Service Workers.";
}
</script>
